name: Bug report
description: Report a reproducible defect in the rebuilt VyrnForge foundation, packages, documentation, or tooling.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        VyrnForge is in a clean-slate rebuild. Report observed behavior without assuming a framework owns a shared defect. Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core
        - Web / styling
        - Icons
        - React
        - Angular
        - Vue
        - Elements
        - Documentation
        - Testing / CI / tooling
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: During bootstrap, prefer the commit SHA or branch where you reproduced the issue.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction steps or repository path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected observable behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual observable behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include browser, runtime, framework, server, operating system, or assistive technology only when relevant.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility or interaction impact
      description: Include keyboard, focus, semantics, assistive technology, forced-colors, reduced-motion, directionality, or form impact when applicable.
