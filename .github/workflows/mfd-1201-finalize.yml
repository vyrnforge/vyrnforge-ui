name: MFD-1201 finalize Angular workspace

on:
  push:
    branches:
      - mfd-1201-angular-public-package

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Integrate Angular workspace into root scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const insertAfter = (value, needle, addition) => {
            if (value.includes(addition)) return value;
            if (!value.includes(needle)) throw new Error(`Missing expected script fragment: ${needle}`);
            return value.replace(needle, `${needle}${addition}`);
          };

          pkg.scripts['build:packages'] = insertAfter(
            pkg.scripts['build:packages'],
            ' && npm run build --workspace @vyrnforge/ui-elements',
            ' && npm run build --workspace @vyrnforge/ui-angular',
          );
          pkg.scripts.lint = insertAfter(
            pkg.scripts.lint,
            ' && npm run lint --workspace @vyrnforge/ui-elements',
            ' && npm run lint --workspace @vyrnforge/ui-angular',
          );
          pkg.scripts['lint:fix'] = insertAfter(
            pkg.scripts['lint:fix'],
            ' && npm run lint:fix --workspace @vyrnforge/ui-elements',
            ' && npm run lint:fix --workspace @vyrnforge/ui-angular',
          );
          pkg.scripts.typecheck = insertAfter(
            pkg.scripts.typecheck,
            ' && npm run typecheck --workspace @vyrnforge/ui-elements',
            ' && npm run typecheck --workspace @vyrnforge/ui-angular',
          );
          pkg.scripts.test = insertAfter(
            pkg.scripts.test,
            ' && npm run test --workspace @vyrnforge/ui-elements',
            ' && npm run test --workspace @vyrnforge/ui-angular',
          );

          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Refresh lockfile and repository inventory
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          node scripts/governance/generate-repository-inventory.mjs

      - name: Commit generated integration updates
        shell: bash
        run: |
          rm .github/workflows/mfd-1201-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json docs/governance/repository-inventory.md .github/workflows/mfd-1201-finalize.yml
          git commit -m 'chore(angular): integrate MFD-1201 workspace'
          git push origin HEAD:mfd-1201-angular-public-package
