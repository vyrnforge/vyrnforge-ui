name: One-shot post-rollout cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'chore/post-rollout-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply cleanup and regenerate inventory
        run: node scripts/post-rollout-cleanup.mjs

      - name: Commit cleanup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: finish post-rollout cleanup"
          git push origin HEAD:${{ github.head_ref }}
