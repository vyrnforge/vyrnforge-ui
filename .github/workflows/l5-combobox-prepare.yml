name: L5 Combobox relationship preparation
on:
  push:
    branches: [fix/l5-combobox-relationships]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format canonical component source
        run: pnpm exec prettier --write "product/components/composite-widgets/collection-selection/combobox/**/*.{ts,mjs,json,md}"
      - run: pnpm lint:l5
      - run: pnpm exec nx run-many -t build --projects=@vyrnforge/react,@vyrnforge/vue
      - run: pnpm verify:api:update --packages react,vue
      - name: Record generated diff
        run: git diff --no-color -- "product/components/composite-widgets/collection-selection/combobox" packages/react/etc/react.api.md packages/vue/etc/vue.api.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: combobox-prepared
          path: |
            product/components/composite-widgets/collection-selection/combobox/react/index.ts
            product/components/composite-widgets/collection-selection/combobox/vue/index.ts
            product/components/composite-widgets/collection-selection/combobox/test/browser/fixtures.mjs
            product/components/composite-widgets/collection-selection/combobox/test/browser/tests/combobox.spec.mjs
            product/components/composite-widgets/collection-selection/combobox/accessibility.json
            product/components/composite-widgets/collection-selection/combobox/changes/root-relationships.md
            packages/react/etc/react.api.md
            packages/vue/etc/vue.api.md
          if-no-files-found: error
          retention-days: 7
