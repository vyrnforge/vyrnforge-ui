name: Controlled npm Release

on:
  workflow_dispatch:
    inputs:
      release-group:
        description: Canonical release line id from docs/metadata/release-groups.json
        required: true
        default: non-grid-beta
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vyrnforge-npm-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
      ci-run-id: ${{ steps.candidate.outputs.ci-run-id }}
      release-version: ${{ steps.release-inputs.outputs.version }}
      dist-tag: ${{ steps.release-inputs.outputs.dist-tag }}
      git-tag: ${{ steps.release-inputs.outputs.git-tag }}
      release-name: ${{ steps.release-inputs.outputs.release-name }}
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve successful current-main CI run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha'
          )"
          test "$GITHUB_SHA" = "$CURRENT_MAIN_SHA"

          CI_RUN_ID="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\") | .id" |
              sed -n '1p'
          )"

          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful VyrnForge CI push run exists for current main commit $GITHUB_SHA."
            exit 1
          fi

          echo "ci-run-id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve canonical release inputs
        id: release-inputs
        run: >-
          node scripts/resolve-release-selection.mjs
          --release-group "$RELEASE_GROUP"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Use supported npm CLI
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 18) process.exit(1)'
          node -e 'const actual = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const expected = require("./package.json").packageManager.split("@").pop(); if (actual !== expected) process.exit(1)'

      - name: Install release tooling dependencies
        run: npm ci

      - name: Verify release candidate inputs and registry availability
        run: node scripts/verify-release-candidate.mjs --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG"

      - name: Verify trusted-publishing and provenance contract
        run: npm run verify:trusted-publishing-provenance

      - name: Prepare immutable release artifact once
        run: >-
          npm run prepare:release-artifact --
          --release-group "$RELEASE_GROUP"
          --version "$RELEASE_VERSION"
          --dist-tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA"
          --ci-run-id "${{ steps.candidate.outputs.ci-run-id }}"

      - name: Verify exact release tarballs and consumer
        run: >-
          npm run verify:release-artifact --
          --release-group "$RELEASE_GROUP"
          --version "$RELEASE_VERSION"
          --dist-tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA"
          --ci-run-id "${{ steps.candidate.outputs.ci-run-id }}"
          --artifact-dir test-results/release-artifact

      - name: Dry-run exact release tarballs without registry credentials
        run: >-
          npm run verify:trusted-publishing-dry-run --
          --release-group "$RELEASE_GROUP"
          --version "$RELEASE_VERSION"
          --dist-tag "$RELEASE_TAG"
          --artifact-dir test-results/release-artifact

      - name: Verify release-line size budgets
        run: >-
          npm run verify:release-size-budgets --
          --release-group "$RELEASE_GROUP"
          --artifact-dir test-results/release-artifact

      - name: Verify assistive-technology evidence or approved beta waiver
        if: inputs.release-group == 'non-grid-beta'
        run: npm run verify:assistive-technology:release -- --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --allow-waiver

      - name: Verify clean tracked source state
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Resolve release artifact name
        id: artifact-name
        shell: bash
        run: |
          echo "name=npm-release-$RELEASE_GROUP-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: test-results/release-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Write verification summary
        shell: bash
        run: |
          {
            echo "## VyrnForge npm release verification"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Candidate version: \`$RELEASE_VERSION\`"
            echo "- Dist-tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Main CI run: \`${{ steps.candidate.outputs.ci-run-id }}\`"
            echo "- Artifact: \`${{ steps.artifact-name.outputs.name }}\`"
            echo "- Build policy: selected release dependency closure built once"
            echo "- Publication policy: only the retained, digest-bound tarballs may be published"
            echo "- Credentials: verification requested no npm OIDC and used no long-lived npm token"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-packages:
    name: publish-packages
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}
      RELEASE_VERSION: ${{ needs.verify-release.outputs.release-version }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.dist-tag }}
      VYRNFORGE_RELEASE_VERSION: ${{ needs.verify-release.outputs.release-version }}

    steps:
      - name: Checkout release tooling from the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use supported npm CLI
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          node -e 'const actual = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const expected = require("./package.json").packageManager.split("@").pop(); if (actual !== expected) process.exit(1)'

      - name: Download exact verified release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf test-results/release-artifact
          mkdir -p test-results/release-artifact
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ needs.verify-release.outputs.artifact-name }}" \
            --dir test-results/release-artifact

      - name: Revalidate artifact lineage and digests
        run: >-
          node scripts/verify-release-artifact.mjs
          --release-group "$RELEASE_GROUP"
          --version "$RELEASE_VERSION"
          --dist-tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA"
          --ci-run-id "${{ needs.verify-release.outputs.ci-run-id }}"
          --artifact-dir test-results/release-artifact
          --skip-consumer

      - name: Resolve current main publication boundary
        id: publication-main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha'
          )"
          echo "sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish exact verified tarballs through npm OIDC
        run: >-
          node scripts/publish-release-artifact.mjs
          --release-group "$RELEASE_GROUP"
          --version "$RELEASE_VERSION"
          --dist-tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA"
          --ci-run-id "${{ needs.verify-release.outputs.ci-run-id }}"
          --current-main "${{ steps.publication-main.outputs.sha }}"
          --artifact-dir test-results/release-artifact

      - name: Write publication summary
        shell: bash
        run: |
          {
            echo "## VyrnForge npm publication"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Candidate version: \`$RELEASE_VERSION\`"
            echo "- Dist-tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Artifact: \`${{ needs.verify-release.outputs.artifact-name }}\`"
            echo "- Publication: exact verified .tgz files only"
            echo "- Retry rule: an existing version is skipped only when registry integrity and shasum match the retained tarball"
            echo "- Credentials: GitHub OIDC trusted publishing only; no long-lived token"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-registry-release:
    name: verify-registry-release
    needs: [publish-packages, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}
      RELEASE_VERSION: ${{ needs.verify-release.outputs.release-version }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.dist-tag }}

    steps:
      - name: Checkout published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Verify registry metadata and fresh consumer
        run: node scripts/verify-registry-release.mjs --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG"

      - name: Write registry verification summary
        run: |
          {
            echo "## Registry and consumer verification"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Exact version: \`$RELEASE_VERSION\`"
            echo "- Authoritative prerelease tag: \`$RELEASE_TAG\`"
            echo "- Package metadata and exact dependency graph verified"
            echo "- npm registry signatures and provenance attestations verified"
            echo "- Fresh registry consumer typecheck and production build passed"
          } >> "$GITHUB_STEP_SUMMARY"

  create-release-record:
    name: create-release-record
    needs: [verify-registry-release, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}
      RELEASE_VERSION: ${{ needs.verify-release.outputs.release-version }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.dist-tag }}
      RELEASE_GIT_TAG: ${{ needs.verify-release.outputs.git-tag }}
      RELEASE_NAME: ${{ needs.verify-release.outputs.release-name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate release notes
        run: node scripts/create-release-notes.mjs --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --output release-notes.md

      - name: Create or verify annotated tag and GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_GIT_TAG"
          TITLE="$RELEASE_NAME"

          git fetch origin --tags --force
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "$RELEASE_NAME"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --prerelease \
              --notes-file release-notes.md
          fi

      - name: Write release-record summary
        run: |
          {
            echo "## GitHub release record"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Tag: \`$RELEASE_GIT_TAG\`"
            echo "- GitHub Release: present as prerelease"
            echo "- Retry rule: an existing tag is accepted only when it resolves to this workflow commit"
            echo "- Permission separation: repository write access only; no npm OIDC permission"
          } >> "$GITHUB_STEP_SUMMARY"
