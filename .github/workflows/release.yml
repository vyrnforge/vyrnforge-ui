name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - 'acceptance/1183-final-assurance'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: semantic-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser_ports: ${{ steps.impact.outputs.browser_ports }}
      browser_scopes: ${{ steps.impact.outputs.browser_scopes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record release broad semantic impact
        id: impact
        run: |
          mkdir -p test-results
          node tooling/impact/plan.mjs --mode release --output test-results/semantic-impact.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-impact-release-${{ github.run_id }}
          path: test-results/semantic-impact.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Changesets release intent
        run: pnpm verify:release
      - name: Run broad repository validation
        run: pnpm check
      - name: Verify packed packages, public API, and clean consumers
        run: pnpm verify:packages
      - name: Verify documentation build
        run: pnpm build:docs
      - name: Verify tracked generated artifacts are clean
        run: git diff --exit-code
      - name: Preserve private-rebuild release boundary
        run: echo "Release Readiness is machine evidence only; publication and required human AT/usability acceptance remain separate."

  browser-matrix:
    needs: plan
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: ${{ needs.plan.outputs.browser_scopes }}
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: release
      retention_days: 30
