name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute complete required release graph
        run: node tooling/impact/execute.mjs --mode release --output test-results/validation-plan.json
      - name: Upload release validation plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-plan-release
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 30
