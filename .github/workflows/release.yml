name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute complete required release graph
        run: node tooling/impact/execute.mjs --mode release --output test-results/validation-plan.json
      - name: Upload release validation plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan-release
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload release browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-release
          path: |
            test-results/playwright-report
            test-results/playwright-results
          if-no-files-found: ignore
          retention-days: 30
