name: Format Reference branch

on:
  push:
    branches:
      - issue-769-reference-examples-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-769-reference-examples-v2
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format Reference files
        run: |
          npx prettier --write             apps/docs/src/App.tsx             apps/docs/src/ComponentReferencePage.tsx             apps/docs/src/examples/MigratedExamplePage.tsx             apps/docs/src/ReferenceNavigation.tsx             apps/docs/src/ReferenceShell.tsx             apps/docs/src/styles/docs.css             apps/docs/src/styles/reference-shell.css             docs/engineering/reference-ui-presentation-contract.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/docs/src/App.tsx             apps/docs/src/ComponentReferencePage.tsx             apps/docs/src/examples/MigratedExamplePage.tsx             apps/docs/src/ReferenceNavigation.tsx             apps/docs/src/ReferenceShell.tsx             apps/docs/src/styles/docs.css             apps/docs/src/styles/reference-shell.css             docs/engineering/reference-ui-presentation-contract.md
          git commit -m "style(docs): apply repository formatting"
          git push origin HEAD:issue-769-reference-examples-v2
