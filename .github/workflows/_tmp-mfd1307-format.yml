name: tmp-mfd1307-format
on:
  push:
    branches:
      - feat/MFD-1307-vue-type-surface-v2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1307-vue-type-surface-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npx prettier --write packages/ui-vue/src/zero-config.test.ts
      - name: Commit formatted task tree
        run: |
          rm .github/workflows/_tmp-mfd1307-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(vue): format zero-config timeout"
          git push origin HEAD:feat/MFD-1307-vue-type-surface-v2
