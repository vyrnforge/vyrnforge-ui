name: Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: true

jobs:
  main-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute scoped main validation plan
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/impact/execute.mjs --mode main --base "$BASE_SHA" --head "$HEAD_SHA" --output test-results/validation-plan.json
      - name: Upload validation plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan-main
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-main
          path: |
            test-results/playwright-report
            test-results/playwright-results
            test-results/*-playwright-report
            test-results/*-playwright-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload documentation build when selected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vyrnforge-docs-next
          path: dist/docs
          if-no-files-found: ignore
          retention-days: 7
