name: Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: true

jobs:
  targeted-validation:
    uses: ./.github/workflows/_targeted-validation.yml
    with:
      mode: main
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}
      artifact_suffix: main-${{ github.sha }}
      retention_days: 14
      upload_docs_artifact: true

  main-gate:
    name: main-gate
    if: always()
    needs: targeted-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require targeted validation
        env:
          TARGETED_VALIDATION: ${{ needs.targeted-validation.result }}
        run: |
          if [ "$TARGETED_VALIDATION" != "success" ]; then
            echo "Targeted validation did not succeed: $TARGETED_VALIDATION" >&2
            exit 1
          fi
          echo "All selected VyrnForge Main evidence passed."
