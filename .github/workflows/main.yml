name: Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: true

jobs:
  main-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record semantic impact
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p test-results
          node tooling/impact/plan.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" > test-results/semantic-impact.json
      - name: Run affected Nx validation
        env:
          NX_BASE: ${{ github.event.before }}
          NX_HEAD: ${{ github.sha }}
        run: pnpm exec nx affected -t lint,typecheck,test,build --base="$NX_BASE" --head="$NX_HEAD"
      - name: Verify packed packages
        run: pnpm verify:packages
      - name: Build documentation
        run: pnpm build:docs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-impact-main-${{ github.sha }}
          path: test-results/semantic-impact.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vyrnforge-docs-next-${{ github.sha }}
          path: dist/docs
          if-no-files-found: error
          retention-days: 14
