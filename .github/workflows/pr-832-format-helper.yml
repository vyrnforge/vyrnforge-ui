name: PR 832 format helper

on:
  push:
    branches:
      - feat/shared-icon-svg-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/shared-icon-svg-foundation
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Fix ES2020 compatibility and format
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "packages/ui-core/src/icons.ts";
          let source = fs.readFileSync(file, "utf8");
          source = source
            .replace('.replaceAll("&", "&amp;")', '.replace(/&/gu, "&amp;")')
            .replace('.replaceAll(\'"\', "&quot;")', '.replace(/"/gu, "&quot;")')
            .replace('.replaceAll("<", "&lt;")', '.replace(/</gu, "&lt;")')
            .replace('.replaceAll(">", "&gt;")', '.replace(/>/gu, "&gt;")');
          fs.writeFileSync(file, source);
          NODE
          npx prettier --write packages/ui-core/src/icons.ts packages/ui-components/src/components/Icon/Icon.types.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-core/src/icons.ts packages/ui-components/src/components/Icon/Icon.types.ts
          git commit -m "fix(core): format shared icon foundation"
          git push origin HEAD:feat/shared-icon-svg-foundation
