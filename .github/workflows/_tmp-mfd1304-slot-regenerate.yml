name: Temporary MFD-1304 slot regeneration

on:
  push:
    branches:
      - tmp/MFD-1304-slot-regenerate

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run generate:framework-artifacts
      - name: Commit clean task tree
        run: |
          rm .github/workflows/_tmp-mfd1304-slot-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vue): regenerate catalog slot typing"
          git push
