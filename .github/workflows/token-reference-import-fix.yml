name: Token Reference import fix

on:
  push:
    branches:
      - fix/token-contract-standardization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/token-contract-standardization
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Migrate remaining token Reference import
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "apps/docs/src/examples/data/referenceMetadata.ts";
          const source = readFileSync(path, "utf8");
          const oldValue = "../../../../../docs/metadata/design-tokens.json?raw";
          const nextValue = "../../../../../docs/generated/design-token-reference.json?raw";
          if (!source.includes(oldValue)) throw new Error("stale token import was not found");
          writeFileSync(path, source.replace(oldValue, nextValue));
          NODE
          npx prettier --write apps/docs/src/examples/data/referenceMetadata.ts
          npm run build --workspace @vyrnforge/ui-docs
      - name: Commit migrated import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/examples/data/referenceMetadata.ts
          git commit -m "fix(docs): consume generated token reference"
          git push origin HEAD:fix/token-contract-standardization
