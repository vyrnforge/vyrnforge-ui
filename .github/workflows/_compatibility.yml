name: Reusable compatibility release matrix

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility-plan:
    name: compatibility-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read canonical compatibility matrix
        id: matrix
        shell: bash
        run: |
          node - <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const manifest = JSON.parse(
            readFileSync("docs/metadata/compatibility-release-matrix.json", "utf8"),
          );
          const include = manifest.cases.map(({ id, node, browser }) => ({
            id,
            node,
            browser,
          }));
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({ include })}\n`,
          );
          NODE

  compatibility-release-matrix:
    name: compatibility-${{ matrix.id }}
    needs: compatibility-plan
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use repository package manager
        env:
          npm_config_engine_strict: "false"
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install repository dependencies
        env:
          npm_config_engine_strict: "false"
        run: npm ci

      - name: Install matrix browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run compatibility release case
        env:
          npm_config_engine_strict: "false"
        run: npm run verify:compatibility-release-case -- --case ${{ matrix.id }}

      - name: Upload compatibility case evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-release-matrix-${{ matrix.id }}
          path: test-results/compatibility-release-matrix/${{ matrix.id }}.json
          if-no-files-found: error
