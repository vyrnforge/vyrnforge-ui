name: Temporary NumberField formatting evidence
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'foundation/number-field-editor-composition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate formatter output without modifying repository
        run: |
          pnpm exec prettier --write 'product/components/composite-widgets/compound-fields/number-field/**/*.{ts,tsx,mts,cts,js,mjs,cjs,css,json,md,html}'
          git diff --no-color
