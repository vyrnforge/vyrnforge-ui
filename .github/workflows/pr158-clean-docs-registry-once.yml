name: PR158 clean docs registry once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/repo-wide-rollout-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Remove deleted GMF4 docs from docs registry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/docs/src/docsRegistry.ts')
          s = p.read_text()
          s = s.replace('import gmf4CompatibilityGate from "../../../docs/testing/gmf4-cross-framework-compatibility-gate.md?raw";\n', '')
          s = s.replace('import metadataGmf4Closure from "../../../docs/metadata/gmf4-closure.json?raw";\n', '')

          blocks = [
          '''  {
            id: "gmf4-compatibility-gate",
            title: "GMF4 Compatibility Gate",
            group: "Testing",
            description:
              "CF-7014 final Native HTML, React, Angular, and Vue compatibility closure.",
            sourcePath: "docs/testing/gmf4-cross-framework-compatibility-gate.md",
            aiPurpose:
              "Use this to review the final GMF4 support claim, evidence, blockers, and deferred data-grid scope.",
            tags: ["testing", "multi-framework", "gmf4", "closure"],
            canonical: true,
            content: gmf4CompatibilityGate,
          },
          ''',
          '''  {
            id: "metadata-gmf4-closure",
            title: "GMF4 Closure Metadata",
            group: "Metadata",
            description:
              "Machine-readable CF-7001 through CF-7014 compatibility closure.",
            sourcePath: "docs/metadata/gmf4-closure.json",
            aiPurpose:
              "Use this for the canonical GMF4 task, evidence, package, blocker, and handoff record.",
            tags: ["metadata", "gmf4", "closure"],
            canonical: true,
            kind: "metadata",
            content: metadataGmf4Closure,
          },
          ''',
          ]
          for block in blocks:
              if block not in s:
                  raise SystemExit('legacy docs registry block not found')
              s = s.replace(block, '')
          if 'gmf4CompatibilityGate' in s or 'metadataGmf4Closure' in s:
              raise SystemExit('legacy docs registry variable remains')
          p.write_text(s)
          PY
      - run: npx prettier --write apps/docs/src/docsRegistry.ts
      - run: npm run build --workspace @vyrnforge/ui-docs
      - run: rm .github/workflows/pr158-clean-docs-registry-once.yml
      - name: Commit docs registry cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove deleted GMF4 docs from docs registry"
          git push
