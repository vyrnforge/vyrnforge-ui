name: MFD-1315 Consumer Knowledge Sync

on:
  push:
    branches:
      - feat/MFD-1315-vue-release-integration-clean

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[mfd-1315-knowledge-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1315-vue-release-integration-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Align Vue consumer knowledge generator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/generate-component-reference.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replace = (from, to) => {
            if (!source.includes(from)) throw new Error(`missing replacement marker: ${from}`);
            source = source.replace(from, to);
          };

          replace(
            '  return "Vue is currently a verified consumer of the canonical Custom Element contract. A first-class Vue package must not be claimed until its distribution gate passes.";',
            '  return "Vue uses the first-class @vyrnforge/ui-vue facade over the canonical Custom Element renderer; rendering, behavior, accessibility, and vf-* event contracts remain shared with @vyrnforge/ui-elements.";'
          );

          replace(
            '  const reactSetup = cleanText(component.importExample) ?? "";\n  const reactExample = cleanText(component.basicUsageExample) ?? "";',
            '  const reactSetup = cleanText(component.importExample) ?? "";\n  const reactExample = cleanText(component.basicUsageExample) ?? "";\n  const vueComponentName = component.displayName\n    ? `Vf${component.displayName.replace(/[^A-Za-z0-9]+/g, " ").trim().split(/\\s+/).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join("")}`\n    : null;'
          );

          replace(
            '    vue: {\n      label: "Vue",\n      status: vueStatus,\n      package:\n        parity.vue?.consumes ?? (nativeTag ? "@vyrnforge/ui-elements" : null),\n      setup: nativeTag\n        ? "compilerOptions: { isCustomElement: (tag) => tag.startsWith(\'vf-\') }"\n        : "",\n      example: nativeTag ? `<${nativeTag}></${nativeTag}>` : "",\n      note: frameworkNote("vue", vueStatus),\n    },',
            '    vue: {\n      label: "Vue",\n      status: vueStatus,\n      package:\n        vueStatus === "not-supported" ? null : "@vyrnforge/ui-vue",\n      setup:\n        vueStatus === "not-supported"\n          ? ""\n          : \'import { VyrnForgeVue } from "@vyrnforge/ui-vue";\\napp.use(VyrnForgeVue);\',\n      example:\n        vueStatus === "not-supported" || !vueComponentName\n          ? ""\n          : `<${vueComponentName}></${vueComponentName}>`,\n      note: frameworkNote("vue", vueStatus),\n    },'
          );

          fs.writeFileSync(path, source);
          NODE
      - run: node scripts/generate-component-reference.mjs
      - run: npx prettier --write scripts/generate-component-reference.mjs docs/generated
      - run: npm run test:component-reference
      - name: Commit synchronized generated knowledge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/generate-component-reference.mjs docs/generated
          git commit -m 'fix(release): refresh Vue consumer knowledge [mfd-1315-knowledge-sync]' || exit 0
          git push
