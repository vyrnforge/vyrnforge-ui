name: Temporary MFD-1309 specialized slots

on:
  push:
    branches:
      - feat/MFD-1309-vue-slots

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1309-vue-slots
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Align specialized Vue slot generators
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function patchTail(path, marker, replacements) {
            const source = fs.readFileSync(path, 'utf8');
            const index = source.indexOf(marker);
            if (index < 0) throw new Error(`${path}: marker missing`);
            const prefix = source.slice(0, index);
            let tail = source.slice(index);
            for (const [before, after] of replacements) {
              if (!tail.includes(before)) throw new Error(`${path}: replacement source missing`);
              tail = tail.replace(before, after);
            }
            fs.writeFileSync(path, prefix + tail);
          }

          patchTail('scripts/framework-button-generation.mjs', 'function vueSource(model) {', [
            [
              '} from "@vyrnforge/ui-elements";\n\nexport type VfButtonElement',
              '} from "@vyrnforge/ui-elements";\nimport { renderVyrnForgeSlots } from "../slots";\n\nexport type VfButtonElement',
            ],
            [
              '        [\n          slots.${prefixSlot?.public ?? "prefix"}\n            ? h("span", { slot: "prefix" }, slots.${prefixSlot?.public ?? "prefix"}?.())\n            : null,\n          slots.${defaultSlot.public}?.(),\n          slots.${suffixSlot?.public ?? "suffix"}\n            ? h("span", { slot: "suffix" }, slots.${suffixSlot?.public ?? "suffix"}?.())\n            : null,\n        ],',
              '        renderVyrnForgeSlots(slots),',
            ],
          ]);

          patchTail('scripts/framework-dialog-generation.mjs', 'function vueSource() {', [
            [
              'import type { VyrnForgeElementForTagName } from "@vyrnforge/ui-elements";\n\nexport type VfDialogElement',
              'import type { VyrnForgeElementForTagName } from "@vyrnforge/ui-elements";\nimport { renderVyrnForgeSlots } from "../slots";\n\nexport type VfDialogElement',
            ],
            [
              '        [\n          slots.trigger ? h("span", { slot: "trigger" }, slots.trigger()) : null,\n          slots.header ? h("div", { slot: "header" }, slots.header()) : null,\n          h("div", { slot: "content" }, slots.content?.() ?? []),\n          slots.actions ? h("div", { slot: "actions" }, slots.actions()) : null,\n          slots.footer ? h("div", { slot: "footer" }, slots.footer()) : null,\n        ],',
              '        renderVyrnForgeSlots(slots),',
            ],
          ]);

          patchTail('scripts/framework-text-input-generation.mjs', 'function vueSource() {', [
            [
              '} from "@vyrnforge/ui-elements";\n\nexport type VfTextInputElement',
              '} from "@vyrnforge/ui-elements";\nimport { renderVyrnForgeSlots } from "../slots";\n\nexport type VfTextInputElement',
            ],
            [
              '  setup(props, { attrs, emit, expose }) {',
              '  setup(props, { attrs, emit, expose, slots }) {',
            ],
            [
              '      h("vf-text-input", {\n        ...attrs,\n        id: props.id,\n        ref: elementRef,\n        "data-vf-generated-text-input": "vue",\n      });',
              '      h(\n        "vf-text-input",\n        {\n          ...attrs,\n          id: props.id,\n          ref: elementRef,\n          "data-vf-generated-text-input": "vue",\n        },\n        renderVyrnForgeSlots(slots),\n      );',
            ],
          ]);
          NODE
      - run: npm run generate:framework-artifacts
      - run: npx prettier --write scripts/framework-button-generation.mjs scripts/framework-dialog-generation.mjs scripts/framework-text-input-generation.mjs packages/ui-vue/src/generated/VfButton.generated.ts packages/ui-vue/src/generated/VfDialog.generated.ts packages/ui-vue/src/generated/VfTextInput.generated.ts packages/ui-vue/src/generated/catalog.generated.ts
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test --workspace @vyrnforge/ui-vue
      - run: node scripts/generated-framework-artifacts.test.mjs
      - name: Commit specialized slot output
        run: |
          rm .github/workflows/_tmp-mfd1309-specialized.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/framework-button-generation.mjs scripts/framework-dialog-generation.mjs scripts/framework-text-input-generation.mjs packages/ui-vue/src/generated/VfButton.generated.ts packages/ui-vue/src/generated/VfDialog.generated.ts packages/ui-vue/src/generated/VfTextInput.generated.ts packages/ui-vue/src/generated/catalog.generated.ts .github/workflows/_tmp-mfd1309-specialized.yml
          git commit -m "feat(vue): preserve specialized slot composition"
          git push origin HEAD:feat/MFD-1309-vue-slots
