name: Reusable quality checks

on:
  workflow_call:
    inputs:
      node-version:
        description: Supported Node.js version used for the clean runner
        required: false
        default: "24.18.0"
        type: string
      full:
        required: false
        default: false
        type: boolean
      metadata:
        required: false
        default: false
        type: boolean
      fixtures:
        required: false
        default: false
        type: boolean
      affected-packages:
        description: Comma-separated workspace package names selected by the change-impact planner
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  quality-scope:
    name: scoped-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_SCOPE_FULL: ${{ inputs.full }}
      CI_SCOPE_METADATA: ${{ inputs.metadata }}
      CI_SCOPE_FIXTURES: ${{ inputs.fixtures }}
      CI_AFFECTED_PACKAGES: ${{ inputs.affected-packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Show canonical formatter diff
        shell: bash
        run: |
          npx prettier --write scripts/detect-ci-scope.mjs scripts/detect-ci-scope.test.mjs
          git diff -- scripts/detect-ci-scope.mjs scripts/detect-ci-scope.test.mjs
          test -z "$(git status --porcelain -- scripts/detect-ci-scope.mjs scripts/detect-ci-scope.test.mjs)"

      - name: Run repository and affected-workspace quality checks
        run: node scripts/run-scoped-quality.mjs
