name: PR 832 compatibility recapture helper

on:
  push:
    branches:
      - feat/shared-icon-svg-foundation

permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/shared-icon-svg-foundation
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Recapture reviewed React compatibility fingerprint
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "docs/metadata/react-compatibility-baseline.json";
          const baseline = JSON.parse(fs.readFileSync(file, "utf8"));
          const componentTree = baseline.fingerprints.find(
            (record) => record.path === "packages/ui-components/src/components",
          );
          if (!componentTree) throw new Error("Missing React component-tree baseline record");
          if (componentTree.sha1 !== "019b50f626fd4f0a8e59e6a77a5227ad258e52a3") {
            throw new Error(`Unexpected prior component-tree fingerprint: ${componentTree.sha1}`);
          }
          componentTree.sha1 = "3892c3b375bec6e827124da30aaef48039c3e2a4";
          baseline.recaptures.push({
            changeId: "#832",
            reason:
              "React Icon now renders the same existing 33-icon public catalog from the shared framework-neutral @vyrnforge/ui-core SVG definition source instead of a React-owned geometry registry. Public Icon names, sizes, props, accessibility behavior, currentColor stroke model, viewBox, rendered geometry, package exports, and CSS hooks remain unchanged; the React component-tree fingerprint is intentionally recaptured after parity, build, typecheck, and packed-consumer verification.",
            evidence:
              "packages/ui-core/src/icons.test.ts; packages/ui-components/src/components/Icon/Icon.tsx; packages/ui-elements/src/components/parity.ts",
          });
          fs.writeFileSync(file, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE
          npx prettier --write docs/metadata/react-compatibility-baseline.json
          rm .github/workflows/pr-832-baseline-helper.yml
      - name: Commit recapture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata/react-compatibility-baseline.json .github/workflows/pr-832-baseline-helper.yml
          git diff --cached --check
          git commit -m "test(react): recapture icon compatibility baseline"
          git push origin HEAD:feat/shared-icon-svg-foundation
