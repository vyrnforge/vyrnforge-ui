name: S11 Dialog ARIA Fix

on:
  push:
    branches:
      - s11-dialog-generation-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s11-dialog-generation-slice
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - run: npm ci
      - name: Patch Dialog trigger ARIA target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/ui-elements/src/components/overlays.ts')
          text = path.read_text()
          old = '''    scaffold.backdrop.setAttribute("aria-hidden", String(!this.open));
              this.#trigger?.setAttribute("aria-controls", this.#contentId);
              this.#trigger?.setAttribute("aria-expanded", String(this.open));
              this.#trigger?.setAttribute("aria-haspopup", "dialog");
              this.setAttribute("data-vf-element", "");'''.replace('              ', '    ')
          new = '''    scaffold.backdrop.setAttribute("aria-hidden", String(!this.open));
              const triggerControl = this.resolveTriggerControl();
              this.#trigger?.removeAttribute("aria-controls");
              this.#trigger?.removeAttribute("aria-expanded");
              this.#trigger?.removeAttribute("aria-haspopup");
              triggerControl?.setAttribute("aria-controls", this.#contentId);
              triggerControl?.setAttribute("aria-expanded", String(this.open));
              triggerControl?.setAttribute("aria-haspopup", "dialog");
              this.setAttribute("data-vf-element", "");'''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('update ARIA block not found')
          text = text.replace(old, new, 1)
          old2 = '''  private readonly handleTriggerClick = () => {
              if (!this.disabled) this.show();
            };'''.replace('              ', '    ')
          new2 = '''  private resolveTriggerControl(): HTMLElement | null {
              const trigger = this.#trigger;
              if (!trigger) return null;
              if (
                trigger.matches(
                  'button, a[href], input:not([type="hidden"]), select, textarea, [role="button"]',
                )
              ) {
                return trigger;
              }
              return trigger.querySelector<HTMLElement>(
                'button, a[href], input:not([type="hidden"]), select, textarea, [role="button"]',
              );
            }

            private readonly handleTriggerClick = () => {
              if (!this.disabled) this.show();
            };'''.replace('              ', '    ')
          if old2 not in text:
              raise SystemExit('trigger handler block not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
      - run: npx prettier --write packages/ui-elements/src/components/overlays.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-elements/src/components/overlays.ts
          git commit -m "fix: target Dialog trigger ARIA at interactive control"
          git push origin HEAD:s11-dialog-generation-slice
