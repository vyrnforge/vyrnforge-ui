name: Branch Retention Policy Validation

on:
  pull_request:
    paths:
      - '.github/workflows/stale-branch-cleanup.yml'
      - 'tooling/ci/branch-retention*'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Test branch-retention selection policy
        run: node --test tooling/ci/branch-retention.test.mjs
