name: Scheduled Assurance

on:
  schedule:
    - cron: '17 3 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute scheduled validation graph
        run: node tooling/impact/execute.mjs --mode scheduled --output test-results/validation-plan.json
      - name: Upload validation plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-plan-scheduled
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 14
