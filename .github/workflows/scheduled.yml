name: Scheduled Assurance

on:
  schedule:
    - cron: '17 3 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-assurance
  cancel-in-progress: true

jobs:
  plan:
    name: semantic-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser_ports: ${{ steps.impact.outputs.browser_ports }}
      browser_scopes: ${{ steps.impact.outputs.browser_scopes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record scheduled broad semantic impact
        id: impact
        run: |
          mkdir -p test-results
          node tooling/impact/plan.mjs --mode scheduled --output test-results/semantic-impact.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-impact-scheduled-${{ github.run_id }}
          path: test-results/semantic-impact.json
          if-no-files-found: error
          retention-days: 14

  full-validation:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm verify:release
      - run: pnpm verify:packages
      - run: pnpm build:docs

  browser-matrix:
    needs: plan
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: ${{ needs.plan.outputs.browser_scopes }}
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: scheduled
      retention_days: 14
