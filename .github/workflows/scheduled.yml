name: Scheduled Assurance

on:
  schedule:
    - cron: '17 3 * * 2,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-assurance
  cancel-in-progress: true

jobs:
  scheduled-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute scheduled validation graph
        run: node tooling/impact/execute.mjs --mode scheduled --output test-results/validation-plan.json
      - name: Upload validation plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan-scheduled
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-scheduled
          path: |
            test-results/playwright-report
            test-results/playwright-results
            test-results/*-playwright-report
            test-results/*-playwright-results
          if-no-files-found: ignore
          retention-days: 14
