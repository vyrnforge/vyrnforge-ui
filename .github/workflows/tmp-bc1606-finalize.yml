name: Temporary BC-1606 final release cleanup

on:
  push:
    branches:
      - s16/bc-1606-retire-beta-artifact-path

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Apply final BC-1606 cleanup
        shell: bash
        run: |
          node .tmp/bc1606-finalize.mjs
          rm .github/workflows/tmp-bc1606-finalize.yml
          rm .tmp/bc1606-finalize.mjs
          rmdir .tmp 2>/dev/null || true
          npx prettier --write package.json scripts/validation-model.mjs scripts/prepare-release-artifact.mjs .github/workflows/ci.yml
          npm run inventory:repository
          npx prettier --write docs/governance/repository-inventory.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: retire beta-only artifact verification path"
          git push
      - name: Verify structural contracts
        shell: bash
        run: |
          npm run test:contracts
          npm run verify:metadata
          npm run verify:workflows
          npm run verify:repository-inventory
          npm run verify:beta-scope
          npm run verify:release-groups
          ! grep -R --line-number -E 'beta-package-artifacts|beta-package-size-budgets|beta-package-consumer|verify:beta-package-contract|verify:beta-package-artifacts' package.json scripts docs .github tests --exclude-dir=node_modules
      - name: Verify non-publishing release path
        shell: bash
        run: |
          FINAL_SHA="$(git rev-parse HEAD)"
          RELEASE_GROUP=non-grid-beta
          RELEASE_VERSION=0.2.0-beta.2
          RELEASE_TAG=beta
          npm run prepare:release-artifact -- --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG" --source-commit "$FINAL_SHA" --ci-run-id "$GITHUB_RUN_ID"
          npm run verify:release-artifact -- --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG" --source-commit "$FINAL_SHA" --ci-run-id "$GITHUB_RUN_ID" --artifact-dir test-results/release-artifact
          npm run verify:trusted-publishing-dry-run -- --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG" --artifact-dir test-results/release-artifact
          npm run verify:release-size-budgets -- --release-group "$RELEASE_GROUP" --artifact-dir test-results/release-artifact
          npm run build --workspace @vyrnforge/ui-data-grid
          VYRNFORGE_PACKAGES_PREPARED=true npm run verify:packages
          test -f test-results/release-artifact/manifest.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
