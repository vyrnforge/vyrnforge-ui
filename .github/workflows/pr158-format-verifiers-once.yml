name: PR158 format verifier cleanup once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/repo-wide-rollout-cleanup

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Format cleanup verifiers and self-remove
        run: |
          npx prettier --write \
            scripts/verify-angular-forms-adapter.mjs \
            scripts/verify-vue-consumer.mjs \
            scripts/verify-vue-model-adapter.mjs
          rm .github/workflows/pr158-format-verifiers-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify-angular-forms-adapter.mjs \
            scripts/verify-vue-consumer.mjs \
            scripts/verify-vue-model-adapter.mjs \
            .github/workflows/pr158-format-verifiers-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format rollout cleanup verifiers"
          git push origin HEAD:chore/repo-wide-rollout-cleanup
