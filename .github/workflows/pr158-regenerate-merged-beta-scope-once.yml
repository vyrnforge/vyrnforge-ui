name: PR158 regenerate merged beta scope once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/repo-wide-rollout-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: node scripts/generate-beta-scope.mjs
      - run: npx prettier --write docs/metadata/non-grid-beta-scope.json
      - run: rm .github/workflows/pr158-regenerate-merged-beta-scope-once.yml
      - name: Commit regenerated artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh beta scope after main sync"
          git push
