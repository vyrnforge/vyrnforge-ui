name: One-time Actions run cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-old-runs.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-time-actions-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting briefly for workflow runs started by this push to settle..."
          for attempt in {1..20}; do
            active_count="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select((.id != ${SELF_RUN_ID}) and (.status != \"completed\")) | .id" \
              | wc -l | tr -d ' ')"

            if [[ "$active_count" == "0" ]]; then
              break
            fi

            echo "${active_count} other run(s) still active; waiting 30s (${attempt}/20)..."
            sleep 30
          done

          mapfile -t run_ids < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/actions/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.status == \"completed\" and (.id != ${SELF_RUN_ID})) | .id"
          )

          echo "Deleting ${#run_ids[@]} completed workflow run(s)..."
          deleted=0
          failed=0

          for run_id in "${run_ids[@]}"; do
            if gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${REPO}/actions/runs/${run_id}" >/dev/null; then
              deleted=$((deleted + 1))
            else
              echo "Failed to delete run ${run_id}" >&2
              failed=$((failed + 1))
            fi
          done

          echo "Deleted: ${deleted}; failed: ${failed}."
          if (( failed > 0 )); then
            exit 1
          fi
