name: MFD-1301 release-group log
on:
  push:
    branches: [mfd-1301-diagnostics]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[release-log]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - run: npm ci
      - name: Capture release-group test
        shell: bash
        run: |
          set +e
          npm run test:release-groups > mfd1301-release-groups.log 2>&1
          echo "exit=$?" >> mfd1301-release-groups.log
          exit 0
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfd1301-release-groups.log
          git commit -m "chore: capture release-group failure [release-log]"
          git push origin HEAD:${GITHUB_REF_NAME}
