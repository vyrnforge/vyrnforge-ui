name: PreviewCard L5 geometry cross-engine evidence
on:
  push:
    branches: [evidence/l5-preview-card-geometry-cross]
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"preview-card"},{"port":"react","components":"preview-card"},{"port":"vue","components":"preview-card"},{"port":"angular","components":"preview-card"},{"port":"elements","components":"preview-card"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: preview-card-geometry-cross
      retention_days: 14
