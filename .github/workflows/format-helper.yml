name: Temporary Reference format helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write \
            apps/docs/src/DocumentationAppShell.tsx \
            apps/docs/src/styles/reference-navigation.css \
            apps/docs/src/styles/reference-ui.css
          git diff -- \
            apps/docs/src/DocumentationAppShell.tsx \
            apps/docs/src/styles/reference-navigation.css \
            apps/docs/src/styles/reference-ui.css
