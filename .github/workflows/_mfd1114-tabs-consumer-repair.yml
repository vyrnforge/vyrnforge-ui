name: MFD-1114 Tabs consumer repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'mfd-1114-tabs-generation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Tabs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mfd-1114-tabs-generation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Repair React accessibility passthrough and validate consumers
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          npm ci
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/framework-tabs-generation.mjs")
          text = path.read_text()
          replacements = [
              (
                  'export interface GeneratedTabsProps {\n  id?: string;\n',
                  'export interface GeneratedTabsProps {\n  id?: string;\n  "aria-label"?: string;\n',
              ),
              (
                  '    {\n      id,\n      value,',
                  '    {\n      id,\n      "aria-label": ariaLabel,\n      value,',
              ),
              (
                  '<vf-tabs ref={elementRef} id={id} data-vf-generated-tabs="react">',
                  '<vf-tabs\n        ref={elementRef}\n        id={id}\n        aria-label={ariaLabel}\n        data-vf-generated-tabs="react"\n      >',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected React Tabs source fragment not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write \
            scripts/framework-tabs-generation.mjs \
            tests/consumers/native-html/src/main.ts \
            tests/consumers/react/src/main.tsx \
            tests/consumers/angular/src/app/app.component.ts \
            tests/consumers/angular/src/app/app.component.html \
            tests/consumers/vue/src/App.vue
          rm -f .github/workflows/_mfd1114-tabs-consumer-repair.yml
          npm run generate:framework-artifacts
          npm run inventory:repository
          npm run verify:generated-framework-artifacts
          npm run verify:consumer-foundations

      - name: Commit repaired Tabs consumers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/framework-tabs-generation.mjs \
            tests/consumers/native-html/src/main.ts \
            tests/consumers/react/src/main.tsx \
            tests/consumers/angular/src/app/app.component.ts \
            tests/consumers/angular/src/app/app.component.html \
            tests/consumers/vue/src/App.vue \
            tests/consumers/native-html/src/generated/vf-tabs.generated.ts \
            tests/consumers/react/src/generated/Tabs.generated.tsx \
            tests/consumers/angular/src/app/generated/vf-tabs.generated.ts \
            tests/consumers/vue/src/generated/VfTabs.generated.ts \
            docs/governance/repository-inventory.md \
            .github/workflows/_mfd1114-tabs-consumer-repair.yml
          git commit -m "test: exercise generated Tabs across four consumers"
          git push origin HEAD:mfd-1114-tabs-generation
