name: Repository Retention Cleanup

on:
  schedule:
    - cron: '41 4 * * *'
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional merged pull request number to clean immediately
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: repository-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Apply repository retention policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETENTION_PR_NUMBER: ${{ inputs.pull_request || '' }}
          RETENTION_REPORT: test-results/actions-retention.json
        run: node tooling/ci/retention-cleanup.mjs

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actions-retention-report
          path: test-results/actions-retention.json
          if-no-files-found: error
          retention-days: 14
