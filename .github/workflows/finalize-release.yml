name: Finalize Existing npm Release

on:
  workflow_dispatch:
    inputs:
      release-group:
        description: Existing release group to finalize
        required: true
        default: non-grid-beta
        type: choice
        options:
          - non-grid-beta
          - data-grid-alpha
      version:
        description: Exact version already published to npm
        required: true
        type: string
      dist-tag:
        description: Existing npm prerelease dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - alpha
          - next

permissions:
  contents: read

concurrency:
  group: vyrnforge-release-finalization
  cancel-in-progress: false

jobs:
  verify-registry-release:
    name: verify-registry-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist-tag }}

    steps:
      - name: Checkout current main verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Confirm current main and existing release tag
        shell: bash
        run: |
          git fetch origin main --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          git fetch origin --tags --force
          git rev-parse "v$RELEASE_VERSION^{commit}" >/dev/null

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Verify completed assistive-technology evidence
        if: inputs.release-group == 'non-grid-beta'
        run: npm run verify:assistive-technology:release -- --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION"

      - name: Verify existing registry metadata and fresh consumer
        run: node scripts/verify-registry-release.mjs --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG"

      - name: Write registry verification summary
        shell: bash
        run: |
          SOURCE_COMMIT="$(git rev-parse "v$RELEASE_VERSION^{commit}")"
          {
            echo "## Existing npm release verification"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Exact version: \`$RELEASE_VERSION\`"
            echo "- Dist-tag: \`$RELEASE_TAG\`"
            echo "- Existing source tag: \`v$RELEASE_VERSION\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- npm publication: not executed by this workflow"
            echo "- Registry metadata, signatures, provenance, and fresh consumer build: verified"
          } >> "$GITHUB_STEP_SUMMARY"

  create-release-record:
    name: create-release-record
    needs: verify-registry-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_GROUP: ${{ inputs.release-group }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.dist-tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release metadata source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve existing release tag
        id: release-tag
        shell: bash
        run: |
          git fetch origin --tags --force
          TAG="v$RELEASE_VERSION"
          SOURCE_COMMIT="$(git rev-parse "$TAG^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source-commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: node scripts/create-release-notes.mjs --release-group "$RELEASE_GROUP" --version "$RELEASE_VERSION" --dist-tag "$RELEASE_TAG" --commit "${{ steps.release-tag.outputs.source-commit }}" --output release-notes.md

      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          TAG="${{ steps.release-tag.outputs.tag }}"
          TITLE="VyrnForge UI $RELEASE_GROUP $RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --prerelease \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --prerelease \
              --notes-file release-notes.md
          fi

      - name: Write release-record summary
        shell: bash
        run: |
          {
            echo "## GitHub release finalization"
            echo
            echo "- Release group: \`$RELEASE_GROUP\`"
            echo "- Tag: \`${{ steps.release-tag.outputs.tag }}\`"
            echo "- Source commit: \`${{ steps.release-tag.outputs.source-commit }}\`"
            echo "- GitHub Release: created or updated as a prerelease"
            echo "- npm publication: not executed"
            echo "- Permission separation: repository write access only; no npm OIDC permission"
          } >> "$GITHUB_STEP_SUMMARY"
