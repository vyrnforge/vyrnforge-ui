name: Format Reference states

on:
  push:
    branches:
      - issue-772-reference-states

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-772-reference-states
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format state UX files
        run: |
          npx prettier --write             apps/docs/src/App.tsx             apps/docs/src/ReferenceShell.tsx             apps/docs/src/DocsPage.tsx             apps/docs/src/referenceRoutes.ts             apps/docs/src/ComponentReferencePage.tsx             apps/docs/src/PackageReferencePage.tsx             apps/docs/src/DiscoveryReferencePage.tsx             apps/docs/src/examples/MigratedExamplePage.tsx             apps/docs/src/examples/ExecutableExamplesPage.tsx             apps/docs/src/styles/reference-shell.css             scripts/reference-shell-contract.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src scripts/reference-shell-contract.test.mjs
          git commit -m "style(docs): format Reference state UX"
          git push origin HEAD:issue-772-reference-states
