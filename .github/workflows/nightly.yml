name: VyrnForge Nightly

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyrnforge-nightly
  cancel-in-progress: true

jobs:
  quality-node-24:
    name: quality-node-24
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      full: true
      metadata: true
      ui-core: true
      ui-behaviors: true
      ui-components: true
      ui-elements: true
      ui-data-grid: true
      fixtures: true

  browser-chromium:
    name: browser-chromium
    uses: ./.github/workflows/_browser.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"

  packages:
    name: packages
    uses: ./.github/workflows/_packages.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"

  external-consumer:
    name: external-consumer
    uses: ./.github/workflows/_consumer.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"

  docs-and-playground:
    name: docs-and-playground
    uses: ./.github/workflows/_docs.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      build-docs: true
      build-playground: true

  compatibility:
    name: compatibility
    uses: ./.github/workflows/_compatibility.yml
    permissions:
      contents: read

  security:
    name: security
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write

  nightly-gate:
    name: nightly-gate
    needs:
      - quality-node-24
      - browser-chromium
      - packages
      - external-consumer
      - docs-and-playground
      - compatibility
      - security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate nightly results
        env:
          RESULTS_JSON: >-
            {"quality24":"${{ needs.quality-node-24.result }}","browser":"${{ needs.browser-chromium.result }}","packages":"${{ needs.packages.result }}","consumer":"${{ needs.external-consumer.result }}","docs":"${{ needs.docs-and-playground.result }}","compatibility":"${{ needs.compatibility.result }}","security":"${{ needs.security.result }}"}
        run: |
          node - <<'NODE'
          const results = JSON.parse(process.env.RESULTS_JSON);
          console.log(results);
          if (Object.values(results).some((result) => result !== "success")) process.exit(1);
          NODE
