name: VyrnForge Nightly

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyrnforge-nightly
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      full: true
      metadata: true
      ui-core: true
      ui-behaviors: true
      ui-components: true
      ui-elements: true
      ui-data-grid: true
      fixtures: true

  integration:
    name: integration
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      browser: true
      packages: true
      consumer: true
      docs: true
      playground: true
      pages-artifact: false

  compatibility:
    name: compatibility
    uses: ./.github/workflows/_compatibility.yml
    permissions:
      contents: read

  security:
    name: security
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      security-events: write
    with:
      dependency-review: false
      drift: true

  nightly-gate:
    name: nightly-gate
    needs:
      - quality
      - integration
      - compatibility
      - security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate nightly responsibilities
        env:
          RESULTS_JSON: >-
            {"quality":"${{ needs.quality.result }}","integration":"${{ needs.integration.result }}","compatibility":"${{ needs.compatibility.result }}","security":"${{ needs.security.result }}"}
        run: |
          node - <<'NODE'
          const results = JSON.parse(process.env.RESULTS_JSON);
          const failures = Object.entries(results).filter(
            ([, result]) => result !== "success",
          );
          console.log(results);
          if (failures.length) {
            console.error(
              `nightly-gate failed: ${failures
                .map(([name, result]) => `${name}:${result}`)
                .join("; ")}`,
            );
            process.exit(1);
          }
          NODE
