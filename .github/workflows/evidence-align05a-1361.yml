name: ALIGN-05-A evidence only (no merge)

on:
  pull_request:
    branches: [fix/1355-app-shell-optional-navigation]

permissions:
  contents: read

jobs:
  exact-candidate:
    if: github.event.pull_request.head.ref == 'evidence/1361-app-shell-cross-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { port: web, lane: cross }
          - { port: react, lane: cross }
          - { port: angular, lane: cross }
          - { port: vue, lane: cross }
          - { port: elements, lane: cross }
          - { port: react, lane: targeted }
    env:
      VF_COMPONENT_PORT: ${{ matrix.port }}
      VF_COMPONENTS: app-shell
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 301c95df2e9b2f6e70c00d7a5108ea475203e039
          persist-credentials: false
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "301c95df2e9b2f6e70c00d7a5108ea475203e039"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Cross-engine prerequisites
        if: matrix.lane == 'cross'
        run: pnpm exec playwright install --with-deps firefox webkit
      - name: Chromium prerequisites
        if: matrix.lane == 'targeted'
        run: pnpm exec playwright install --with-deps chromium
      - name: Focused AppShell Firefox and WebKit evidence
        if: matrix.lane == 'cross'
        run: pnpm exec playwright test optional-navigation.spec.mjs --project=firefox --project=webkit
      - name: Targeted AppShell React regression and tooling tests
        if: matrix.lane == 'targeted'
        run: |
          pnpm exec vitest run tooling/testing/browser-fixture-scope.test.mjs
          pnpm exec playwright test --project=chromium
          test -s dist/browser-fixtures/components/input/react-profile.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: align05a-${{ matrix.port }}-${{ matrix.lane }}-301c95df2e9b
          path: |
            test-results/playwright-report/${{ matrix.port }}
            test-results/playwright-results/${{ matrix.port }}
          if-no-files-found: ignore
          retention-days: 14
