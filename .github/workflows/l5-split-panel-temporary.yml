name: L5 SplitPanel format and API generation (temporary)
on:
  push:
    branches: [fix/l5-split-panel-keyboard]
permissions:
  contents: write
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/l5-split-panel-keyboard
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format and generate API reports
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm exec prettier --write "product/components/composite-widgets/interactive-layout/split-panel/**/*.{ts,tsx,mjs,css,json,md}"
          pnpm format:l5:check
          pnpm lint:l5
          pnpm exec nx run-many -t build --projects=@vyrnforge/core,@vyrnforge/web,@vyrnforge/icons,@vyrnforge/react,@vyrnforge/angular,@vyrnforge/vue,@vyrnforge/elements
          node tooling/verify/api-reports.mjs --local --packages angular,elements,react,vue
          node tooling/verify/api-reports.mjs --packages angular,elements,react,vue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- product/components/composite-widgets/interactive-layout/split-panel packages/angular/etc/angular.api.md packages/elements/etc/elements.api.md packages/react/etc/react.api.md packages/vue/etc/vue.api.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: format SplitPanel and regenerate API reports"
            git push origin HEAD:refs/heads/fix/l5-split-panel-keyboard
          fi
