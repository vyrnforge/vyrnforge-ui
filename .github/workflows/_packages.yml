name: Reusable package verification

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        default: "24.18.0"
        type: string

permissions:
  contents: read

jobs:
  package-verification:
    name: package-verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Verify publishable packages
        run: npm run verify:packages

      - name: Verify beta package artifacts
        run: npm run verify:beta-package-artifacts

      - name: Verify beta package size budgets
        shell: bash
        run: |
          npm run verify:beta-package-size-budgets
          test -f test-results/beta-package-artifacts/size-report.json

      - name: Upload beta package artifact reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-package-artifacts
          path: test-results/beta-package-artifacts/
          if-no-files-found: error
