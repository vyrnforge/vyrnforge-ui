name: Token standardization regeneration

on:
  push:
    branches:
      - fix/token-contract-standardization

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/token-contract-standardization
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/generate-reference-model.mjs
      - run: node scripts/generate-documentation-registry.mjs
      - name: Commit generated Reference artifacts
        run: |
          if git diff --quiet -- docs/generated/reference-model.json docs/generated/documentation-registry.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/reference-model.json docs/generated/documentation-registry.json
          git commit -m "chore(reference): regenerate token authority artifacts"
          git push origin HEAD:fix/token-contract-standardization
