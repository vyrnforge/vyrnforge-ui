name: MFD-1204 finalize Angular catalog

on:
  push:
    branches:
      - mfd-1204-angular-full-catalog-bindings
    paths:
      - .github/workflows/mfd-1204-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mfd-1204-angular-full-catalog-bindings
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Format authored sources
        run: npx prettier --write scripts/angular-catalog-generation.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs scripts/verify-angular-catalog-coverage.mjs packages/ui-angular/src/index.ts packages/ui-angular/src/index.test.ts packages/ui-angular/package.json packages/ui-angular/README.md
      - name: Generate framework artifacts
        run: npm run generate:framework-artifacts
      - name: Verify Angular catalog
        run: |
          node scripts/verify-angular-catalog-coverage.mjs
          npm run verify:generated-framework-artifacts
          npm run typecheck --workspace @vyrnforge/ui-angular
      - name: Commit finalized task
        run: |
          git rm .github/workflows/mfd-1204-finalize.yml
          git config user.name "vyrnforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/angular-catalog-generation.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs scripts/verify-angular-catalog-coverage.mjs packages/ui-angular
          git commit -m "feat(angular): generate full non-grid catalog (MFD-1204)"
          git push origin HEAD:mfd-1204-angular-full-catalog-bindings
