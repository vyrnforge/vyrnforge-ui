name: MFD-1204 finalize Angular catalog

on:
  push:
    branches:
      - mfd-1204-angular-full-catalog-bindings
    paths:
      - .github/workflows/mfd-1204-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mfd-1204-angular-full-catalog-bindings
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Finalize canonical Angular adaptation rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/angular-catalog-generation.mjs')
          text = path.read_text()

          def sub(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} structural patch target not found')

          mapped = '''function mappedEventField(record, event) {
            const hasField = (name) =>
              Boolean(name) && event.detailFields.some((field) => field.name === name);
            const publicChangeField = event.public.endsWith("Change")
              ? event.public.slice(0, -"Change".length)
              : null;

            if (event.detail === "value") {
              if (hasField(publicChangeField)) return publicChangeField;
              if (hasField("value")) return "value";
              const modelProperty = record.model?.property;
              if (hasField(modelProperty)) return modelProperty;
              return null;
            }
            if (event.detail !== "mapped") return null;

            const modelProperty = record.model?.property;
            if (hasField(modelProperty)) return modelProperty;
            if (hasField(publicChangeField)) return publicChangeField;
            if (event.detailFields.length === 1) return event.detailFields[0].name;
            return null;
          }

          function normalizeGeneratedComponent(record, nativeRecord, canonicalRecord) {'''
          sub(
              r'function mappedEventField\(record, event\) \{.*?\n\}\n\nfunction normalizeGeneratedComponent\(record, nativeRecord\) \{',
              mapped,
              'mapped event + normalize signature',
          )

          property_model = '''  const outputAliases = new Set(record.events.map((event) => event.public));
            const canonicalDefaultProperty = canonicalRecord?.model?.defaultProperty ?? null;
            const canonicalStateProperty = canonicalRecord?.model?.stateProperty ?? null;
            const properties = record.properties
              .filter(
                (property) =>
                  property.readOnly !== true && property.binding !== "readonly",
              )
              .map((property) => {
                const defaultInitializer =
                  canonicalDefaultProperty !== null &&
                  property.canonical === canonicalDefaultProperty;
                if (defaultInitializer) {
                  assert(
                    canonicalStateProperty,
                    `${record.id}: default input ${property.public} requires a canonical state property`,
                  );
                }
                return Object.freeze({
                  ...property,
                  runtimeCanonical: defaultInitializer
                    ? canonicalStateProperty
                    : property.canonical,
                  defaultInitializer,
                });
              });
            const directiveProperties = properties.filter(
              (property) => !outputAliases.has(property.public),
            );
            const hostBoundProperties = properties.filter((property) =>
              outputAliases.has(property.public),
            );
            assert(
              hostBoundProperties.every((property) => !property.defaultInitializer),
              `${record.id}: default initializer cannot collide with an output alias`,
            );

            if (!specialized) {'''
          sub(
              r'  const outputAliases = new Set\(record\.events\.map\(\(event\) => event\.public\)\);.*?\n\n  if \(!specialized\) \{',
              property_model,
              'default initializer model',
          )

          event_validation = '''      if (event.detail === "mapped" || event.detail === "value") {
                assert(
                  mappedEventField(record, event),
                  `${record.id}: ${event.detail} output ${event.public} needs a deterministic canonical field or specialization`,
                );
              }'''
          sub(
              r'      if \(event\.detail === "mapped"\) \{.*?\n      \}\n      if \(event\.detail === "value"\) \{.*?\n      \}',
              event_validation,
              'event validation',
          )

          sub(
              r'export function createAngularCatalogModel\(generationModel, exceptionRegistry\) \{',
              '''export function createAngularCatalogModel(
            generationModel,
            exceptionRegistry,
            canonicalById,
          ) {''',
              'catalog model signature',
          )

          sub(
              r'    const angularRecord = angularById\.get\(nativeRecord\.id\);\n    assert\(angularRecord, `\$\{nativeRecord\.id\}: missing Angular generation record`\);\n    const exception = findActiveAngularException\(exceptionRegistry, nativeRecord\.id\);',
              '''    const angularRecord = angularById.get(nativeRecord.id);
              assert(angularRecord, `${nativeRecord.id}: missing Angular generation record`);
              const canonicalRecord = canonicalById.get(nativeRecord.id);
              assert(canonicalRecord, `${nativeRecord.id}: missing canonical component record`);
              const exception = findActiveAngularException(exceptionRegistry, nativeRecord.id);''',
              'canonical component lookup',
          )

          sub(
              r'    components\.push\(normalizeGeneratedComponent\(angularRecord, nativeRecord\)\);',
              '''    components.push(
                normalizeGeneratedComponent(angularRecord, nativeRecord, canonicalRecord),
              );''',
              'normalize component call',
          )

          input_source = '''function inputSource(component, property) {
            const member = identifier(`${property.public}Input`);
            const runtimeCanonical = property.runtimeCanonical;
            if (property.defaultInitializer) {
              const guard = identifier(`${property.public}Applied`);
              return `  private ${guard} = false;\n\n  @Input("${property.public}")\n  set ${member}(value: ${component.exportName}Element["${runtimeCanonical}"] | undefined) {\n    if (!this.${guard} && value !== undefined) {\n      this.element.nativeElement["${runtimeCanonical}"] = value;\n      this.${guard} = true;\n    }\n  }`;
            }
            return `  @Input("${property.public}")\n  set ${member}(value: ${component.exportName}Element["${runtimeCanonical}"] | undefined) {\n    if (value !== undefined) {\n      this.element.nativeElement["${runtimeCanonical}"] = value;\n    }\n  }`;
          }

          function outputSource'''
          sub(
              r'function inputSource\(component, property\) \{.*?\n\}\n\nfunction outputSource',
              input_source,
              'input source',
          )

          slot_source = '''function slotSource(component) {
            const values = component.slots.map((slot) => `"${slot.public}"`).join(", ");
            const hasDefault = component.slots.some((slot) => slot.public === "default");
            const assignment = hasDefault
              ? '  if (slot === "default") element.removeAttribute("slot");\\n  else element.setAttribute("slot", slot);'
              : '  element.setAttribute("slot", slot);';
            return `export const ${component.exportName}SlotNames = Object.freeze([${values}] as const);\nexport type ${component.exportName}SlotName = (typeof ${component.exportName}SlotNames)[number];\n\nexport function compose${component.exportName}Slot(\n  element: HTMLElement,\n  slot: ${component.exportName}SlotName,\n): HTMLElement {\n${assignment}\n  return element;\n}`;
          }

          function inputContractSource'''
          sub(
              r'function slotSource\(component\) \{.*?\n\}\n\nfunction inputContractSource',
              slot_source,
              'slot source',
          )

          input_contract = '''function inputContractSource(component) {
            const lines = component.properties
              .map(
                (property) =>
                  `  ${JSON.stringify(property.public)}?: ${component.exportName}Element["${property.runtimeCanonical}"];`,
              )
              .join("\\n");
            return `export interface ${component.exportName}Inputs {\\n${lines}\\n}`;
          }

          function outputContractSource'''
          sub(
              r'function inputContractSource\(component\) \{.*?\n\}\n\nfunction outputContractSource',
              input_contract,
              'input contract source',
          )

          build_prefix = '''export function buildAngularCatalogArtifact({ root } = {}) {
            const contracts = loadCanonicalComponentContracts({ root });
            const generationModel = createFrameworkGenerationModel(contracts);
            const exceptionRegistry = loadFrameworkExceptions({ root });
            const canonicalById = new Map(
              contracts.components.map((component) => [component.id, component]),
            );
            const model = createAngularCatalogModel(
              generationModel,
              exceptionRegistry,
              canonicalById,
            );'''
          sub(
              r'export function buildAngularCatalogArtifact\(\{ root \} = \{\}\) \{\n  const contracts = loadCanonicalComponentContracts\(\{ root \}\);\n  const generationModel = createFrameworkGenerationModel\(contracts\);\n  const exceptionRegistry = loadFrameworkExceptions\(\{ root \}\);\n  const model = createAngularCatalogModel\(generationModel, exceptionRegistry\);',
              build_prefix,
              'artifact canonical index',
          )

          path.write_text(text)
          PY
      - name: Format authored sources
        run: npx prettier --write scripts/angular-catalog-generation.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs scripts/verify-angular-catalog-coverage.mjs packages/ui-angular/src/index.ts packages/ui-angular/src/index.test.ts packages/ui-angular/package.json packages/ui-angular/README.md
      - name: Generate framework artifacts
        run: npm run generate:framework-artifacts
      - name: Verify Angular catalog
        run: |
          node scripts/verify-angular-catalog-coverage.mjs
          npm run verify:generated-framework-artifacts
          npm run typecheck --workspace @vyrnforge/ui-angular
      - name: Commit finalized task
        run: |
          git rm .github/workflows/mfd-1204-finalize.yml
          git config user.name "vyrnforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/angular-catalog-generation.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs scripts/verify-angular-catalog-coverage.mjs packages/ui-angular
          git commit -m "feat(angular): generate full non-grid catalog (MFD-1204)"
          git push origin HEAD:mfd-1204-angular-full-catalog-bindings
