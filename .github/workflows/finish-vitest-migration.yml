name: Finish Vitest Migration

on:
  push:
    branches: [refactor/1051-standard-tooling]
    paths:
      - tooling/verify/finish-vitest-migration.mjs
      - .github/workflows/finish-vitest-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/1051-standard-tooling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node tooling/verify/finish-vitest-migration.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(testing): complete Vitest migration"
          git push origin HEAD:refactor/1051-standard-tooling
