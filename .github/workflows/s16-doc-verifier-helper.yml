name: S16 Documentation Verifier Helper

on:
  push:
    branches:
      - s16/bc-1602-docs-cleanup

permissions:
  contents: write

jobs:
  remove-retired-roadmap-paths:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1602-docs-cleanup
      - name: Remove retired roadmap paths
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/verify-documentation-current.mjs")
          text = path.read_text()
          for entry in [
              '  "docs/roadmap/00-master-roadmap.md",\n',
              '  "docs/roadmap/01-component-inventory.md",\n',
              '  "docs/roadmap/02-gap-analysis.md",\n',
              '  "docs/roadmap/03-do-not-build-yet.md",\n',
          ]:
              text = text.replace(entry, "")
          path.write_text(text)
      - name: Commit verifier cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-documentation-current.mjs
          git commit -m "chore: remove retired roadmap paths from docs verifier"
          git push origin HEAD:s16/bc-1602-docs-cleanup
