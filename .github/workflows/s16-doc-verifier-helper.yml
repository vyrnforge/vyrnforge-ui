name: S16 Documentation Verifier Helper

on:
  push:
    branches:
      - s16/bc-1602-docs-cleanup

permissions:
  contents: write

jobs:
  remove-retired-roadmap-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1602-docs-cleanup
      - name: Remove retired roadmap verification
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/verify-documentation-current.mjs")
          text = path.read_text()
          start = text.index("function verifyRoadmapContracts({ root, failures }) {")
          end = text.index("\nexport function verifyDocumentationCurrent", start)
          text = text[:start] + text[end + 1:]
          text = text.replace("  verifyRoadmapContracts({ root, failures });\n", "")
          path.write_text(text)
      - name: Commit verifier cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-documentation-current.mjs
          git commit -m "chore: retire roadmap task-ledger verification"
          git push origin HEAD:s16/bc-1602-docs-cleanup
