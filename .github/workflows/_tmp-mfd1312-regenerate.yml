name: Temporary MFD-1312 regenerate

on:
  push:
    branches:
      - feat/MFD-1312-vue-public-fixture

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1312-vue-public-fixture
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run generate:framework-artifacts
      - run: npx prettier --write scripts/vue-type-generation.mjs packages/ui-vue/src/plugin.ts packages/ui-vue/src/generated/typed-catalog.generated.ts docs/metadata/vue-model-adapter.json tests/consumers/manifest.json tests/consumers/vue/fixture.json docs/metadata/vue-consumer.json
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test --workspace @vyrnforge/ui-vue
      - run: node scripts/verify-multi-framework-architecture.mjs
      - name: Commit generated output
        run: |
          rm .github/workflows/_tmp-mfd1312-regenerate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vue-type-generation.mjs packages/ui-vue/src/plugin.ts packages/ui-vue/src/generated/typed-catalog.generated.ts docs/metadata/vue-model-adapter.json tests/consumers/manifest.json tests/consumers/vue/fixture.json docs/metadata/vue-consumer.json .github/workflows/_tmp-mfd1312-regenerate.yml
          git commit -m "chore(vue): regenerate MFD-1312 public fixture contracts"
          git push origin HEAD:feat/MFD-1312-vue-public-fixture
