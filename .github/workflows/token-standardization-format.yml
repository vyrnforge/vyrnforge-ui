name: Token standardization formatting

on:
  push:
    branches:
      - fix/token-contract-standardization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/token-contract-standardization
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Keep token contract compatible with the ui-core build target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "packages/ui-core/src/theme/tokenContract.ts";
          const source = readFileSync(path, "utf8");
          const next = source.replace('.replaceAll("-", " ")', '.replace(/-/gu, " ")');
          if (next === source) throw new Error("replaceAll token-purpose transform was not found");
          writeFileSync(path, next);
          NODE
      - run: npx prettier --write packages/ui-core/src/theme/tokenContract.ts scripts/verify-design-token-contract.mjs scripts/verify-design-token-contract.test.mjs
      - name: Commit corrected files
        run: |
          if git diff --quiet -- packages/ui-core/src/theme/tokenContract.ts scripts/verify-design-token-contract.mjs scripts/verify-design-token-contract.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-core/src/theme/tokenContract.ts scripts/verify-design-token-contract.mjs scripts/verify-design-token-contract.test.mjs
          git commit -m "fix(tokens): support ui-core build target"
          git push origin HEAD:fix/token-contract-standardization
