name: S12 Prettier Output

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format S12 Markdown
        run: |
          npx prettier --write \
            docs/api/import-and-setup.md \
            docs/packages/ui-angular.md \
            docs/README.md \
            docs/release/multi-framework-migration-and-limitations.md \
            packages/ui-angular/README.md
      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s12-prettier-output
          path: |
            docs/api/import-and-setup.md
            docs/packages/ui-angular.md
            docs/README.md
            docs/release/multi-framework-migration-and-limitations.md
            packages/ui-angular/README.md
          if-no-files-found: error
