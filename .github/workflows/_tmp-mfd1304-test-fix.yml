name: Temporary MFD-1304 ownership test fix

on:
  push:
    branches:
      - tmp/MFD-1304-test-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Update historical Vue package ownership assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = "scripts/framework-generation.test.mjs";
          let source = readFileSync(file, "utf8");
          source = source.replace(
            'test("Button representative generators emit removable proof artifacts without premature framework packages",',
            'test("Button representative generators track framework artifact ownership",',
          );
          const oldBlock = `  assert.equal(\n    FRAMEWORK_BUTTON_ARTIFACT_PATHS.vue.startsWith("packages/ui-vue/"),\n    false,\n  );`;
          const newBlock = `  assert.equal(\n    FRAMEWORK_BUTTON_ARTIFACT_PATHS.vue.startsWith("packages/ui-vue/"),\n    true,\n  );`;
          if (!source.includes(oldBlock)) throw new Error("legacy Vue ownership assertion not found");
          source = source.replace(oldBlock, newBlock);
          writeFileSync(file, source, "utf8");
          NODE
      - name: Commit clean task tree
        run: |
          rm .github/workflows/_tmp-mfd1304-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(vue): update generated artifact ownership contract"
          git push
