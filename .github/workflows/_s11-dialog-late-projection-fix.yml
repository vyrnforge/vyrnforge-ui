name: S11 Dialog Late Projection Fix

on:
  push:
    branches:
      - s11-dialog-generation-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s11-dialog-generation-slice
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - run: npm ci
      - name: Patch late overlay projection support
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/ui-elements/src/components/overlays.ts')
          text = path.read_text()

          old = '''  protected override connected(): void {
    this.ensureScaffold();
    this.addEventListener("keydown", this.handleKeyDown);
  }

  protected override disconnected(): void {
    this.removeEventListener("keydown", this.handleKeyDown);
  }

  protected override update(): void {
    const scaffold = this.ensureScaffold();
    if (!scaffold) return;'''
          new = '''  protected override connected(): void {
    this.ensureScaffold();
    this.#childObserver = new MutationObserver(() => this.requestUpdate());
    this.#childObserver.observe(this, { childList: true });
    this.addEventListener("keydown", this.handleKeyDown);
  }

  protected override disconnected(): void {
    this.#childObserver?.disconnect();
    this.#childObserver = null;
    this.removeEventListener("keydown", this.handleKeyDown);
  }

  protected override update(): void {
    const scaffold = this.ensureScaffold();
    if (!scaffold) return;
    this.reconcileExternalNodes(scaffold);'''
          if old not in text:
              raise SystemExit('connected/update block not found')
          text = text.replace(old, new, 1)

          marker = '''  private ensureScaffold(): {
    backdrop: HTMLDivElement;
    body: HTMLDivElement;
    description: HTMLParagraphElement;
    surface: HTMLDivElement;
    title: HTMLHeadingElement;
  } | null {'''
          method = '''  private reconcileExternalNodes(scaffold: {
    backdrop: HTMLDivElement;
    body: HTMLDivElement;
    description: HTMLParagraphElement;
    surface: HTMLDivElement;
    title: HTMLHeadingElement;
  }): void {
    const externalNodes = [...this.childNodes].filter(
      (node) =>
        !(node instanceof Element && node.hasAttribute("data-vf-overlay-internal")),
    );
    if (externalNodes.length === 0) return;

    const triggerContainer = this.querySelector<HTMLElement>(
      `:scope > .${this.overlayConfig.baseClass}__trigger`,
    );
    const header = scaffold.surface.querySelector<HTMLElement>(
      `.${this.overlayConfig.baseClass}__header`,
    );
    const actions = scaffold.surface.querySelector<HTMLElement>(
      `.${this.overlayConfig.baseClass}__actions`,
    );
    const footer = scaffold.surface.querySelector<HTMLElement>(
      `.${this.overlayConfig.baseClass}__footer`,
    );
    const close = scaffold.surface.querySelector<HTMLElement>(
      `.${this.overlayConfig.baseClass}__close`,
    );

    for (const node of externalNodes) {
      const slot = node instanceof Element ? node.getAttribute("slot") : null;
      if (node instanceof Element) node.removeAttribute("slot");

      if (slot === "trigger" && node instanceof HTMLElement && triggerContainer) {
        this.#trigger?.removeEventListener("click", this.handleTriggerClick);
        this.#trigger = node;
        this.#trigger.addEventListener("click", this.handleTriggerClick);
        triggerContainer.replaceChildren(node);
      } else if (slot === "header" && header) {
        if (close) header.insertBefore(node, close);
        else header.append(node);
      } else if (slot === "actions" && actions) {
        actions.hidden = false;
        actions.append(node);
      } else if (slot === "footer" && footer) {
        footer.hidden = false;
        footer.append(node);
      } else {
        scaffold.body.append(node);
      }
    }
  }

'''
          if marker not in text:
              raise SystemExit('ensureScaffold marker not found')
          text = text.replace(marker, method + marker, 1)

          field_marker = '''  #trigger: HTMLElement | null = null;'''
          field_new = '''  #trigger: HTMLElement | null = null;
  #childObserver: MutationObserver | null = null;'''
          if field_marker not in text:
              raise SystemExit('trigger field marker not found')
          text = text.replace(field_marker, field_new, 1)
          path.write_text(text)
          PY
      - run: npx prettier --write packages/ui-elements/src/components/overlays.ts
      - run: npm run typecheck --workspace @vyrnforge/ui-elements
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-elements/src/components/overlays.ts
          git commit -m "fix: reconcile late Dialog light-DOM projection"
          git push origin HEAD:s11-dialog-generation-slice
