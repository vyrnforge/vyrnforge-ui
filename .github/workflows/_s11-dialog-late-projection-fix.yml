name: S11 Dialog Late Projection Fix

on:
  push:
    branches:
      - s11-dialog-generation-slice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s11-dialog-generation-slice
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - run: npm ci
      - name: Patch late overlay projection support
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 --decode | python
      - run: npx prettier --write packages/ui-elements/src/components/overlays.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-elements/src/components/overlays.ts
          git commit -m "fix: reconcile late Dialog light-DOM projection"
          git push origin HEAD:s11-dialog-generation-slice
