name: Native Menu cross-engine evidence
on:
  push:
    branches: [evidence/l5-native-menu-cross]
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"menu,split-button,menubar"},{"port":"react","components":"menu,split-button,menubar"},{"port":"vue","components":"menu,split-button,menubar"},{"port":"angular","components":"menu,split-button,menubar"},{"port":"elements","components":"menu,split-button,menubar"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: menu-cross
      retention_days: 14
