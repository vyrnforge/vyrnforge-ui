name: L5 Carousel formatter (temporary)
on:
  push:
    branches: [fix/l5-carousel-contract]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/l5-carousel-contract
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format Carousel source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm exec prettier --write "product/components/composite-widgets/content-navigation/carousel/**/*.{ts,tsx,mjs,css,json,md}"
          pnpm format:l5:check
          pnpm lint:l5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- product/components/composite-widgets/content-navigation/carousel
          if ! git diff --cached --quiet; then
            git commit -m "style(l5): format Carousel remediation"
            git push origin HEAD:refs/heads/fix/l5-carousel-contract
          fi
