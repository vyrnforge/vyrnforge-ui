name: Nested Menu cross-engine evidence
on:
  push:
    branches: [evidence/l5-menu-nested-cross]
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"menubar,menu,split-button"},{"port":"react","components":"menubar,menu,split-button"},{"port":"vue","components":"menubar,menu,split-button"},{"port":"angular","components":"menubar,menu,split-button"},{"port":"elements","components":"menubar,menu,split-button"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: menu-nested-cross
      retention_days: 14
