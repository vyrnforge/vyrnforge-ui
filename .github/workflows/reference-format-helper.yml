name: Reference format helper

on:
  pull_request:
    paths:
      - ".github/workflows/reference-format-helper.yml"
      - "apps/docs/src/ComponentReferencePage.tsx"
      - "apps/docs/src/DiscoveryReferencePage.tsx"
      - "apps/docs/src/PackageReferencePage.tsx"
      - "apps/docs/src/styles/reference-shell.css"
      - "tests/reference-ui/reference-product.spec.ts"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format Reference files
        run: |
          npx prettier --write \
            apps/docs/src/ComponentReferencePage.tsx \
            apps/docs/src/DiscoveryReferencePage.tsx \
            apps/docs/src/PackageReferencePage.tsx \
            apps/docs/src/styles/reference-shell.css \
            tests/reference-ui/reference-product.spec.ts
      - name: Upload formatted output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-format-output
          path: |
            apps/docs/src/ComponentReferencePage.tsx
            apps/docs/src/DiscoveryReferencePage.tsx
            apps/docs/src/PackageReferencePage.tsx
            apps/docs/src/styles/reference-shell.css
            tests/reference-ui/reference-product.spec.ts
          if-no-files-found: error
