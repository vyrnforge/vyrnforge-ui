name: Reference format helper

on:
  pull_request:
    paths:
      - ".github/workflows/reference-format-helper.yml"
      - "apps/docs/src/ComponentReferencePage.tsx"
      - "apps/docs/src/DiscoveryReferencePage.tsx"
      - "apps/docs/src/PackageReferencePage.tsx"
      - "apps/docs/src/styles/reference-shell.css"
      - "tests/reference-ui/reference-product.spec.ts"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format Reference files
        run: |
          npx prettier --write \
            apps/docs/src/ComponentReferencePage.tsx \
            apps/docs/src/DiscoveryReferencePage.tsx \
            apps/docs/src/PackageReferencePage.tsx \
            apps/docs/src/styles/reference-shell.css \
            tests/reference-ui/reference-product.spec.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/docs/src/ComponentReferencePage.tsx \
            apps/docs/src/DiscoveryReferencePage.tsx \
            apps/docs/src/PackageReferencePage.tsx \
            apps/docs/src/styles/reference-shell.css \
            tests/reference-ui/reference-product.spec.ts
          git commit -m "style(docs): format Reference information architecture"
          git push origin HEAD:${{ github.head_ref }}
