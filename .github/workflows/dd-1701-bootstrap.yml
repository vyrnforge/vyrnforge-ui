name: DD-1701 canonical metadata update

on:
  push:
    branches:
      - feat/dd-1701-description-list-contract
    paths:
      - .github/workflows/dd-1701-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dd-1701-description-list-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install repository dependencies
        run: npm ci
      - name: Apply canonical DescriptionList metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const contractPath = 'docs/metadata/component-contracts.json';
          const metadataPath = 'docs/metadata/components.json';
          const testPath = 'scripts/canonical-component-contracts.test.mjs';

          const indentObject = (value, spaces = 4) => {
            const prefix = ' '.repeat(spaces);
            return JSON.stringify(value, null, 2)
              .split('\n')
              .map((line) => `${prefix}${line}`)
              .join('\n');
          };

          const contract = {
            id: 'description-list',
            category: 'data-display',
            properties: [],
            attributes: [],
            events: [],
            slots: [{ name: 'default', required: true, multiple: true, content: 'element' }],
            methods: [],
            form: {
              association: 'none',
              disabledProperty: null,
              validity: { supported: false, methods: [] },
              reset: { supported: false },
            },
            model: {
              kind: 'none',
              controlled: false,
              stateProperty: null,
              defaultProperty: null,
              changeEvent: null,
              disabledProperty: null,
              touchedSemantics: 'none',
            },
            ref: {
              exposure: 'element',
              methods: [],
              elementType: 'VyrnForgeDescriptionListElement',
            },
            accessibility: [
              'preserves native description-list semantics for term and description relationships',
              'projected content must retain semantic term and description structure rather than generic grouping roles',
            ],
            frameworkMappings: {
              native: {
                package: '@vyrnforge/ui-elements',
                status: 'target',
                tag: 'vf-description-list',
                properties: [],
                events: [],
                slots: [{ canonical: 'default', public: 'default', mode: 'slot' }],
                model: { mode: 'none', property: null, event: null },
                ref: { mode: 'element', type: 'VyrnForgeDescriptionListElement' },
                setup: ['register custom element'],
              },
              react: {
                package: '@vyrnforge/ui-components',
                status: 'target',
                export: 'DescriptionList',
                properties: [],
                events: [],
                slots: [{ canonical: 'default', public: 'children', mode: 'children' }],
                model: { mode: 'none', property: null, event: null },
                ref: { mode: 'forwarded-ref', type: 'DescriptionListRef' },
              },
              angular: {
                package: '@vyrnforge/ui-angular',
                status: 'target',
                export: 'VfDescriptionList',
                properties: [],
                events: [],
                slots: [{ canonical: 'default', public: 'default', mode: 'content-projection' }],
                model: { mode: 'none', property: null, event: null },
                ref: { mode: 'view-child', type: 'VfDescriptionList' },
              },
              vue: {
                package: '@vyrnforge/ui-vue',
                status: 'target',
                export: 'VfDescriptionList',
                properties: [],
                events: [],
                slots: [{ canonical: 'default', public: 'default', mode: 'slot' }],
                model: { mode: 'none', property: null, event: null },
                ref: { mode: 'template-ref', type: 'VfDescriptionListExposed' },
              },
            },
          };

          let contractSource = fs.readFileSync(contractPath, 'utf8');
          if (contractSource.includes('"id": "description-list"')) {
            throw new Error('description-list contract already exists');
          }
          const contractNeedle = '  "componentContracts": [\n';
          if (!contractSource.includes(contractNeedle)) {
            throw new Error('canonical componentContracts insertion point not found');
          }
          contractSource = contractSource.replace(
            contractNeedle,
            `${contractNeedle}${indentObject(contract)},\n`,
          );
          fs.writeFileSync(contractPath, contractSource, 'utf8');

          const component = {
            id: 'description-list',
            displayName: 'DescriptionList',
            package: '@vyrnforge/ui-components',
            category: 'data-display',
            maturity: 'planned',
            owner: 'Component Team',
            sourcePath: 'not-applicable',
            publicExport: false,
            since: 'not-applicable',
            docsPath: 'docs/api/ui-components-api.md',
            playgroundPath: 'not-applicable',
            evidence: {
              maturityEvidenceKey: 'description-list',
              status: 'requires-verification',
            },
            accessibility: {
              documentationPath: 'docs/api/ui-components-api.md',
              keyboardDocumentation: 'not-applicable',
            },
            knownLimitations: [
              'Renderer implementations remain deferred to the framework-specific DescriptionList tasks.',
            ],
            deprecation: { status: 'not-applicable' },
            purpose: 'Read-only term-and-description facts with semantic description-list relationships.',
            useWhen: 'Use for labeled facts, attributes, metadata, or key/value details where terms describe one or more values.',
            avoidWhen: 'Avoid for tabular comparisons that require row and column relationships or for interactive form fields.',
            relatedComponents: ['KeyValueList', 'PropertyTable'],
            cssClasses: [],
            cssVariables: [],
            importExample: 'Planned; no import yet.',
            basicUsageExample: 'Planned.',
            accessibilityNotes: 'Preserve native description-list term and description relationships; do not replace them with generic grouping roles.',
            aiUsageNotes: 'Use semantic dl/dt/dd markup until a renderer exists; when DescriptionList is available, preserve the same term/description structure and do not invent a stateful data API.',
            frameworkParity: {
              betaScope: 'excluded',
              react: {
                package: '@vyrnforge/ui-components',
                export: 'DescriptionList',
                status: 'target',
              },
              behaviors: {
                package: '@vyrnforge/ui-behaviors',
                status: 'not-applicable',
                componentController: 'not-applicable',
              },
              native: {
                package: '@vyrnforge/ui-elements',
                status: 'target',
                strategy: 'direct-element',
                target: 'vf-description-list',
                evidence: 'pending',
              },
              angular: {
                status: 'target',
                consumes: '@vyrnforge/ui-elements',
                evidence: 'pending',
              },
              vue: {
                status: 'target',
                consumes: '@vyrnforge/ui-elements',
                evidence: 'pending',
              },
            },
          };

          let metadataSource = fs.readFileSync(metadataPath, 'utf8');
          const startMarker = '    {\n      "id": "description-list",';
          const endMarker = '    {\n      "id": "key-value-list",';
          const start = metadataSource.indexOf(startMarker);
          const end = metadataSource.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) {
            throw new Error('existing planned DescriptionList metadata block not found');
          }
          metadataSource = `${metadataSource.slice(0, start)}${indentObject(component)},\n${metadataSource.slice(end)}`;
          fs.writeFileSync(metadataPath, metadataSource, 'utf8');

          let testSource = fs.readFileSync(testPath, 'utf8');
          if (!testSource.includes('DescriptionList keeps a semantic, state-free cross-framework contract')) {
            testSource += `\n\ntest("DescriptionList keeps a semantic, state-free cross-framework contract", () => {\n  const normalized = normalizeCanonicalComponentContracts(canonicalDocument);\n  const contract = normalized.componentById.get("description-list");\n\n  assert.ok(contract);\n  assert.equal(contract.category, "data-display");\n  assert.deepEqual(contract.properties, []);\n  assert.deepEqual(contract.attributes, []);\n  assert.deepEqual(contract.events, []);\n  assert.deepEqual(contract.methods, []);\n  assert.equal(contract.form.association, "none");\n  assert.equal(contract.model.kind, "none");\n  assert.deepEqual(contract.slots, [\n    { name: "default", required: true, multiple: true, content: "element" },\n  ]);\n  assert.ok(\n    contract.accessibility.some((rule) =>\n      rule.includes("native description-list semantics"),\n    ),\n  );\n  for (const framework of ["native", "react", "angular", "vue"]) {\n    assert.equal(contract.frameworkMappings[framework].status, "target");\n  }\n});\n`;
            fs.writeFileSync(testPath, testSource, 'utf8');
          }
          NODE
      - name: Regenerate canonical references
        run: |
          node scripts/generate-component-reference.mjs
          node scripts/generate-framework-artifacts.mjs
      - name: Verify DD-1701 contract and metadata
        run: |
          node scripts/verify-canonical-component-contracts.mjs
          node scripts/verify-component-metadata.mjs
          node scripts/verify-component-maturity.mjs
          node scripts/verify-component-reference.mjs
          node scripts/verify-generated-framework-artifacts.mjs
          node --test scripts/canonical-component-contracts.test.mjs scripts/verify-component-metadata.test.mjs scripts/verify-component-reference.test.mjs scripts/generated-framework-artifacts.test.mjs
      - name: Commit canonical DD-1701 change
        shell: bash
        run: |
          rm .github/workflows/dd-1701-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata/component-contracts.json docs/metadata/components.json docs/generated packages/ui-elements/custom-elements.json packages/ui-elements/src/custom-elements.ts scripts/canonical-component-contracts.test.mjs .github/workflows/dd-1701-bootstrap.yml
          git diff --cached --check
          git status --short
          git commit -m "feat: define DescriptionList canonical contract"
          git push origin HEAD:feat/dd-1701-description-list-contract
