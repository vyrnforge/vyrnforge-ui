name: Temporary MFD-1310 refs

on:
  push:
    branches:
      - feat/MFD-1310-vue-method-refs

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1310-vue-method-refs
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run generate:framework-artifacts
      - name: Add direct-ref consumer and method verifier
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const consumer = `<script setup lang="ts">
          import { ref } from "vue";
          import {
            VfCheckbox,
            VfDialog,
            VfPopover,
            VfTextInput,
            VfToggleButton,
            type VfCheckboxRef,
            type VfDialogRef,
            type VfPopoverRef,
            type VfTextInputRef,
          } from "./index";

          const text = ref("typed");
          const open = ref(false);
          const pressed = ref(false);
          const textRef = ref<VfTextInputRef | null>(null);
          const dialogRef = ref<VfDialogRef | null>(null);
          const checkboxRef = ref<VfCheckboxRef | null>(null);
          const popoverRef = ref<VfPopoverRef | null>(null);

          textRef.value?.focus();
          textRef.value?.select();
          textRef.value?.checkValidity();
          textRef.value?.reportValidity();
          textRef.value?.setCustomValidity("");
          dialogRef.value?.show();
          dialogRef.value?.close();
          dialogRef.value?.focus();
          checkboxRef.value?.focus();
          checkboxRef.value?.checkValidity();
          popoverRef.value?.show();
          popoverRef.value?.toggle();
          popoverRef.value?.close();
          </script>

          <template>
            <VfTextInput ref="textRef" v-model="text" label="Typed" />
            <VfCheckbox ref="checkboxRef" :model-value="false" label="Checked" />
            <VfPopover ref="popoverRef">Popover</VfPopover>
            <VfDialog ref="dialogRef" v-model:open="open">
              <template #header>Header</template>
              Typed dialog
            </VfDialog>
            <VfToggleButton v-model:pressed="pressed">Toggle</VfToggleButton>
          </template>
          `.replace(/^          /gm, '');
          fs.writeFileSync('packages/ui-vue/src/type-surface.consumer.vue', consumer);

          const verifier = `import { readFileSync } from "node:fs";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { loadCanonicalComponentContracts } from "./canonical-component-contracts.mjs";
          import { createFrameworkGenerationModel } from "./framework-generation.mjs";
          import { buildVueCatalogArtifact } from "./vue-catalog-generation.mjs";
          import { buildVueTypedCatalogArtifact } from "./vue-type-generation.mjs";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const model = createFrameworkGenerationModel(loadCanonicalComponentContracts({ root }));
          const records = model.surfaces.vue.components.filter(
            (record) => ["current", "target"].includes(record.status) && record.methods.length > 0,
          );
          if (records.length !== 23) {
            throw new Error(\`Expected 23 Vue components with canonical methods, received \${records.length}\`);
          }
          const catalog = buildVueCatalogArtifact({ root });
          const typed = buildVueTypedCatalogArtifact({ root });
          const generatedCatalog = readFileSync(path.join(root, catalog.path), "utf8");
          const generatedTyped = readFileSync(path.join(root, typed.path), "utf8");
          if (generatedCatalog !== catalog.content) throw new Error("Vue catalog is stale");
          if (generatedTyped !== typed.content) throw new Error("Vue typed catalog is stale");
          for (const record of records) {
            const typedComponent = typed.components.find((entry) => entry.id === record.id);
            const runtimeComponent = catalog.components.find((entry) => entry.id === record.id);
            if (!typedComponent || !runtimeComponent) throw new Error(\`Missing Vue method component \${record.id}\`);
            const expected = record.methods.map((method) => method.name);
            if (JSON.stringify(runtimeComponent.methods) !== JSON.stringify(expected)) {
              throw new Error(\`Runtime method inventory mismatch for \${record.id}\`);
            }
            if (JSON.stringify(typedComponent.methods.map((method) => method.name)) !== JSON.stringify(expected)) {
              throw new Error(\`Typed method inventory mismatch for \${record.id}\`);
            }
          }
          for (const marker of [
            'VfTextInputRef',
            'readonly setCustomValidity:',
            'VfDialogRef',
            'readonly show:',
            'VfPopoverRef',
            'readonly toggle:',
          ]) {
            if (!generatedTyped.includes(marker)) throw new Error(\`Missing typed ref marker: \${marker}\`);
          }
          console.log("Vue imperative method verification passed for 23 canonical method-bearing components.");
          `.replace(/^          /gm, '');
          fs.writeFileSync('scripts/verify-vue-imperative-methods.mjs', verifier);

          const pkgPath = 'packages/ui-vue/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.scripts.test = pkg.scripts.test.replace(
            'node ../../scripts/verify-vue-model-matrix.mjs &&',
            'node ../../scripts/verify-vue-model-matrix.mjs && node ../../scripts/verify-vue-imperative-methods.mjs &&',
          );
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - run: npx prettier --write scripts/vue-catalog-generation.mjs scripts/vue-type-generation.mjs scripts/verify-vue-imperative-methods.mjs packages/ui-vue/src/type-surface.consumer.vue packages/ui-vue/src/generated/catalog.generated.ts packages/ui-vue/src/generated/typed-catalog.generated.ts packages/ui-vue/package.json
      - run: npm run lint
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test --workspace @vyrnforge/ui-vue
      - run: node scripts/generated-framework-artifacts.test.mjs
      - name: Commit generated ref support
        run: |
          rm .github/workflows/_tmp-mfd1310-refs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vue-catalog-generation.mjs scripts/vue-type-generation.mjs scripts/verify-vue-imperative-methods.mjs packages/ui-vue/src/type-surface.consumer.vue packages/ui-vue/src/generated/catalog.generated.ts packages/ui-vue/src/generated/typed-catalog.generated.ts packages/ui-vue/package.json .github/workflows/_tmp-mfd1310-refs.yml
          git commit -m "feat(vue): generate typed imperative ref methods"
          git push origin HEAD:feat/MFD-1310-vue-method-refs
