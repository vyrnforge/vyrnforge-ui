name: Component docs format preview

on:
  push:
    branches:
      - feat/810-component-doc-completeness

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Print exact formatting diff
        run: |
          npx prettier --write \
            apps/docs/src/ComponentReferencePage.tsx \
            apps/docs/src/ReferenceComponentSpecimen.tsx \
            docs/metadata/component-documentation.json \
            tests/reference-ui/reference-product.spec.ts
          git diff -- \
            apps/docs/src/ComponentReferencePage.tsx \
            apps/docs/src/ReferenceComponentSpecimen.tsx \
            docs/metadata/component-documentation.json \
            tests/reference-ui/reference-product.spec.ts
