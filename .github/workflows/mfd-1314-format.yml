name: MFD-1314 Format Evidence

on:
  push:
    branches:
      - feat/MFD-1314-vue-support-evidence
    paths:
      - ".github/workflows/mfd-1314-format.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format S13 files
        run: npx prettier --write docs/packages/ui-vue.md scripts/compatibility-release-matrix.mjs scripts/run-compatibility-release-case.mjs
      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mfd-1314-formatted-files
          path: |
            docs/packages/ui-vue.md
            scripts/compatibility-release-matrix.mjs
            scripts/run-compatibility-release-case.mjs
          if-no-files-found: error
