name: Apply Angular APF Migration

on:
  push:
    branches: [refactor/1051-standard-tooling]
    paths:
      - tooling/verify/apply-angular-apf-migration.mjs
      - .github/workflows/apply-angular-apf-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/1051-standard-tooling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node tooling/verify/apply-angular-apf-migration.mjs prepare
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec nx run @vyrnforge/web:build
      - run: pnpm --filter @vyrnforge/angular run build
      - run: node tooling/verify/apply-angular-apf-migration.mjs finalize
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(angular): package Angular with APF and ng-packagr"
          git push origin HEAD:refactor/1051-standard-tooling
