name: Temporary MFD-1309 lint fix

on:
  push:
    branches:
      - feat/MFD-1309-vue-slots

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1309-vue-slots
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Remove obsolete slot locals
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/framework-button-generation.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace('  const prefixSlot = record.slots.find((slot) => slot.canonical === "prefix");\n', '');
          source = source.replace('  const suffixSlot = record.slots.find((slot) => slot.canonical === "suffix");\n', '');
          fs.writeFileSync(file, source);
          NODE
      - run: npx prettier --write scripts/framework-button-generation.mjs
      - run: npm run lint
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test --workspace @vyrnforge/ui-vue
      - name: Commit lint fix
        run: |
          rm .github/workflows/_tmp-mfd1309-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/framework-button-generation.mjs .github/workflows/_tmp-mfd1309-lint.yml
          git commit -m "fix(vue): remove obsolete slot generator locals"
          git push origin HEAD:feat/MFD-1309-vue-slots
