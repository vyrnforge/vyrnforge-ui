name: Token standardization rework

on:
  push:
    branches:
      - fix/token-contract-standardization

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/token-contract-standardization
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore lean public ui-core contract
        run: |
          git fetch origin main
          git show origin/main:packages/ui-core/src/theme/tokenContract.ts > packages/ui-core/src/theme/tokenContract.ts
          git show origin/main:packages/ui-core/src/theme/tokenContract.test.ts > packages/ui-core/src/theme/tokenContract.test.ts
          git show origin/main:packages/ui-core/src/index.ts > packages/ui-core/src/index.ts
      - name: Migrate remaining token consumers to generated projection
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          function rewrite(path, transform) {
            const source = readFileSync(path, "utf8");
            const next = transform(source);
            if (next === source) throw new Error(`No migration applied to ${path}`);
            writeFileSync(path, next);
          }

          rewrite("scripts/generate-reference-model.test.mjs", (source) => {
            let next = source.replace(
              '  "docs/metadata/design-tokens.json",',
              '  "docs/generated/design-token-reference.json",\n  "packages/ui-core/src/theme/tokenContract.ts",',
            );
            next = next.replace(
              '  assert.equal(model.tokenData.authority, "docs/metadata/design-tokens.json");',
              '  assert.equal(\n    model.tokenData.authority,\n    "packages/ui-core/src/theme/tokenContract.ts",\n  );\n  assert.equal(\n    model.tokenData.projection,\n    "docs/generated/design-token-reference.json",\n  );',
            );
            return next;
          });

          rewrite("scripts/verify-visual-regression-contract.mjs", (source) =>
            source.replace(
              'designTokens: readJson(root, "docs/metadata/design-tokens.json"),',
              'designTokens: readJson(root, "docs/generated/design-token-reference.json"),',
            ),
          );

          rewrite("scripts/reference-discovery-contract.test.mjs", (source) => {
            let next = source.replace(
              '    "packages/ui-core/src/theme/tokenContract.ts",\n  );\n  assert.equal(\n    tokenDomain.recordSource.collection,\n    "vyrnForgeDesignTokenCategories",',
              '    "docs/generated/design-token-reference.json",\n  );\n  assert.equal(tokenDomain.recordSource.collection, "categories",',
            );
            next = next.replace(
              '  assert.match(adapter, /@vyrnforge\\/ui-core/u);\n  assert.match(adapter, /vyrnForgeDesignTokenCategories/u);\n  assert.doesNotMatch(adapter, /design-tokens\\.json\\?raw/u);',
              '  assert.match(adapter, /generated\\/design-token-reference\\.json\\?raw/u);\n  assert.doesNotMatch(adapter, /metadata\\/design-tokens\\.json\\?raw/u);\n  assert(!adapter.includes(`from "@vyrnforge/ui-core"`));',
            );
            next = next.replace(
              '  assert.equal(\n    model.tokenData.authority,\n    "packages/ui-core/src/theme/tokenContract.ts",\n  );',
              '  assert.equal(\n    model.tokenData.authority,\n    "packages/ui-core/src/theme/tokenContract.ts",\n  );\n  assert.equal(\n    model.tokenData.projection,\n    "docs/generated/design-token-reference.json",\n  );',
            );
            return next;
          });
          NODE
      - name: Generate Reference token and discovery artifacts
        run: |
          node scripts/generate-design-token-reference.mjs
          node scripts/generate-reference-model.mjs
          node scripts/generate-documentation-registry.mjs
      - name: Format changed sources
        run: |
          npx prettier --write \
            apps/docs/src/discoveryData.ts \
            apps/docs/src/ReferenceTokenGallery.tsx \
            scripts/generate-design-token-reference.mjs \
            scripts/generate-reference-model.mjs \
            scripts/generate-reference-model.test.mjs \
            scripts/reference-discovery-contract.test.mjs \
            scripts/verify-design-token-contract.mjs \
            scripts/verify-design-token-contract.test.mjs \
            scripts/verify-visual-regression-contract.mjs \
            docs/generated/design-token-reference.json \
            docs/generated/reference-model.json \
            docs/generated/documentation-registry.json
      - name: Verify focused token contracts
        run: |
          node scripts/verify-design-token-contract.mjs
          node --test \
            scripts/verify-design-token-contract.test.mjs \
            scripts/generate-reference-model.test.mjs \
            scripts/reference-discovery-contract.test.mjs \
            scripts/verify-visual-regression-contract.test.mjs
      - name: Commit lean token standardization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/ui-core/src/theme/tokenContract.ts \
            packages/ui-core/src/theme/tokenContract.test.ts \
            packages/ui-core/src/index.ts \
            apps/docs/src/discoveryData.ts \
            apps/docs/src/ReferenceTokenGallery.tsx \
            scripts/generate-design-token-reference.mjs \
            scripts/generate-reference-model.mjs \
            scripts/generate-reference-model.test.mjs \
            scripts/reference-discovery-contract.test.mjs \
            scripts/verify-design-token-contract.mjs \
            scripts/verify-design-token-contract.test.mjs \
            scripts/verify-visual-regression-contract.mjs \
            docs/generated/design-token-reference.json \
            docs/generated/reference-model.json \
            docs/generated/documentation-registry.json
          git commit -m "fix(tokens): keep Reference metadata out of ui-core runtime"
          git push origin HEAD:fix/token-contract-standardization
