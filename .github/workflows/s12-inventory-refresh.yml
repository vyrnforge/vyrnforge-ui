name: S12 Inventory Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'scratch/s12-inventory-refresh'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: scratch/s12-inventory-refresh
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Refresh repository inventory for promotion tree
        run: |
          rm .github/workflows/s12-inventory-refresh.yml
          npm run inventory:repository
          git diff --check
          npm run verify:repository-inventory

      - name: Commit generated inventory
        run: |
          git restore .github/workflows/s12-inventory-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/repository-inventory.md
          git commit -m "docs(governance): refresh exact promotion inventory"
          git push origin HEAD:scratch/s12-inventory-refresh
