name: L5 format export (temporary)
on:
  push:
    branches: [chore/l5-source-quality]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/l5-source-quality
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format canonical L5 sources
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm exec prettier --write "product/components/composite-widgets/**/*.{ts,tsx,mts,cts,js,mjs,cjs,css,json,md,html}"
          pnpm exec prettier --check "product/components/composite-widgets/**/*.{ts,tsx,mts,cts,js,mjs,cjs,css,json,md,html}"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- product/components/composite-widgets
          if ! git diff --cached --quiet; then
            git commit -m "style(l5): format canonical composite widget sources"
            git push origin HEAD:refs/heads/chore/l5-source-quality
          fi
      - name: Inspect canonical TypeScript lint debt
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = readFileSync('eslint.config.mjs','utf8');
          const scope = "'packages/{core,web,icons,react,angular,vue,elements}/src/**/*.{ts,tsx,mts,cts}'";
          const next = config.replace(scope, scope + ", 'product/components/composite-widgets/**/*.{ts,tsx,mts,cts}'").replace('projectService: true,','projectService: false,');
          if (next === config) throw new Error('lint configuration not changed');
          writeFileSync('eslint.config.mjs', next);
          NODE
          pnpm exec eslint "product/components/composite-widgets/**/*.{ts,tsx,mts,cts,js,mjs}" --max-warnings=0 --format json > /tmp/l5-eslint.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const files = JSON.parse(readFileSync('/tmp/l5-eslint.json','utf8'));
          const rules = {};
          for (const file of files) for (const message of file.messages) rules[message.ruleId ?? 'parse'] = (rules[message.ruleId ?? 'parse'] ?? 0) + 1;
          console.log('L5_LINT_SUMMARY:' + JSON.stringify(rules));
          for (const file of files.filter(file => file.messages.length)) console.log('L5_LINT_FILE:' + JSON.stringify({path:file.filePath, messages:file.messages.map(({ruleId,line,column,message})=>({ruleId,line,column,message}))}));
          NODE
