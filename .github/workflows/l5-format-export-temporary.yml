name: L5 format export (temporary)

on:
  push:
    branches:
      - chore/l5-source-quality

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format canonical L5 sources
        run: |
          pnpm exec prettier --write "product/components/composite-widgets/**/*.{ts,tsx,mts,cts,js,mjs,cjs,css,json,md,html}"
          pnpm exec prettier --check "product/components/composite-widgets/**/*.{ts,tsx,mts,cts,js,mjs,cjs,css,json,md,html}"
      - name: Export exact formatter output
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const files = execFileSync('git', ['diff','--name-only','-z','--','product/components/composite-widgets'], {encoding:'utf8'}).split('\0').filter(Boolean);
          for (const path of files) console.log('VF_FORMAT_JSON:' + JSON.stringify({path,content:readFileSync(path,'utf8')}));
          console.log('VF_FORMAT_COUNT:' + files.length);
          NODE
