name: Temporary API Baseline Reconcile

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/tooling-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm verify:api:update
      - name: Commit generated API reports only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add packages/*/etc/*.api.md
          if git diff --cached --quiet; then
            echo 'API reports already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(api): reconcile generated API report baselines'
          git push origin "HEAD:${HEAD_BRANCH}"
