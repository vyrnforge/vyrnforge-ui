name: MFD-1409 lockfile repair

on:
  push:
    branches:
      - mfd-1409-react-actions-typography-batch-v2
    paths:
      - .github/workflows/mfd-1409-lockfile-fix.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mfd-1409-react-actions-typography-batch-v2
          fetch-depth: 0

      - name: Restore pre-regeneration lockfile and add only the required edge
        shell: bash
        run: |
          git show 05354831acc3baec41b035e9304cccf23e44cdd3:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package-lock.json";
          let text = fs.readFileSync(path, "utf8");
          const needle = '        "@vyrnforge/ui-behaviors": "0.2.0-beta.2",\n        "@vyrnforge/ui-core": "0.2.0-beta.2"\n      },\n      "devDependencies": {\n        "@testing-library/jest-dom": "^6.9.1"';
          const replacement = '        "@vyrnforge/ui-behaviors": "0.2.0-beta.2",\n        "@vyrnforge/ui-core": "0.2.0-beta.2",\n        "@vyrnforge/ui-elements": "0.2.0-beta.2"\n      },\n      "devDependencies": {\n        "@testing-library/jest-dom": "^6.9.1"';
          if (!text.includes(needle)) {
            throw new Error("ui-components workspace dependency block not found");
          }
          text = text.replace(needle, replacement);
          fs.writeFileSync(path, text);
          NODE

      - name: Commit surgical lockfile repair and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mfd-1409-lockfile-fix.yml
          git add package-lock.json
          git commit -m "chore: repair MFD-1409 workspace lockfile"
          git push origin HEAD:mfd-1409-react-actions-typography-batch-v2
