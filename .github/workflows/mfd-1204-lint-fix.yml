name: MFD-1204 generator lint fix

on:
  push:
    branches:
      - mfd-1204-angular-full-catalog-bindings
    paths:
      - .github/workflows/mfd-1204-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mfd-1204-angular-full-catalog-bindings
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global npm@11.16.0
      - name: Install dependencies
        run: npm ci
      - name: Fix authored generator lint
        run: npx eslint scripts/angular-catalog-generation.mjs scripts/verify-angular-catalog-coverage.mjs --config eslint.config.mjs --fix
      - name: Regenerate and verify
        run: |
          npm run generate:framework-artifacts
          npm run verify:generated-framework-artifacts
          node scripts/verify-angular-catalog-coverage.mjs
          npm run typecheck --workspace @vyrnforge/ui-angular
          npx eslint scripts/angular-catalog-generation.mjs scripts/verify-angular-catalog-coverage.mjs --config eslint.config.mjs
      - name: Commit fix
        run: |
          git rm .github/workflows/mfd-1204-lint-fix.yml
          git config user.name "vyrnforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/angular-catalog-generation.mjs scripts/verify-angular-catalog-coverage.mjs packages/ui-angular/src/generated/catalog.generated.ts
          git commit -m "fix(angular): satisfy catalog generator lint"
          git push origin HEAD:mfd-1204-angular-full-catalog-bindings
