name: Finalize consumer baseline

on:
  push:
    branches:
      - feat/consumer-knowledge-playground
    paths:
      - .github/workflows/tmp-finalize-consumer-baseline.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/consumer-knowledge-playground
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - run: npm ci
      - name: Refresh only current formatting exceptions
        run: npm run format:baseline
      - name: Remove temporary workflow before inventory
        run: rm .github/workflows/tmp-finalize-consumer-baseline.yml
      - name: Refresh repository inventory from final tree
        run: npm run inventory:repository
      - name: Commit finalized bookkeeping
        run: |
          git config user.name "draglide"
          git config user.email "darkzzangelzz@gmail.com"
          git add .prettier-baseline.json docs/governance/repository-inventory.md .github/workflows/tmp-finalize-consumer-baseline.yml
          git commit -m "chore: finalize playground validation baseline"
          git push origin HEAD:feat/consumer-knowledge-playground
