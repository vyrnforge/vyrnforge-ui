name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted-validation:
    uses: ./.github/workflows/_targeted-validation.yml
    with:
      mode: pr
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.sha }}
      artifact_suffix: pr
      retention_days: 7
      upload_docs_artifact: false

  ci-gate:
    name: ci-gate
    if: always()
    needs: targeted-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require targeted validation
        env:
          TARGETED_VALIDATION: ${{ needs.targeted-validation.result }}
        run: |
          if [ "$TARGETED_VALIDATION" != "success" ]; then
            echo "Targeted validation did not succeed: $TARGETED_VALIDATION" >&2
            exit 1
          fi
          echo "All selected VyrnForge validation evidence passed."
