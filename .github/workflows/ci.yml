name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify workspace structure
        run: node tooling/verify/workspace-structure.mjs

      - name: Verify package boundaries
        run: node tooling/verify/package-boundaries.mjs

      - name: Verify legacy isolation
        run: node tooling/verify/legacy-isolation.mjs

      - name: Test impact planner
        run: node --test tooling/tests/impact-plan.test.mjs

      - name: Emit impact-derived validation plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/impact/plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
