name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute targeted validation plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/impact/execute.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" --output test-results/validation-plan.json
      - name: Upload inspectable validation plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-plan-pr
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser evidence when selected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-pr
          path: |
            test-results/playwright-report
            test-results/playwright-results
          if-no-files-found: ignore
          retention-days: 7
