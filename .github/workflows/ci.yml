name: VyrnForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "integration/**"
  workflow_dispatch:
    inputs:
      scope:
        description: CI scope
        required: true
        type: choice
        default: full
        options:
          - full
          - delivery

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan-change-impact
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      metadata: ${{ steps.plan.outputs.metadata }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
      affected_packages: ${{ steps.plan.outputs.affected_packages }}
      quality: ${{ steps.plan.outputs.quality }}
      integration: ${{ steps.plan.outputs.integration }}
      security: ${{ steps.plan.outputs.security }}
      packages: ${{ steps.plan.outputs.packages }}
      consumer: ${{ steps.plan.outputs.consumer }}
      browser: ${{ steps.plan.outputs.browser }}
      docs: ${{ steps.plan.outputs.docs }}
      playground: ${{ steps.plan.outputs.playground }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Detect repository change impact
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SCOPE: ${{ inputs.scope }}
        run: |
          args=("--github-output=$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_SCOPE" == "full" ]]; then
            args+=(--full)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_SCOPE" == "delivery" ]]; then
            args+=(--delivery)
          elif [[ "$EVENT_NAME" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            args+=(--full)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--delivery)
          elif [[ -n "$PR_BASE_SHA" ]]; then
            args+=("--base=$PR_BASE_SHA" "--head=${{ github.sha }}")
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            args+=("--base=$PUSH_BEFORE_SHA" "--head=${{ github.sha }}")
          else
            args+=(--full)
          fi
          node scripts/ci/plan-change-impact.mjs "${args[@]}"
      - name: Write readable change-impact plan
        run: |
          {
            echo "## Change impact"
            echo "- full: ${{ steps.plan.outputs.full }}"
            echo "- quality: ${{ steps.plan.outputs.quality }}"
            echo "- integration: ${{ steps.plan.outputs.integration }}"
            echo "- security: ${{ steps.plan.outputs.security }}"
            echo "- packages: ${{ steps.plan.outputs.packages }}"
            echo "- consumer: ${{ steps.plan.outputs.consumer }}"
            echo "- browser: ${{ steps.plan.outputs.browser }}"
            echo "- docs: ${{ steps.plan.outputs.docs }}"
            echo "- playground: ${{ steps.plan.outputs.playground }}"
            echo "- affected packages: ${{ steps.plan.outputs.affected_packages }}"
          } >> "$GITHUB_STEP_SUMMARY"

  quality-checks:
    name: quality
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI_SCOPE_FULL: ${{ needs.plan.outputs.full }}
      CI_SCOPE_METADATA: ${{ needs.plan.outputs.metadata }}
      CI_SCOPE_FIXTURES: ${{ needs.plan.outputs.fixtures }}
      CI_AFFECTED_PACKAGES: ${{ needs.plan.outputs.affected_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Run repository and affected-workspace quality checks
        run: node scripts/run-scoped-quality.mjs

  integration-checks:
    name: integration
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_BROWSER: ${{ needs.plan.outputs.browser }}
      RUN_PACKAGES: ${{ needs.plan.outputs.packages }}
      RUN_CONSUMER: ${{ needs.plan.outputs.consumer }}
      RUN_DOCS: ${{ needs.plan.outputs.docs }}
      RUN_PLAYGROUND: ${{ needs.plan.outputs.playground }}
      RUN_PAGES_VERIFY: ${{ needs.plan.outputs.docs == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      RUN_PAGES_ARTIFACT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies once
        run: npm ci
      - name: Prepare selected package outputs once
        shell: bash
        run: |
          if [[ "$RUN_PACKAGES" == "true" ]]; then
            npm run verify:beta-package-artifacts
            npm run build --workspace @vyrnforge/ui-data-grid
            VYRNFORGE_PACKAGES_PREPARED=true npm run verify:packages
            npm run verify:beta-package-size-budgets
            test -f test-results/beta-package-artifacts/size-report.json
          elif [[ "$RUN_CONSUMER" == "true" ]]; then
            npm run verify:packages
          elif [[ "$RUN_BROWSER" == "true" || "$RUN_PLAYGROUND" == "true" || "$RUN_PAGES_VERIFY" == "true" ]]; then
            npm run build:packages
          elif [[ "$RUN_DOCS" == "true" ]]; then
            npm run build --workspace @vyrnforge/ui-core
            npm run build --workspace @vyrnforge/ui-behaviors
            npm run build --workspace @vyrnforge/ui-components
          fi
      - name: Verify packed external consumer
        if: env.RUN_CONSUMER == 'true'
        env:
          VYRNFORGE_PACKAGES_PREPARED: "true"
        run: npm run verify:consumer
      - name: Install Chromium once
        if: env.RUN_BROWSER == 'true' || env.RUN_CONSUMER == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run affected browser contracts
        if: env.RUN_BROWSER == 'true'
        env:
          VYRNFORGE_PACKAGES_PREPARED: "true"
        run: npm run test:browser
      - name: Run packed four-surface generation smoke
        if: env.RUN_CONSUMER == 'true'
        run: |
          node scripts/verify-packed-four-surface-generation-smoke.mjs
          test -f test-results/cross-framework-matrix/accessibility-report.json
          test -f test-results/packed-four-surface-smoke/report.json
      - name: Verify generated repository inventory
        if: env.RUN_DOCS == 'true'
        run: npm run verify:repository-inventory
      - name: Build documentation application
        if: env.RUN_DOCS == 'true' && env.RUN_PAGES_VERIFY != 'true'
        run: npm run build --workspace @vyrnforge/ui-docs
      - name: Build playground
        if: env.RUN_PLAYGROUND == 'true' && env.RUN_PAGES_VERIFY != 'true'
        run: npm run build --workspace @vyrnforge/ui-data-grid-basic-playground
      - name: Build documentation application for Pages
        if: env.RUN_PAGES_VERIFY == 'true'
        run: npm run build --workspace @vyrnforge/ui-docs
        env:
          VITE_BASE_PATH: /vyrnforge-ui/
          VITE_DOCS_ROOT_PATH: /vyrnforge-ui/
          VITE_DOCS_VERSION_ID: next
      - name: Build playground for Pages
        if: env.RUN_PAGES_VERIFY == 'true'
        run: npm run build --workspace @vyrnforge/ui-data-grid-basic-playground
        env:
          VITE_BASE_PATH: /vyrnforge-ui/playground/
      - name: Assemble and verify versioned Pages site
        if: env.RUN_PAGES_VERIFY == 'true'
        run: |
          node scripts/assemble-versioned-pages.mjs
          test -f site/index.html
          test -f site/playground/index.html
          test -f site/docs-versions.json
          test -f site/.nojekyll
          node -e 'const manifest=require("./site/docs-versions.json"); if (!Array.isArray(manifest.releases) || manifest.releases.length < 1) process.exit(1)'
      - name: Upload commit-bound Pages site
        if: env.RUN_PAGES_ARTIFACT == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site-${{ github.sha }}
          path: site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload beta package artifact reports
        if: env.RUN_PACKAGES == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-package-artifacts-${{ github.sha }}
          path: test-results/beta-package-artifacts/
          if-no-files-found: error
      - name: Upload visual regression evidence
        if: always() && env.RUN_BROWSER == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.sha }}
          path: test-results/visual-regression/
          if-no-files-found: warn
      - name: Upload browser failure artifacts
        if: failure() && env.RUN_BROWSER == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
      - name: Upload cross-framework browser matrix
        if: always() && env.RUN_BROWSER == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-framework-browser-matrix-${{ github.sha }}
          path: test-results/cross-framework-matrix/
          if-no-files-found: warn

  security-checks:
    name: security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb5af2d0f4dfb4f3c93e5c08 # v4.8.0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Install verified actionlint
        run: bash scripts/ci/install-actionlint.sh
      - name: Validate workflows and shell snippets
        run: bash scripts/ci/validate-workflows.sh
      - name: Verify security and workflow contracts
        run: node scripts/ci/verify-security-workflow-hardening.mjs

  ci-gate:
    name: ci-gate
    needs:
      - plan
      - quality-checks
      - integration-checks
      - security-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gate reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Enforce selected responsibilities
        env:
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration-checks.result }}
          SECURITY_RESULT: ${{ needs.security-checks.result }}
          EXPECT_QUALITY: ${{ needs.plan.outputs.quality }}
          EXPECT_INTEGRATION: ${{ needs.plan.outputs.integration }}
          EXPECT_SECURITY: ${{ needs.plan.outputs.security }}
        run: node scripts/ci/report-ci-gate.mjs
