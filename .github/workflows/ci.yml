name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install bootstrap toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute impact-derived validation plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/impact/execute.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Capture generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
