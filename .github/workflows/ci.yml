name: VyrnForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      integration: ${{ steps.scope.outputs.integration }}
      security: ${{ steps.scope.outputs.security }}
      historical_evidence: ${{ steps.scope.outputs.historical_evidence }}
      metadata: ${{ steps.scope.outputs.metadata }}
      ui_core: ${{ steps.scope.outputs.ui_core }}
      ui_behaviors: ${{ steps.scope.outputs.ui_behaviors }}
      ui_components: ${{ steps.scope.outputs.ui_components }}
      ui_elements: ${{ steps.scope.outputs.ui_elements }}
      ui_data_grid: ${{ steps.scope.outputs.ui_data_grid }}
      packages: ${{ steps.scope.outputs.packages }}
      consumer: ${{ steps.scope.outputs.consumer }}
      docs: ${{ steps.scope.outputs.docs }}
      playground: ${{ steps.scope.outputs.playground }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      browser: ${{ steps.scope.outputs.browser }}
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      plan_json: ${{ steps.scope.outputs.plan_json }}

    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Detect affected CI scopes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            node scripts/detect-ci-scope.mjs \
              --full \
              --github-output "$GITHUB_OUTPUT"
          else
            node scripts/detect-ci-scope.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Write readable CI plan
        env:
          CI_SUMMARY_MODE: plan
          PLAN_JSON: ${{ steps.scope.outputs.plan_json }}
        run: node scripts/write-ci-summary.mjs

  quality-checks:
    name: quality-checks
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      full: ${{ needs.plan.outputs.full == 'true' }}
      metadata: ${{ needs.plan.outputs.metadata == 'true' }}
      historical-evidence: ${{ needs.plan.outputs.historical_evidence == 'true' }}
      ui-core: ${{ needs.plan.outputs.ui_core == 'true' }}
      ui-behaviors: ${{ needs.plan.outputs.ui_behaviors == 'true' }}
      ui-components: ${{ needs.plan.outputs.ui_components == 'true' }}
      ui-elements: ${{ needs.plan.outputs.ui_elements == 'true' }}
      ui-data-grid: ${{ needs.plan.outputs.ui_data_grid == 'true' }}
      fixtures: ${{ needs.plan.outputs.fixtures == 'true' }}

  integration-checks:
    name: integration-checks
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      browser: ${{ needs.plan.outputs.browser == 'true' }}
      packages: ${{ needs.plan.outputs.packages == 'true' }}
      consumer: ${{ needs.plan.outputs.consumer == 'true' }}
      docs: ${{ needs.plan.outputs.docs == 'true' }}
      playground: ${{ needs.plan.outputs.playground == 'true' }}

  security-checks:
    name: security-checks
    needs: plan
    if: needs.plan.outputs.security == 'true'
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      dependency-review: true
      drift: false

  ci-gate:
    name: ci-gate
    needs:
      - plan
      - quality-checks
      - integration-checks
      - security-checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout gate reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Report selected, skipped, and failed responsibilities
        env:
          CI_SUMMARY_MODE: gate
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration-checks.result }}
          SECURITY_RESULT: ${{ needs.security-checks.result }}
        run: node scripts/write-ci-summary.mjs
