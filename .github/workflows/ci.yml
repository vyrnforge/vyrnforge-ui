name: QA C2 final screenshot evidence at exact candidate
on: pull_request
permissions:
  contents: read
jobs:
  docs:
    name: QA C2 ${{ matrix.engine }} exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2cfd0fbb24e9e8be545c844076d12e93896f23ae
          fetch-depth: 0
      - name: Verify original source and unchanged product CSS
        run: |
          test "$(git rev-parse HEAD)" = "2cfd0fbb24e9e8be545c844076d12e93896f23ae"
          test -z "$(git status --porcelain)"
          git diff --exit-code c6d5cfd60830b4372348689eb1d017ae41ce8816 HEAD -- apps/docs/native.css packages product
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Execute original docs tests and repaired screenshot evidence
        run: pnpm exec playwright test --config apps/docs/playwright.config.mjs --project ${{ matrix.engine }}
      - name: Independently inspect retained original and diagnostic screenshots
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { devices } from '@playwright/test';
          const profile = {chromium:'Desktop Chrome',firefox:'Desktop Firefox',webkit:'Desktop Safari'}[process.env.QA_ENGINE];
          assert.ok(profile,'unexpected engine');
          const dpr = devices[profile].deviceScaleFactor ?? 1;
          const expectedWidth = 320 * dpr;
          const expectedHeight = 720 * dpr;
          const root = 'test-results/docs-playwright-results';
          const findImages = (dir) => readdirSync(dir,{withFileTypes:true}).flatMap((item) =>
            item.isDirectory() ? findImages(dir+'/'+item.name) : [dir+'/'+item.name]);
          const files = findImages(root).filter(x => x.endsWith('.png'));
          const required = [
            'native-responsive-200.png',
            'native-responsive-200-middle.png',
            'native-responsive-200-bottom.png',
            'native-responsive-200-diagnostic-toc-top.png',
            'native-responsive-200-diagnostic-toc-bottom.png',
            'native-responsive-200-diagnostic-article-top.png',
            'native-responsive-200-diagnostic-article-middle.png',
            'native-responsive-200-diagnostic-article-bottom.png',
          ];
          const hashes = new Map();
          for (const name of required) {
            const matches = files.filter(x=>x.endsWith('/'+name));
            assert.equal(matches.length,1,'missing/ambiguous screenshot: '+name);
            const bytes=readFileSync(matches[0]);
            assert.equal(bytes.subarray(1,4).toString(),'PNG');
            assert.equal(bytes.readUInt32BE(16),expectedWidth,'width: '+name);
            assert.equal(bytes.readUInt32BE(20),expectedHeight,'height: '+name);
            hashes.set(name,createHash('sha256').update(bytes).digest('hex'));
            console.log('QA C2 screenshot',name,'320x720 CSS pixels, DPR',dpr,'physical',expectedWidth+'x'+expectedHeight,hashes.get(name));
          }
          const article=['top','middle','bottom'].map(x=>hashes.get('native-responsive-200-diagnostic-article-'+x+'.png'));
          const toc=['top','bottom'].map(x=>hashes.get('native-responsive-200-diagnostic-toc-'+x+'.png'));
          assert.equal(new Set(article).size,3,'article captures repeat');
          assert.equal(new Set(toc).size,2,'TOC captures repeat');
          assert.notEqual(hashes.get('native-responsive-200.png'),hashes.get('native-responsive-200-diagnostic-article-top.png'),'original/diagnostic captures conflated');
          console.log('QA C2 all 8 screenshot files present, unique diagnostic content and valid sizes');
          JS
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-c2-final-${{ matrix.engine }}
          path: |
            test-results/docs-playwright-results
            test-results/docs-playwright-report
          retention-days: 14
          if-no-files-found: warn
