name: PR Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  affected:
    name: affected
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record VyrnForge semantic impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p test-results
          node tooling/impact/plan.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" > test-results/semantic-impact.json
      - name: Run Nx affected validation
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.sha }}
        run: pnpm exec nx affected -t lint,typecheck,test,build --base="$NX_BASE" --head="$NX_HEAD"
      - name: Verify repository contracts
        run: pnpm verify:structure && pnpm verify:boundaries && pnpm verify:architecture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-impact-pr
          path: test-results/semantic-impact.json
          if-no-files-found: error
          retention-days: 7

  package-artifacts:
    name: package-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify:packages

  browser-chromium:
    name: browser-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-pr
          path: |
            test-results/playwright-report
            test-results/playwright-results
          if-no-files-found: ignore
          retention-days: 7
