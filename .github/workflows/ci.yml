name: PR Validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # bootstrap-lock-commit: one controlled run to commit the generated lockfile, then this workflow returns to read-only npm ci.
      - name: Install toolchain and refresh lockfile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute targeted validation plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node tooling/impact/execute.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" --output test-results/validation-plan.json
      - name: Upload inspectable validation plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-plan-pr
          path: test-results/validation-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser evidence when selected
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-pr
          path: |
            test-results/playwright-report
            test-results/playwright-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit generated lockfile
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/package-lock.json package-lock.json
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(tooling): lock TypeScript 6 validation toolchain"
          git push origin "HEAD:$HEAD_REF"
