name: UX 1372 bounded keyboard evidence only
on: pull_request
permissions:
  contents: read
jobs:
  review:
    name: UX bounded ${{ matrix.engine }} — evidence only
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 610b8cbceb2d071281ebd75c9544a1adc1994634
      - name: Assert pinned unmodified source
        run: |
          test "$(git rev-parse HEAD)" = "610b8cbceb2d071281ebd75c9544a1adc1994634"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Bounded keyboard, TOC, Menu and focus recovery evidence
        env:
          UX_ENGINE: ${{ matrix.engine }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium,firefox,webkit} from '@playwright/test';
          import {spawn} from 'node:child_process';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const engine=process.env.UX_ENGINE, browsers={chromium,firefox,webkit};
          const root='test-results/ux1372-keyboard-bounded-'+engine;
          mkdirSync(root,{recursive:true});
          const server=spawn(process.execPath,['apps/docs/serve.mjs'],{stdio:'inherit'});
          const pageUrl='http://127.0.0.1:4173/next/native-web/components/button/';
          const vars=[
          {id:'baseline',css:''},
          {id:'nonsticky30',css:'@media (max-width:30rem){.vf-docs-header{position:static!important}}'},
          {id:'nonsticky48',css:'@media (max-width:48rem){.vf-docs-header{position:static!important}}'}];
          const records=[];let browser;
          const view=async p=>p.evaluate(()=>{
          const box=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {top:+r.top.toFixed(1),bottom:+r.bottom.toFixed(1),height:+r.height.toFixed(1)}};
          const h=document.querySelector('.vf-docs-header'), anchor=decodeURIComponent(location.hash.slice(1)),target=document.getElementById(anchor),menu=document.querySelector('[data-vf-docs-nav-toggle]'),nav=document.querySelector('#vf-docs-navigation');
          const H=box(h),T=box(target);
          return {header:H,headerPosition:getComputedStyle(h).position,target:T,hash:location.hash,scrollY:Math.round(scrollY),clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,active:document.activeElement?.outerHTML?.slice(0,120),menuExpanded:menu?.getAttribute('aria-expanded'),menuVisible:!!menu?.getClientRects().length,navVisible:!!nav?.getClientRects().length,headerOccludesTarget:!!(H&&T&&H.bottom>T.top&&H.top<T.bottom&&H.bottom>0)};
          });
          try {
           let ready=false;for(let i=0;i<75;i++){try{const x=await fetch(pageUrl);if(x.ok){ready=true;break}}catch{}await new Promise(r=>setTimeout(r,100));}
           assert.ok(ready,'docs server not responding');
           browser=await browsers[engine].launch();
           for(const variant of vars){
           const page=await browser.newPage({viewport:{width:320,height:720},deviceScaleFactor:1});
           page.setDefaultTimeout(3500);page.setDefaultNavigationTimeout(7500);
           const row={engine,variant:variant.id,revision:'610b8cbceb2d071281ebd75c9544a1adc1994634',environment:'Ubuntu Playwright',viewport:'320x720 CSS',textSize:'200%',notes:[]};
           try {
           await page.goto(pageUrl,{waitUntil:'domcontentloaded',timeout:7500});
           await page.evaluate(()=>document.documentElement.style.fontSize='200%');
           if(variant.css)await page.addStyleTag({content:variant.css});
           row.initial=await view(page);
           await page.keyboard.press('Tab');
           row.skipFirst=await page.evaluate(()=>document.activeElement?.matches('a.vf-docs-skip')??false);
           if(row.skipFirst){await page.keyboard.press('Enter');row.afterSkip=await view(page);}
           await page.goto(pageUrl,{waitUntil:'domcontentloaded',timeout:7500});
           await page.evaluate(()=>document.documentElement.style.fontSize='200%');
           if(variant.css)await page.addStyleTag({content:variant.css});
           let tocTabCount=null;
           for(let k=1;k<=16;k++){await page.keyboard.press('Tab');if(await page.evaluate(()=>!!document.activeElement?.matches('.vf-docs-toc a[href]'))){tocTabCount=k;break;}}
           row.tocTabCount=tocTabCount;
           if(tocTabCount!==null){await page.keyboard.press('Enter');row.afterTocEnter=await view(page);await page.screenshot({path:root+'/'+variant.id+'-toc.png',fullPage:false});await page.keyboard.press('Control+Home');await page.waitForFunction(()=>window.scrollY<=2,null,{timeout:1500}).catch(()=>{});row.afterCtrlHome=await view(page);if(row.afterCtrlHome.scrollY>2){await page.keyboard.press('Home');await page.waitForTimeout(200);row.afterHomeFallback=await view(page);}}
           else row.notes.push('TOC not reached in first 16 Tabs; independently retest');
           const toggle=page.getByRole('button',{name:'Menu'});
           await toggle.focus();await page.keyboard.press('Enter');row.menuOpen=await view(page);
           await page.keyboard.press('Enter');row.menuClose=await view(page);
           await toggle.focus();await page.keyboard.press('Enter');
           const current=page.locator('#vf-docs-navigation a[aria-current="page"]').first();
           await current.focus();
           await page.setViewportSize({width:1920,height:1000});
           await page.waitForFunction(()=>{const m=document.querySelector('[data-vf-docs-nav-toggle]'),n=document.getElementById('vf-docs-navigation');return !!m?.hidden&&!!n&&!n.hidden;},null,{timeout:3000}).catch(()=>{});row.wide=await view(page);
           await page.setViewportSize({width:320,height:720});
           await page.waitForFunction(()=>{const m=document.querySelector('[data-vf-docs-nav-toggle]'),n=document.getElementById('vf-docs-navigation');return !!m&&!m.hidden&&m.getAttribute('aria-expanded')==='false'&&!!n?.hidden&&document.activeElement===m;},null,{timeout:3000}).catch(()=>{});row.narrowReturn=await view(page);
           row.focusReturnedToMenu=await page.evaluate(()=>document.activeElement?.matches('[data-vf-docs-nav-toggle]')??false);
           await page.screenshot({path:root+'/'+variant.id+'-return.png',fullPage:false});
           row.overflow=row.narrowReturn.scrollWidth>row.narrowReturn.clientWidth+1;
           }catch(err){row.error=String(err?.message||err).slice(0,2000);}
           console.log('UX1372_BOUNDED '+JSON.stringify(row));records.push(row);await page.close();
           }
           writeFileSync(root+'/observations.json',JSON.stringify({source:'610b8cbceb2d071281ebd75c9544a1adc1994634',engine,method:'actual CSS root text resize; NOT native browser zoom or human AT',records},null,2));
           assert.equal(records.length,3);
          }finally{if(browser)await browser.close();server.kill('SIGTERM')}
          
          JS
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ux1372-bounded-${{ matrix.engine }}
          path: test-results/ux1372-keyboard-bounded-${{ matrix.engine }}
          retention-days: 14
          if-no-files-found: warn
