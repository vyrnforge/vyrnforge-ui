name: QA C1 exact-revision documentation engines

on:
  pull_request:

permissions:
  contents: read

jobs:
  c1-docs-engine:
    name: C1 docs ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d0451a2a9f624c51418c9e6a24ab06552c2bcafb
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "d0451a2a9f624c51418c9e6a24ab06552c2bcafb"
          git log -1 --format='%H %s'
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:docs
      - run: node apps/docs/run-browser.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: c1-${{ matrix.engine }}-d0451a2a9f624c51418c9e6a24ab06552c2bcafb
          path: |
            test-results/docs-playwright-results
            test-results/docs-playwright-report
          if-no-files-found: warn
          retention-days: 7
