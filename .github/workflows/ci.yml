name: VyrnForge CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyrnforge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: plan-change-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      integration: ${{ steps.scope.outputs.integration }}
      security: ${{ steps.scope.outputs.security }}
      metadata: ${{ steps.scope.outputs.metadata }}
      packages: ${{ steps.scope.outputs.packages }}
      consumer: ${{ steps.scope.outputs.consumer }}
      docs: ${{ steps.scope.outputs.docs }}
      playground: ${{ steps.scope.outputs.playground }}
      fixtures: ${{ steps.scope.outputs.fixtures }}
      browser: ${{ steps.scope.outputs.browser }}
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      affected_packages: ${{ steps.scope.outputs.affected_packages }}
      plan_json: ${{ steps.scope.outputs.plan_json }}
    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Detect repository change impact
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            node scripts/detect-ci-scope.mjs --full --github-output "$GITHUB_OUTPUT"
          else
            node scripts/detect-ci-scope.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Write readable change-impact plan
        env:
          CI_SUMMARY_MODE: plan
          PLAN_JSON: ${{ steps.scope.outputs.plan_json }}
        run: node scripts/write-ci-summary.mjs

  quality:
    name: quality
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    uses: ./.github/workflows/_quality.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      full: ${{ needs.plan.outputs.full == 'true' }}
      metadata: ${{ needs.plan.outputs.metadata == 'true' }}
      fixtures: ${{ needs.plan.outputs.fixtures == 'true' }}
      affected-packages: ${{ needs.plan.outputs.affected_packages }}

  integration:
    name: integration
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    with:
      node-version: "24.18.0"
      browser: ${{ needs.plan.outputs.browser == 'true' }}
      packages: ${{ needs.plan.outputs.packages == 'true' }}
      consumer: ${{ needs.plan.outputs.consumer == 'true' }}
      docs: ${{ needs.plan.outputs.docs == 'true' }}
      playground: ${{ needs.plan.outputs.playground == 'true' }}
      pages-artifact: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  security:
    name: security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    uses: ./.github/workflows/_security.yml
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    with:
      dependency-review: ${{ github.event_name == 'pull_request' }}
      drift: false

  ci-gate:
    name: ci-gate
    needs: [plan, quality, integration, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout gate reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enforce selected responsibilities
        env:
          CI_SUMMARY_MODE: gate
          PLAN_JSON: ${{ needs.plan.outputs.plan_json }}
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: node scripts/write-ci-summary.mjs
