name: PR Validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-baseline:
    name: visual-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_COMPONENT_PORT: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Generate canonical Tabs visual baselines
        run: pnpm exec playwright test product/tabs/test/browser/tests/tabs.spec.mjs --project=chromium --update-snapshots
      - name: Commit generated product-owned baselines
        run: |
          if git diff --quiet -- product/tabs/test/browser/tests/__screenshots__; then
            echo "Visual baselines already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/tabs/test/browser/tests/__screenshots__
          git commit -m "test(visual): baseline canonical Tabs states"
          git push origin "HEAD:${{ github.head_ref }}"

  affected:
    name: affected
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record VyrnForge semantic impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p test-results
          node tooling/impact/plan.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" > test-results/semantic-impact.json
      - name: Run Nx affected validation
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.sha }}
        run: pnpm exec nx affected -t lint,typecheck,test,build --base="$NX_BASE" --head="$NX_HEAD"
      - name: Verify repository contracts
        run: pnpm verify:structure && pnpm verify:testing-structure && pnpm verify:boundaries && pnpm verify:architecture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-impact-pr
          path: test-results/semantic-impact.json
          if-no-files-found: error
          retention-days: 7

  package-artifacts:
    name: package-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify packed packages
        run: |
          mkdir -p test-results
          set -o pipefail
          pnpm verify:packages 2>&1 | tee test-results/package-validation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-validation-pr
          path: test-results/package-validation.log
          if-no-files-found: error
          retention-days: 7

  browser-chromium:
    name: browser-chromium-${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [web, react, angular, vue, elements]
    env:
      VF_COMPONENT_PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence-${{ matrix.port }}-pr
          path: |
            test-results/playwright-report/${{ matrix.port }}
            test-results/playwright-results/${{ matrix.port }}
          if-no-files-found: ignore
          retention-days: 7
