name: MFD-1514 Regenerate Consumer Knowledge

on:
  push:
    branches:
      - mfd-1514-target-architecture-docs

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mfd-1514-target-architecture-docs
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Regenerate committed consumer knowledge
        run: npm run generate:consumer-knowledge
      - name: Verify regeneration scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(docs/generated/consumer-knowledge\.json|docs/generated/ai-context/index\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated drift:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet -- docs/generated/consumer-knowledge.json docs/generated/ai-context/index.json; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/consumer-knowledge.json docs/generated/ai-context/index.json
          git commit -m "docs: regenerate consumer knowledge"
          git push origin HEAD:mfd-1514-target-architecture-docs
