name: tmp-mfd1306-generate
on:
  push:
    branches:
      - feat/MFD-1306-vue-model-coverage
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1306-vue-model-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run generate:framework-artifacts
      - run: npx prettier --write scripts/vue-catalog-generation.mjs scripts/verify-vue-model-matrix.mjs packages/ui-vue/src/model.test.ts packages/ui-vue/src/generated/catalog.generated.ts packages/ui-vue/package.json
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm test --workspace @vyrnforge/ui-vue
      - name: Commit generated output
        run: |
          rm .github/workflows/_tmp-mfd1306-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(vue): regenerate model matrix artifacts"
            git push origin HEAD:feat/MFD-1306-vue-model-coverage
          fi
