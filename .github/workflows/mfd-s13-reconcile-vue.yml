name: MFD-S13 Reconcile Vue On Main

on:
  push:
    branches:
      - reconcile/S13-vue-on-current-main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[s13-reconciled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: reconcile/S13-vue-on-current-main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Bring over Vue-owned files only
        run: |
          git fetch origin integration/vue
          BASE=$(git merge-base origin/main origin/integration/vue)
          git diff --name-only "$BASE" origin/integration/vue > /tmp/vue-changed.txt
          grep -E '^(packages/ui-vue/|tests/consumers/vue/|docs/packages/ui-vue\.md$|docs/metadata/vue-|docs/testing/vue-|scripts/[^/]*vue[^/]*)' /tmp/vue-changed.txt > /tmp/vue-owned.txt || true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git cat-file -e "origin/integration/vue:$path" 2>/dev/null; then
              git checkout origin/integration/vue -- "$path"
            else
              rm -f "$path"
            fi
          done < /tmp/vue-owned.txt
          echo 'Vue-owned paths replayed:'
          cat /tmp/vue-owned.txt
      - name: Merge Vue into current-main canonical metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const lane = (p) => JSON.parse(cp.execFileSync('git', ['show', `origin/integration/vue:${p}`], {encoding:'utf8'}));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v,null,2)+'\n');
          const unique = (a) => [...new Set(a)];

          {
            const p='docs/metadata/release-groups.json'; const cur=read(p); const src=lane(p);
            const line=cur.releaseLines['non-grid-beta'];
            const vue=src.releaseLines['non-grid-beta'].packages.find(x=>x.name==='@vyrnforge/ui-vue');
            line.packages = line.packages.filter(x=>x.name!=='@vyrnforge/ui-vue');
            line.packages.push(vue);
            write(p,cur);
          }
          {
            const p='docs/metadata/packages.json'; const cur=read(p); const src=lane(p);
            const vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
            cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue');
            const grid=cur.packages.findIndex(x=>x.name==='@vyrnforge/ui-data-grid');
            cur.packages.splice(grid<0?cur.packages.length:grid,0,vue);
            for (const pkg of cur.packages) {
              const lanePkg=src.packages.find(x=>x.name===pkg.name);
              if (lanePkg?.mustNotDependOn?.includes('@vyrnforge/ui-vue')) pkg.mustNotDependOn=unique([...(pkg.mustNotDependOn||[]),'@vyrnforge/ui-vue']);
            }
            cur.dependencyRules=unique([...cur.dependencyRules,...src.dependencyRules.filter(x=>x.includes('ui-vue'))]);
            cur.releaseGroups.nonGridBeta=unique([...cur.releaseGroups.nonGridBeta,'@vyrnforge/ui-vue']);
            write(p,cur);
          }
          {
            const p='docs/metadata/multi-framework.json'; const cur=read(p); const src=lane(p);
            const vuePkg=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
            cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue');
            const grid=cur.packages.findIndex(x=>x.name==='@vyrnforge/ui-data-grid');
            cur.packages.splice(grid<0?cur.packages.length:grid,0,vuePkg);
            cur.frameworks=cur.frameworks.map(x=>x.id==='vue'?src.frameworks.find(y=>y.id==='vue'):x);
            cur.vueModelAdapter=src.vueModelAdapter;
            cur.consumerFixturePolicy.rule=src.consumerFixturePolicy.rule;
            write(p,cur);
          }
          {
            const p='docs/metadata/trusted-publishing-provenance.json'; const cur=read(p); const src=lane(p);
            const vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
            cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue'); cur.packages.push(vue); write(p,cur);
          }
          {
            const p='docs/metadata/beta-package-size-budgets.json'; const cur=read(p); const src=lane(p);
            const vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
            cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue'); cur.packages.push(vue); write(p,cur);
          }
          {
            const p='docs/metadata/compatibility-release-matrix.json'; const cur=read(p); const src=lane(p);
            if (src.frameworkPolicies?.vue) cur.frameworkPolicies.vue=src.frameworkPolicies.vue;
            if (src.frameworks?.vue) cur.frameworks.vue=src.frameworks.vue;
            if (Array.isArray(cur.cases) && Array.isArray(src.cases)) {
              cur.cases=cur.cases.filter(x=>!(x.id||'').startsWith('vue35-'));
              cur.cases.push(...src.cases.filter(x=>(x.id||'').startsWith('vue35-')));
            }
            write(p,cur);
          }
          {
            const p='tests/beta-package-consumer/package.json'; const cur=read(p); const src=lane(p);
            if (src.dependencies?.vue) cur.dependencies.vue=src.dependencies.vue; write(p,cur);
          }
          {
            const p='tests/beta-package-consumer/src/entrypoints.ts'; let text=fs.readFileSync(p,'utf8');
            if (!text.includes('@vyrnforge/ui-vue')) {
              const importAnchor='import type * as Elements from "@vyrnforge/ui-elements";\n';
              if (!text.includes(importAnchor)) throw new Error('entrypoints import anchor missing');
              text=text.replace(importAnchor, importAnchor+'import type * as VueFacade from "@vyrnforge/ui-vue";\n');
              const typeAnchor='  elements: typeof Elements;\n';
              if (!text.includes(typeAnchor)) throw new Error('entrypoint type anchor missing');
              text=text.replace(typeAnchor, typeAnchor+'  vue: typeof VueFacade;\n');
              fs.writeFileSync(p,text);
            }
          }
          NODE
      - name: Synchronize lockfile and generated release contracts
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run generate:beta-package-contract
          npm run generate:beta-scope
          node scripts/generate-component-reference.mjs
          npx prettier --write docs/metadata/release-groups.json docs/metadata/packages.json docs/metadata/multi-framework.json docs/metadata/trusted-publishing-provenance.json docs/metadata/beta-package-size-budgets.json docs/metadata/compatibility-release-matrix.json docs/metadata/beta-package-artifacts.json docs/metadata/non-grid-beta-scope.json tests/beta-package-consumer/package.json tests/beta-package-consumer/src/entrypoints.ts docs/generated
      - name: Run focused combined-state contracts
        run: |
          npm run verify:package-boundaries
          npm run test:package-boundaries
          npm run test:release-groups
          npm run test:beta-package-contract
          npm run test:beta-package-size-budgets
          npm run test:compatibility-release-matrix
          npm run test:trusted-publishing-provenance
          npm run test:multi-framework
          npm run test:consumer-foundations
          npm run test:component-reference
      - name: Commit combined Angular plus Vue state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(S13): reconcile Vue with current main [s13-reconciled]' || exit 0
          git push
