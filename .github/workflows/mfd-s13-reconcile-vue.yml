name: MFD-S13 Reconcile Vue On Main

on:
  push:
    branches:
      - reconcile/S13-vue-on-current-main

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[s13-reconciled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: reconcile/S13-vue-on-current-main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Bring over Vue-owned files only
        run: |
          git fetch origin integration/vue
          BASE=$(git merge-base origin/main origin/integration/vue)
          git diff --name-only "$BASE" origin/integration/vue > /tmp/vue-changed.txt
          grep -E '^(packages/ui-vue/|tests/consumers/vue/|docs/packages/ui-vue\.md$|docs/metadata/vue-|docs/testing/vue-|scripts/[^/]*vue[^/]*)' /tmp/vue-changed.txt > /tmp/vue-owned.txt || true
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git cat-file -e "origin/integration/vue:$path" 2>/dev/null; then git checkout origin/integration/vue -- "$path"; else rm -f "$path"; fi
          done < /tmp/vue-owned.txt
      - name: Merge Vue into current-main canonical state
        run: |
          node <<'NODE'
          const fs=require('fs'), cp=require('child_process');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const laneJson=p=>JSON.parse(cp.execFileSync('git',['show',`origin/integration/vue:${p}`],{encoding:'utf8'}));
          const laneText=p=>cp.execFileSync('git',['show',`origin/integration/vue:${p}`],{encoding:'utf8'});
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const unique=a=>[...new Set(a)];
          const replace=(p,from,to)=>{let s=fs.readFileSync(p,'utf8'); if(!s.includes(from)) throw new Error(`${p}: missing marker ${from}`); fs.writeFileSync(p,s.replace(from,to));};
          let p,cur,src,vue,grid,text;

          p='docs/metadata/release-groups.json'; cur=read(p); src=laneJson(p);
          vue=src.releaseLines['non-grid-beta'].packages.find(x=>x.name==='@vyrnforge/ui-vue');
          cur.releaseLines['non-grid-beta'].packages=cur.releaseLines['non-grid-beta'].packages.filter(x=>x.name!=='@vyrnforge/ui-vue');
          cur.releaseLines['non-grid-beta'].packages.push(vue); write(p,cur);

          p='docs/metadata/packages.json'; cur=read(p); src=laneJson(p); vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
          cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue'); grid=cur.packages.findIndex(x=>x.name==='@vyrnforge/ui-data-grid'); cur.packages.splice(grid<0?cur.packages.length:grid,0,vue);
          for(const pkg of cur.packages){const lp=src.packages.find(x=>x.name===pkg.name); if(lp?.mustNotDependOn?.includes('@vyrnforge/ui-vue')) pkg.mustNotDependOn=unique([...(pkg.mustNotDependOn||[]),'@vyrnforge/ui-vue']);}
          cur.dependencyRules=unique([...cur.dependencyRules,...src.dependencyRules.filter(x=>x.includes('ui-vue'))]);
          cur.releaseGroups.nonGridBeta=unique([...cur.releaseGroups.nonGridBeta,'@vyrnforge/ui-vue']); write(p,cur);

          p='docs/metadata/multi-framework.json'; cur=read(p); src=laneJson(p); vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue');
          cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue'); grid=cur.packages.findIndex(x=>x.name==='@vyrnforge/ui-data-grid'); cur.packages.splice(grid<0?cur.packages.length:grid,0,vue);
          cur.frameworks=cur.frameworks.map(x=>x.id==='vue'?src.frameworks.find(y=>y.id==='vue'):x); cur.vueModelAdapter=src.vueModelAdapter; cur.consumerFixturePolicy.rule=src.consumerFixturePolicy.rule; write(p,cur);

          for(p of ['docs/metadata/trusted-publishing-provenance.json','docs/metadata/beta-package-size-budgets.json']){
            cur=read(p); src=laneJson(p); vue=src.packages.find(x=>x.name==='@vyrnforge/ui-vue'); cur.packages=cur.packages.filter(x=>x.name!=='@vyrnforge/ui-vue'); cur.packages.push(vue); write(p,cur);
          }

          p='docs/metadata/compatibility-release-matrix.json'; cur=read(p); src=laneJson(p);
          if(src.frameworkPolicies?.vue) cur.frameworkPolicies.vue=src.frameworkPolicies.vue; if(src.frameworks?.vue) cur.frameworks.vue=src.frameworks.vue;
          if(Array.isArray(cur.cases)&&Array.isArray(src.cases)){cur.cases=cur.cases.filter(x=>!(x.id||'').startsWith('vue35-')); cur.cases.push(...src.cases.filter(x=>(x.id||'').startsWith('vue35-')));} write(p,cur);

          p='tests/consumers/manifest.json'; cur=read(p); src=laneJson(p);
          cur.fixtures=cur.fixtures.map(x=>x.id==='vue'?src.fixtures.find(y=>y.id==='vue'):x); write(p,cur);

          p='tests/beta-package-consumer/package.json'; cur=read(p); src=laneJson(p); if(src.dependencies?.vue) cur.dependencies.vue=src.dependencies.vue; write(p,cur);
          p='tests/beta-package-consumer/src/entrypoints.ts'; text=fs.readFileSync(p,'utf8');
          if(!text.includes('@vyrnforge/ui-vue')){text=text.replace('import type * as Elements from "@vyrnforge/ui-elements";\n','import type * as Elements from "@vyrnforge/ui-elements";\nimport type * as VueFacade from "@vyrnforge/ui-vue";\n'); text=text.replace('  elements: typeof Elements;\n','  elements: typeof Elements;\n  vue: typeof VueFacade;\n'); fs.writeFileSync(p,text);}

          p='docs/release/beta-package-artifact-verification.md'; text=fs.readFileSync(p,'utf8');
          if(!text.includes('### `@vyrnforge/ui-vue`')) text=text.replace('For conditional exports,', '### `@vyrnforge/ui-vue`\n\n- `@vyrnforge/ui-vue`\n\nFor conditional exports,');
          text=text.replace('including Angular root and Forms entrypoints;', 'including Angular root and Forms entrypoints and the Vue facade entrypoint;');
          if(!text.includes('Vue framework dependencies are fixture-owned')) text=text.replace('## Reports', 'Vue framework dependencies are fixture-owned third-party dependencies and are installed before the offline VyrnForge tarball step; the gate still requires the actual `@vyrnforge/ui-vue` tarball and forbids workspace links.\n\n## Reports');
          fs.writeFileSync(p,text);

          p='scripts/verify-consumer-foundations.mjs';
          replace(p,'["vue", new Set(["packed-consumer-verified"])],','["vue", new Set(["first-class-package-verified"])],');

          p='scripts/verify-multi-framework-architecture.mjs';
          replace(p,'  [\n    "@vyrnforge/ui-data-grid",\n    {\n      status: "react-alpha-deferred",','  [\n    "@vyrnforge/ui-vue",\n    {\n      status: "current",\n      betaIncluded: true,\n      dependsOn: ["@vyrnforge/ui-elements"],\n    },\n  ],\n  [\n    "@vyrnforge/ui-data-grid",\n    {\n      status: "react-alpha-deferred",');
          replace(p,'  ["vue", "verified-consumer"],','  ["vue", "first-class"],');
          replace(p,'  ["vue", "packed-consumer-verified"],','  ["vue", "first-class-package-verified"],');
          replace(p,'        "@vyrnforge/ui-angular",\n      ]),','        "@vyrnforge/ui-angular",\n        "@vyrnforge/ui-vue",\n      ]),');

          p='scripts/generate-component-reference.mjs';
          replace(p,'  return "Vue is currently a verified consumer of the canonical Custom Element contract. A first-class Vue package must not be claimed until its distribution gate passes.";','  return "Vue uses the first-class @vyrnforge/ui-vue facade over the canonical Custom Element renderer; rendering, behavior, accessibility, and vf-* event contracts remain shared with @vyrnforge/ui-elements.";');
          replace(p,'  const reactSetup = cleanText(component.importExample) ?? "";\n  const reactExample = cleanText(component.basicUsageExample) ?? "";','  const reactSetup = cleanText(component.importExample) ?? "";\n  const reactExample = cleanText(component.basicUsageExample) ?? "";\n  const vueComponentName = component.displayName\n    ? `Vf${component.displayName.replace(/[^A-Za-z0-9]+/g, " ").trim().split(/\\s+/).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join("")}`\n    : null;');
          replace(p,'    vue: {\n      label: "Vue",\n      status: vueStatus,\n      package:\n        parity.vue?.consumes ?? (nativeTag ? "@vyrnforge/ui-elements" : null),\n      setup: nativeTag\n        ? "compilerOptions: { isCustomElement: (tag) => tag.startsWith(\'vf-\') }"\n        : "",\n      example: nativeTag ? `<${nativeTag}></${nativeTag}>` : "",\n      note: frameworkNote("vue", vueStatus),\n    },','    vue: {\n      label: "Vue",\n      status: vueStatus,\n      package: vueStatus === "not-supported" ? null : "@vyrnforge/ui-vue",\n      setup:\n        vueStatus === "not-supported"\n          ? ""\n          : \'import { VyrnForgeVue } from "@vyrnforge/ui-vue";\\napp.use(VyrnForgeVue);\',\n      example:\n        vueStatus === "not-supported" || !vueComponentName\n          ? ""\n          : `<${vueComponentName}></${vueComponentName}>`,\n      note: frameworkNote("vue", vueStatus),\n    },');
          NODE
      - name: Synchronize lockfile and generated contracts
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run generate:beta-package-contract
          npm run generate:beta-scope
          node scripts/generate-component-reference.mjs
          npx prettier --write docs/metadata/release-groups.json docs/metadata/packages.json docs/metadata/multi-framework.json docs/metadata/trusted-publishing-provenance.json docs/metadata/beta-package-size-budgets.json docs/metadata/compatibility-release-matrix.json docs/metadata/beta-package-artifacts.json docs/metadata/non-grid-beta-scope.json docs/release/beta-package-artifact-verification.md tests/consumers/manifest.json tests/beta-package-consumer/package.json tests/beta-package-consumer/src/entrypoints.ts scripts/verify-consumer-foundations.mjs scripts/verify-multi-framework-architecture.mjs scripts/generate-component-reference.mjs docs/generated
      - name: Run focused combined-state contracts
        run: |
          npm run verify:package-boundaries
          npm run test:package-boundaries
          npm run test:release-groups
          npm run test:beta-package-contract
          npm run test:beta-package-size-budgets
          npm run test:compatibility-release-matrix
          npm run test:trusted-publishing-provenance
          npm run test:multi-framework
          npm run test:consumer-foundations
          npm run test:component-reference
      - name: Commit combined Angular plus Vue state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/mfd-s13-reconcile-vue.yml
          git add -A
          git commit -m 'fix(S13): reconcile Vue with current main [s13-reconciled]'
          git push
