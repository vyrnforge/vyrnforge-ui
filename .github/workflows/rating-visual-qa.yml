name: Rating focused documentation visual QA
on:
  pull_request:
    branches: [feat/rating-redesign-1590]
    paths: ['.github/workflows/rating-visual-qa.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:docs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config apps/docs/playwright.config.mjs --project chromium --grep 'Rating playground'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rating-visual-qa
          path: test-results/docs-playwright-results
          if-no-files-found: error
          retention-days: 7
