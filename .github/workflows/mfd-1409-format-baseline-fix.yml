name: MFD-1409 formatting baseline repair

on:
  push:
    branches:
      - mfd-1409-react-actions-typography-batch-v2
    paths:
      - .github/workflows/mfd-1409-format-baseline-fix.yml

permissions:
  contents: write

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mfd-1409-react-actions-typography-batch-v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Refresh formatting baseline
        run: |
          node scripts/verify-format.mjs --write-baseline
          node scripts/verify-format.mjs

      - name: Commit refreshed baseline and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mfd-1409-format-baseline-fix.yml
          git add .prettier-baseline.json
          git commit -m "chore: refresh MFD-1409 formatting baseline"
          git push origin HEAD:mfd-1409-react-actions-typography-batch-v2
