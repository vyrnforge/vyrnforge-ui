name: L5 Tooltip format (temporary)
on:
  push:
    branches: [fix/l5-tooltip-elements-native]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/l5-tooltip-elements-native
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format Tooltip with repository configuration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm exec prettier --write "product/components/composite-widgets/transient-surfaces/tooltip/**/*.{ts,tsx,mjs,css,json,md}"
          pnpm format:l5:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- product/components/composite-widgets/transient-surfaces/tooltip
          if ! git diff --cached --quiet; then
            git commit -m "style(tooltip): format native implementation"
            git push origin HEAD:refs/heads/fix/l5-tooltip-elements-native
          fi
