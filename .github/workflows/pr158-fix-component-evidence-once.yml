name: PR158 fix component evidence once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/repo-wide-rollout-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Replace legacy component evidence contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-component-metadata.mjs')
          s = p.read_text()
          old = '''      for (const framework of ["angular", "vue"]) {
                  const consumer = parity?.[framework];
                  if (
                    consumer?.status !== "verified-consumer" ||
                    consumer?.consumes !== "@vyrnforge/ui-elements" ||
                    consumer?.evidence !== "docs/metadata/gmf4-closure.json"
                  )
                    addFailure(
                      failures,
                      component,
                      `${framework} mapping must reference the GMF4-verified ui-elements consumer contract`,
                    );
                }'''
          new = '''      const consumerEvidence = {
                  angular: "docs/metadata/angular-consumer.json",
                  vue: "docs/metadata/vue-consumer.json",
                };
                for (const framework of ["angular", "vue"]) {
                  const consumer = parity?.[framework];
                  if (
                    consumer?.status !== "verified-consumer" ||
                    consumer?.consumes !== "@vyrnforge/ui-elements" ||
                    consumer?.evidence !== consumerEvidence[framework]
                  )
                    addFailure(
                      failures,
                      component,
                      `${framework} mapping must reference the current ui-elements consumer contract`,
                    );
                }'''
          if old not in s:
              raise SystemExit('target verifier block not found')
          p.write_text(s.replace(old, new))
          PY
      - run: npx prettier --write scripts/verify-component-metadata.mjs
      - run: node scripts/verify-component-metadata.mjs
      - run: rm .github/workflows/pr158-fix-component-evidence-once.yml
      - name: Commit verifier cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: use current consumer evidence in component verifier"
          git push
