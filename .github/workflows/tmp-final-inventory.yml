name: Temporary final consumer inventory

on:
  push:
    branches:
      - feat/consumer-knowledge-playground

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumer-knowledge-playground
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Remove helper then refresh inventory
        run: |
          rm .github/workflows/tmp-final-inventory.yml
          npm run inventory:repository
      - name: Commit final inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: finalize consumer repository inventory"
          git push origin HEAD:feat/consumer-knowledge-playground
