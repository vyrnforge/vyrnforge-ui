name: L5 Tooltip cross-browser proof (temporary)
on:
  push:
    branches: [fix/l5-tooltip-elements-native]
permissions:
  contents: read
jobs:
  browser-matrix:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"tooltip"},{"port":"react","components":"tooltip"},{"port":"angular","components":"tooltip"},{"port":"vue","components":"tooltip"},{"port":"elements","components":"tooltip"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: tooltip-native
      retention_days: 14
