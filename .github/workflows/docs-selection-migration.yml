name: Temporary selection docs migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Scaffold owned selection documentation
        shell: bash
        run: |
          for component in checkbox radio switch select radio-group; do
            npm run scaffold:documentation -- --component-id "$component" --owner-source packages/ui-elements/src/components/selection.ts --source "packages/ui-elements/src/components/${component}.docs.json"
          done
          npm run generate:reference
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-elements/src/components/*.docs.json docs/generated
          git commit -m "docs(selection): scaffold owned documentation cohort"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
