name: Rating repeat activation QA
on:
  pull_request:
    branches: [fix/rating-reselect-clear]
    paths: ['.github/workflows/rating-repeat-qa.yml']
permissions:
  contents: read
jobs:
  source-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: |
          pnpm exec prettier --write 'product/components/composite-widgets/choice-value/rating/**/*.{ts,tsx,mjs,css,json,md,html}'
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import { readFileSync } from "node:fs"; for(const path of execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean)) console.log("VF_FORMATTED "+JSON.stringify({path,content:readFileSync(path,"utf8")}));'
          pnpm format:l5:check
          pnpm lint:l5
      - run: pnpm exec nx run-many -t build --projects=@vyrnforge/core,@vyrnforge/web,@vyrnforge/icons,@vyrnforge/react,@vyrnforge/vue,@vyrnforge/angular,@vyrnforge/elements
      - run: |
          pnpm verify:api:update
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; for(const path of execFileSync("git",["diff","--name-only","--","packages/*/etc/*.api.md"],{encoding:"utf8"}).trim().split("\n").filter(Boolean)) console.log("VF_API_DIFF "+JSON.stringify({path,diff:execFileSync("git",["diff","--no-color","--",path],{encoding:"utf8"})}));'
  rating-cross:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"rating"},{"port":"react","components":"rating"},{"port":"angular","components":"rating"},{"port":"vue","components":"rating"},{"port":"elements","components":"rating"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: rating-repeat-qa
      retention_days: 7
