name: tmp-mfd1307-types
on:
  push:
    branches:
      - feat/MFD-1307-vue-type-surface-v2
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1307-vue-type-surface-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - name: Register typed catalog artifact
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const registryFile = "scripts/generated-framework-artifacts.mjs";
          let registry = readFileSync(registryFile, "utf8");
          const importAnchor = 'import { buildVueCatalogArtifact } from "./vue-catalog-generation.mjs";\n';
          if (!registry.includes('buildVueTypedCatalogArtifact')) {
            registry = registry.replace(importAnchor, `${importAnchor}import { buildVueTypedCatalogArtifact } from "./vue-type-generation.mjs";\n`);
            registry = registry.replace(
              '  const vueCatalog = buildVueCatalogArtifact({ root });\n',
              '  const vueCatalog = buildVueCatalogArtifact({ root });\n  const vueTypes = buildVueTypedCatalogArtifact({ root });\n',
            );
            const artifactAnchor = `    freezeArtifact({\n      path: vueCatalog.path,\n      generator: "scripts/vue-catalog-generation.mjs",\n      command: "npm run generate:framework-artifacts",\n      sourceRecords: vueCatalog.sourceRecords,\n      content: vueCatalog.content,\n    }),\n`;
            registry = registry.replace(
              artifactAnchor,
              `${artifactAnchor}    freezeArtifact({\n      path: vueTypes.path,\n      generator: "scripts/vue-type-generation.mjs",\n      command: "npm run generate:framework-artifacts",\n      sourceRecords: vueTypes.sourceRecords,\n      content: vueTypes.content,\n    }),\n`,
            );
            writeFileSync(registryFile, registry);
          }

          const testFile = "scripts/generated-framework-artifacts.test.mjs";
          let test = readFileSync(testFile, "utf8");
          test = test.replace("assert.equal(artifacts.length, 21);", "assert.equal(artifacts.length, 22);");
          const pathAnchor = '      "packages/ui-vue/src/generated/catalog.generated.ts",\n';
          if (!test.includes('typed-catalog.generated.ts')) {
            test = test.replace(pathAnchor, `${pathAnchor}      "packages/ui-vue/src/generated/typed-catalog.generated.ts",\n`);
          }
          writeFileSync(testFile, test);

          const indexFile = "packages/ui-vue/src/index.ts";
          let index = readFileSync(indexFile, "utf8");
          index = index.replace(
            'export * from "./generated/catalog.generated";',
            'export * from "./generated/typed-catalog.generated";',
          );
          writeFileSync(indexFile, index);
          NODE
      - name: Add Vue SFC type verifier and consumers
        run: |
          cat > scripts/verify-vue-sfc-types.mjs <<'NODE'
          import { createRequire } from "node:module";
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import { run } from "vue-tsc";

          const require = createRequire(import.meta.url);
          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const entry = require.resolve("@typescript/typescript6");
          const tscPath = path.join(path.dirname(entry), "tsc.js");
          process.chdir(root);
          process.argv = [process.execPath, "vue-tsc", "-p", "packages/ui-vue/tsconfig.json", "--noEmit"];
          run(tscPath);
          NODE
          cat > packages/ui-vue/src/type-surface.consumer.vue <<'VUE'
          <script setup lang="ts">
          import { ref } from "vue";
          import {
            VfDialog,
            VfTextInput,
            VfToggleButton,
            type VfDialogRef,
            type VfTextInputRef,
          } from "./index";

          const text = ref("typed");
          const open = ref(false);
          const pressed = ref(false);
          const textRef = ref<VfTextInputRef | null>(null);
          const dialogRef = ref<VfDialogRef | null>(null);

          textRef.value?.element?.focus();
          textRef.value?.element?.checkValidity();
          dialogRef.value?.element?.show();
          dialogRef.value?.element?.close();
          </script>

          <template>
            <VfTextInput ref="textRef" v-model="text" label="Typed" />
            <VfDialog ref="dialogRef" v-model:open="open">
              <template #header>Header</template>
              Typed dialog
            </VfDialog>
            <VfToggleButton v-model:pressed="pressed">Toggle</VfToggleButton>
          </template>
          VUE
          cat > packages/ui-vue/src/type-surface.test-d.ts <<'TS'
          import type {
            VfDialogEmits,
            VfTextInputProps,
            VfToggleButtonProps,
          } from "./index";

          const text: VfTextInputProps["modelValue"] = "typed";
          const pressed: VfToggleButtonProps["pressed"] = true;
          void text;
          void pressed;

          // @ts-expect-error Text input model values are strings.
          const invalidText: VfTextInputProps["modelValue"] = 42;
          void invalidText;

          declare const emitDialog: VfDialogEmits;
          emitDialog("update:open", true);
          // @ts-expect-error Dialog open updates are boolean.
          emitDialog("update:open", "yes");
          TS
      - run: npm install --save-dev vue-tsc @typescript/typescript6 --workspace @vyrnforge/ui-vue
      - name: Enable SFC type verification
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = "packages/ui-vue/package.json";
          const pkg = JSON.parse(readFileSync(file, "utf8"));
          pkg.scripts.typecheck = "tsc -p tsconfig.json --noEmit && node ../../scripts/verify-vue-sfc-types.mjs";
          writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - run: npm run generate:framework-artifacts
      - run: npx prettier --write scripts/vue-type-generation.mjs scripts/verify-vue-sfc-types.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs packages/ui-vue/src/index.ts packages/ui-vue/src/type-surface.consumer.vue packages/ui-vue/src/type-surface.test-d.ts packages/ui-vue/src/generated/typed-catalog.generated.ts packages/ui-vue/package.json package-lock.json
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test:generated-framework-artifacts
      - name: Commit clean task tree
        run: |
          rm .github/workflows/_tmp-mfd1307-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(vue): regenerate public type surface"
          git push origin HEAD:feat/MFD-1307-vue-type-surface-v2
