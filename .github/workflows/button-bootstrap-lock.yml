name: Button visual baseline bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  baseline:
    if: github.head_ref == 'feat/button-vertical-slice' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/button-vertical-slice
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Button fixture inputs
        run: |
          npm run build:core
          npm run build:web
          npm run build:docs
          node tooling/browser/build-button-fixtures.mjs web
      - name: Generate Chromium visual baseline
        run: |
          npx playwright install --with-deps chromium
          VF_BUTTON_PORT=web npx playwright test --config tooling/browser/button.config.mjs --project chromium --update-snapshots
      - name: Commit visual baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tooling/browser/button-tests/__screenshots__
          git commit -m "test(button): add Chromium visual baseline" || exit 0
          git push origin HEAD:feat/button-vertical-slice
