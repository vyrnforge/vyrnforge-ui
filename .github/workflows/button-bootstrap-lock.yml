name: Button branch bootstrap diagnostics

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.head_ref == 'feat/button-vertical-slice' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/button-vertical-slice
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture targeted validation output
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node tooling/impact/execute.mjs --mode pr --base "$BASE_SHA" --head "$HEAD_SHA" > validation-debug.txt 2>&1
          status=$?
          echo "exit_status=$status" >> validation-debug.txt
          exit 0
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-debug.txt
          git commit -m "chore(button): capture validation diagnostics" || exit 0
          git push origin HEAD:feat/button-vertical-slice
