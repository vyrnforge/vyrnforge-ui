name: Fix Angular Test Runtime

on:
  push:
    branches: [refactor/1051-standard-tooling]
    paths:
      - tooling/verify/fix-angular-test-runtime.mjs
      - .github/workflows/fix-angular-test-runtime.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/1051-standard-tooling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: node tooling/verify/fix-angular-test-runtime.mjs
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(testing): resolve workspace packages in Angular SSR tests"
          git push origin HEAD:refactor/1051-standard-tooling
