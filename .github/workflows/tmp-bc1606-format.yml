name: Temporary BC-1606 format

on:
  push:
    branches:
      - s16/bc-1606-generic-artifact-consumer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: s16/bc-1606-generic-artifact-consumer
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format focused files
        run: npx prettier --write scripts/release-package-exports.test.mjs scripts/verify-release-artifact.mjs
      - name: Commit formatted files and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-bc1606-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-package-exports.test.mjs scripts/verify-release-artifact.mjs .github/workflows/tmp-bc1606-format.yml
          git commit -m "style: format BC-1606 release verification"
          git push origin HEAD:s16/bc-1606-generic-artifact-consumer
