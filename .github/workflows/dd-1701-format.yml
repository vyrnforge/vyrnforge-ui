name: DD-1701 format fix

on:
  push:
    branches:
      - feat/dd-1701-description-list-contract
    paths:
      - .github/workflows/dd-1701-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dd-1701-description-list-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: npm ci
      - name: Format DD-1701 source files
        run: npx prettier --write docs/metadata/component-contracts.json docs/metadata/components.json scripts/canonical-component-contracts.test.mjs
      - name: Commit format fix
        shell: bash
        run: |
          rm .github/workflows/dd-1701-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata/component-contracts.json docs/metadata/components.json scripts/canonical-component-contracts.test.mjs .github/workflows/dd-1701-format.yml
          git diff --cached --check
          git commit -m "chore: format DD-1701 metadata"
          git push origin HEAD:feat/dd-1701-description-list-contract
