name: Format standardization once

on:
  push:
    branches:
      - docs/align-public-target-and-ai-rules
    paths:
      - .github/workflows/format-standardization-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/align-public-target-and-ai-rules
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Format standardization files
        run: >-
          npx prettier --write
          README.md
          docs/README.md
          docs/architecture/00-system-overview.md
          docs/architecture/adr-011-optional-advanced-module-architecture.md
          docs/architecture/adr-013-pattern-template-contract.md
          docs/roadmap/00-master-roadmap.md
          docs/roadmap/02-gap-analysis.md
          docs/roadmap/03-do-not-build-yet.md
          docs/roadmap/04-vision-mission-scope-alignment-review.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/architecture/00-system-overview.md docs/architecture/adr-011-optional-advanced-module-architecture.md docs/architecture/adr-013-pattern-template-contract.md docs/roadmap/00-master-roadmap.md docs/roadmap/02-gap-analysis.md docs/roadmap/03-do-not-build-yet.md docs/roadmap/04-vision-mission-scope-alignment-review.md
          git commit -m "chore: normalize standardization markdown formatting"
          git push origin HEAD:docs/align-public-target-and-ai-rules
