name: SearchField cross-engine evidence
on:
  push:
    branches: [evidence/l5-search-field-cross]
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"search-field"},{"port":"react","components":"search-field"},{"port":"vue","components":"search-field"},{"port":"angular","components":"search-field"},{"port":"elements","components":"search-field"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: search-field-cross
      retention_days: 14
