name: Temporary MFD-1307 type analysis

on:
  push:
    branches:
      - tmp/MFD-1307-type-analysis

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Print Vue type vocabulary
        run: |
          node --input-type=module <<'NODE'
          import { loadCanonicalComponentContracts } from './scripts/canonical-component-contracts.mjs';
          import { createFrameworkGenerationModel } from './scripts/framework-generation.mjs';
          const model = createFrameworkGenerationModel(loadCanonicalComponentContracts({ root: process.cwd() }));
          const components = model.surfaces.vue.components.filter((r) => ['current','target'].includes(r.status));
          const propertyTypes = [...new Set(components.flatMap((r) => r.properties.map((p) => p.type)))].sort();
          const eventTypes = [...new Set(components.flatMap((r) => r.events.flatMap((e) => e.detailFields.map((f) => f.type))))].sort();
          const methodTypes = [...new Set(components.flatMap((r) => r.methods.flatMap((m) => [m.returns, ...m.parameters.map((p) => p.type)])))].sort();
          const slots = [...new Set(components.flatMap((r) => r.slots.map((s) => `${s.public}|${s.content}|${s.multiple}`)))].sort();
          console.log(JSON.stringify({ propertyTypes, eventTypes, methodTypes, slots }, null, 2));
          NODE
