name: MFD-1315 Release Integration

on:
  push:
    branches:
      - feat/MFD-1315-vue-release-integration

permissions:
  contents: write

jobs:
  measure:
    if: ${{ !contains(github.event.head_commit.message, '[mfd-1315-measured]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1315-vue-release-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run verify:beta-package-artifacts
      - run: npm run verify:beta-package-size-budgets
      - name: Capture measured Vue baseline
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifestPath = 'docs/metadata/beta-package-size-budgets.json';
          const report = JSON.parse(fs.readFileSync('test-results/beta-package-artifacts/size-report.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const measured = (report.packages || report.measurements || []).find((entry) => entry.name === '@vyrnforge/ui-vue');
          if (!measured) throw new Error('Vue size measurement missing');
          const target = manifest.packages.find((entry) => entry.name === '@vyrnforge/ui-vue');
          if (!target) throw new Error('Vue size budget entry missing');
          const metrics = ['packedBytes','unpackedBytes','fileCount','runtimeJavaScriptBytes','declarationBytes','cssBytes'];
          target.baseline = Object.fromEntries(metrics.map((metric) => [metric, measured[metric]]));
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npx prettier --write docs/metadata/beta-package-size-budgets.json
      - name: Commit measured baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/metadata/beta-package-size-budgets.json
          git commit -m 'chore(release): record Vue package size baseline [mfd-1315-measured]' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: mfd-1315-beta-package-evidence
          path: test-results/beta-package-artifacts/
