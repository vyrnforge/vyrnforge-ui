name: Temporary consumer surface wiring

on:
  push:
    branches:
      - feat/consumer-knowledge-playground

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumer-knowledge-playground
      - name: Apply surface wiring
        run: |
          python scripts/tmp_wire_consumer_surfaces.py
          node scripts/generate-component-reference.mjs
          rm scripts/tmp_wire_consumer_surfaces.py
          rm .github/workflows/tmp-wire-consumer-surfaces.yml
      - name: Commit consumer surfaces
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: wire consumer knowledge into docs and playground"
          git push origin HEAD:feat/consumer-knowledge-playground
