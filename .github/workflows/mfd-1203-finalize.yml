name: MFD-1203 finalize Angular setup consumer

on:
  push:
    branches:
      - mfd-1203-angular-setup-api

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Patch packed Angular consumer evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replaceOnce = (text, before, after, label) => {
            if (!text.includes(before)) throw new Error(`Missing ${label}`);
            return text.replace(before, after);
          };

          const runtimePath = 'scripts/verify-consumer-foundations-runtime.mjs';
          let runtime = fs.readFileSync(runtimePath, 'utf8');
          runtime = replaceOnce(
            runtime,
            `  {\n    name: "@vyrnforge/ui-elements",\n    directory: "packages/ui-elements",\n    customElements: true,\n  },\n];`,
            `  {\n    name: "@vyrnforge/ui-elements",\n    directory: "packages/ui-elements",\n    customElements: true,\n  },\n  { name: "@vyrnforge/ui-angular", directory: "packages/ui-angular" },\n];`,
            'Angular package definition insertion',
          );
          runtime = replaceOnce(
            runtime,
            `    packageNames: [\n      "@vyrnforge/ui-core",\n      "@vyrnforge/ui-behaviors",\n      "@vyrnforge/ui-elements",\n    ],\n  },\n  {\n    id: "vue",`,
            `    packageNames: [\n      "@vyrnforge/ui-core",\n      "@vyrnforge/ui-behaviors",\n      "@vyrnforge/ui-elements",\n    ],\n    packedPackageNames: [\n      "@vyrnforge/ui-core",\n      "@vyrnforge/ui-behaviors",\n      "@vyrnforge/ui-elements",\n      "@vyrnforge/ui-angular",\n    ],\n  },\n  {\n    id: "vue",`,
            'Angular packed package list',
          );
          runtime = replaceOnce(
            runtime,
            `function selectFixtureTarballs(fixture, tarballs) {\n  const packageNames = new Set(fixture.packageNames);`,
            `function selectFixtureTarballs(fixture, tarballs) {\n  const packageNames = new Set(\n    fixture.packedPackageNames ?? fixture.packageNames,\n  );`,
            'packed package selector',
          );
          runtime = replaceOnce(
            runtime,
            `    runNpm(["run", "build", "--workspace", "@vyrnforge/ui-elements"], {\n      stdio: "inherit",\n    });\n\n    console.log(\n      "Packing ui-core, ui-behaviors, ui-components, and ui-elements...",\n    );`,
            `    runNpm(["run", "build", "--workspace", "@vyrnforge/ui-elements"], {\n      stdio: "inherit",\n    });\n    runNpm(["run", "build", "--workspace", "@vyrnforge/ui-angular"], {\n      stdio: "inherit",\n    });\n\n    console.log(\n      "Packing ui-core, ui-behaviors, ui-components, ui-elements, and ui-angular...",\n    );`,
            'Angular package build',
          );
          fs.writeFileSync(runtimePath, runtime);

          const consumerVerifierPath = 'scripts/verify-angular-consumer.mjs';
          let verifier = fs.readFileSync(consumerVerifierPath, 'utf8');
          verifier = replaceOnce(
            verifier,
            `  for (const marker of [\n    "@vyrnforge/ui-elements/register",\n    "provideZonelessChangeDetection",\n    "bootstrapApplication",\n  ]) {`,
            `  for (const marker of [\n    "@vyrnforge/ui-angular",\n    "provideVyrnForge",\n    "provideZonelessChangeDetection",\n    "bootstrapApplication",\n  ]) {`,
            'Angular bootstrap verifier markers',
          );
          verifier = replaceOnce(
            verifier,
            `    const packageJson = JSON.parse(readFileSync(packagePath, "utf8"));\n    const dependencyNames = Object.keys({`,
            `    const packageJson = JSON.parse(readFileSync(packagePath, "utf8"));\n    if (packageJson.name === "@vyrnforge/ui-angular") continue;\n    const dependencyNames = Object.keys({`,
            'Angular facade dependency exception',
          );
          fs.writeFileSync(consumerVerifierPath, verifier);

          const componentPath = 'tests/consumers/angular/src/app/app.component.ts';
          let component = fs.readFileSync(componentPath, 'utf8');
          component = replaceOnce(
            component,
            `import type {\n  VyrnForgeActionDetail,\n  VyrnForgeElementForTagName,\n  VyrnForgeTabItem,\n} from "@vyrnforge/ui-elements";\n\nimport { VfButton } from "./generated/vf-button.generated";\nimport {\n  VfDialog,\n  type GeneratedDialogDismissDetail,\n} from "./generated/vf-dialog.generated";\nimport { VfTabs } from "./generated/vf-tabs.generated";\nimport { VfTextInput } from "./generated/vf-text-input.generated";`,
            `import {\n  VfButton,\n  VfDialog,\n  VfTabs,\n  VfTextInput,\n  type GeneratedDialogDismissDetail,\n  type VyrnForgeActionDetail,\n  type VyrnForgeElementForTagName,\n  type VyrnForgeTabItem,\n} from "@vyrnforge/ui-angular";`,
            'Angular facade imports',
          );
          fs.writeFileSync(componentPath, component);
          NODE

      - name: Commit final consumer wiring and remove helper
        shell: bash
        run: |
          rm .github/workflows/mfd-1203-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-consumer-foundations-runtime.mjs scripts/verify-angular-consumer.mjs tests/consumers/angular/src/app/app.component.ts .github/workflows/mfd-1203-finalize.yml
          git commit -m 'test(angular): verify packed one-step setup'
          git push origin HEAD:mfd-1203-angular-setup-api
