name: S16 BC-1604 Tooling Consolidation

on:
  push:
    branches:
      - s16/bc-1604-tooling-cleanup

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1604-tooling-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Consolidate retired Button transition tooling
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          root = Path('.')

          package = root / 'package.json'
          data = json.loads(package.read_text())
          for key in (
              'generate:framework-button-slice',
              'verify:framework-button-slice',
              'verify:framework-button-slice:runtime',
          ):
              data['scripts'].pop(key, None)
          package.write_text(json.dumps(data, indent=2) + '\n')

          generation = root / 'scripts/framework-generation.mjs'
          text = generation.read_text()
          text = re.sub(
              r'\nexport const FRAMEWORK_GENERATION_TASKS = Object\.freeze\(\[.*?\]\);\n',
              '\n',
              text,
              flags=re.S,
          )
          generation.write_text(text)

          tests = root / 'scripts/framework-generation.test.mjs'
          text = tests.read_text()
          text = text.replace('  FRAMEWORK_GENERATION_TASKS,\n', '')
          text = text.replace('  assert(FRAMEWORK_GENERATION_TASKS.includes("MFD-1111"));\n', '')
          text = text.replace('  assert(FRAMEWORK_GENERATION_TASKS.includes("MFD-1112"));\n', '')
          text = text.replace(
              'test("Button representative generators emit removable proof artifacts without premature framework packages", () => {',
              'test("Button representative generators preserve four-surface consumer artifacts", () => {',
          )
          text = text.replace('  assert.equal(artifacts.length, 5);', '  assert.equal(artifacts.length, 4);')
          tests.write_text(text)

          button = root / 'scripts/framework-button-generation.mjs'
          text = button.read_text()
          text = text.replace('  reference: "docs/generated/framework-button-slice.json",\n', '')
          text = text.replace(
              ' * @generated by scripts/generate-framework-button-slice.mjs\n',
              ' * @generated by scripts/generate-framework-artifacts.mjs\n',
          )
          text = text.replace(
              ' * DO NOT EDIT. Regenerate with: npm run generate:framework-button-slice\n',
              ' * DO NOT EDIT. Regenerate with: npm run generate:framework-artifacts\n',
          )
          text = text.replace('    task: "MFD-1112",\n', '')
          text = re.sub(
              r'\nfunction sourceOwnership\(surface\) \{.*?\n\}\n\nexport function serializeFrameworkButtonReference\(model\) \{.*?\n\}\n\nfunction propertyInterfaceLines',
              '\nfunction propertyInterfaceLines',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\n    Object\.freeze\(\{\n      path: FRAMEWORK_BUTTON_ARTIFACT_PATHS\.reference,\n      framework: "all",\n      sourceRecords: Object\.freeze\(\["component:button"\]\),\n      content: serializeFrameworkButtonReference\(model\),\n    \}\),',
              '',
              text,
          )
          button.write_text(text)

          aggregate = root / 'scripts/generated-framework-artifacts.mjs'
          text = aggregate.read_text()
          text = text.replace(
              'import { buildFrameworkButtonSliceArtifacts } from "./generate-framework-button-slice.mjs";\n',
              'import { loadCanonicalComponentContracts } from "./canonical-component-contracts.mjs";\n'
              'import {\n'
              '  buildFrameworkButtonArtifacts,\n'
              '  createFrameworkButtonSliceModel,\n'
              '} from "./framework-button-generation.mjs";\n'
              'import { createFrameworkGenerationModel } from "./framework-generation.mjs";\n',
          )
          marker = 'export function buildGeneratedFrameworkArtifacts({\n'
          helper = '''function buildFrameworkButtonSliceArtifacts({\n  root = repositoryRoot,\n} = {}) {\n  const contracts = loadCanonicalComponentContracts({ root });\n  const generationModel = createFrameworkGenerationModel(contracts);\n  const model = createFrameworkButtonSliceModel(generationModel);\n  return { model, artifacts: buildFrameworkButtonArtifacts(model) };\n}\n\n'''
          text = text.replace(marker, helper + marker)
          text = text.replace(
              '      "scripts/generate-framework-button-slice.mjs",\n      "npm run generate:framework-button-slice",',
              '      "scripts/generate-framework-artifacts.mjs",\n      "npm run generate:framework-artifacts",',
          )
          aggregate.write_text(text)

          generated_tests = root / 'scripts/generated-framework-artifacts.test.mjs'
          text = generated_tests.read_text()
          text = text.replace('  assert.equal(artifacts.length, 8);', '  assert.equal(artifacts.length, 7);')
          text = text.replace('      "docs/generated/framework-button-slice.json",\n', '')
          generated_tests.write_text(text)

          for relative in (
              'scripts/generate-framework-button-slice.mjs',
              'scripts/verify-framework-button-slice-runtime.mjs',
              'docs/generated/framework-button-slice.json',
          ):
              path = root / relative
              if path.exists():
                  path.unlink()

      - name: Format changed sources
        run: |
          npx --yes npm@11.16.0 ci
          npx prettier --write package.json scripts/framework-generation.mjs scripts/framework-generation.test.mjs scripts/framework-button-generation.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs
      - name: Remove helper and commit
        shell: bash
        run: |
          git rm .github/workflows/s16-bc1604-cleanup-helper.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: consolidate framework Button generation tooling"
          git push origin HEAD:s16/bc-1604-tooling-cleanup
