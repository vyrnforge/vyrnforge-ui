name: Temporary S16 Dev Audit Patch Inspect

on:
  push:
    branches:
      - infra/s16-dev-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: infra/s16-dev-audit
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Verify repository package manager
        run: npm --version && test "$(npm --version)" = "11.16.0"
      - name: Inspect patched 4.x versions
        run: |
          echo "vitest 4=$(npm view vitest@4 version --json)"
          echo "coverage 4=$(npm view @vitest/coverage-v8@4 version --json)"
          echo "vitest 4.1.11=$(npm view vitest@4.1.11 version 2>/dev/null || true)"
          echo "coverage 4.1.11=$(npm view @vitest/coverage-v8@4.1.11 version 2>/dev/null || true)"
