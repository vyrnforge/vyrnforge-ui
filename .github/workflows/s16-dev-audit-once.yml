name: Temporary S16 Dev Audit Fix Once

on:
  push:
    branches:
      - infra/s16-dev-audit

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: infra/s16-dev-audit
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Verify package manager
        run: npm --version && test "$(npm --version)" = "11.16.0"
      - name: Apply compatible lock-only remediation
        run: |
          npm audit fix --package-lock-only || true
          npm update vitest @vitest/coverage-v8 esbuild --workspaces --include-workspace-root --package-lock-only
      - name: Verify full audit
        run: npm audit --audit-level=low
      - name: Commit lockfile remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "BC-1606: remediate development dependency advisories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
