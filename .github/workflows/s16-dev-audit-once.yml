name: Temporary S16 Dev Audit Inspect Once

on:
  push:
    branches:
      - infra/s16-dev-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: infra/s16-dev-audit
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Inspect available parent tool releases
        run: |
          echo "vite latest=$(npm view vite version)"
          echo "vite esbuild=$(npm view vite@latest dependencies.esbuild)"
          echo "tsup latest=$(npm view tsup version)"
          echo "tsup esbuild=$(npm view tsup@latest dependencies.esbuild)"
          echo "bundle-require latest=$(npm view bundle-require version)"
          echo "bundle-require esbuild=$(npm view bundle-require@latest dependencies.esbuild)"
          echo "vitest latest=$(npm view vitest version)"
          echo "coverage latest=$(npm view @vitest/coverage-v8 version)"
