name: Temporary S16 Dev Audit Remediation Once

on:
  push:
    branches:
      - infra/s16-dev-audit

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: infra/s16-dev-audit
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Apply minimal development-tool remediation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(readFileSync(path, "utf8"));
          pkg.devDependencies["@vitest/coverage-v8"] = "^5.0.0";
          pkg.overrides = {
            ...(pkg.overrides ?? {}),
            tsup: { esbuild: "0.28.2" },
            vite: { esbuild: "0.28.2" }
          };
          pkg.allowScripts = { "esbuild@0.28.2": true };
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm update vitest @vitest/coverage-v8 --workspaces --include-workspace-root --package-lock-only
          npm audit fix --package-lock-only || true
      - name: Verify clean install and zero audit
        run: |
          npm ci
          npm audit --audit-level=low
          npm ls vitest @vitest/coverage-v8 esbuild --all
      - name: Run focused tooling checks
        run: |
          npm run test:contracts
          npm run test:coverage
          npm run build:packages
      - name: Commit validated remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "BC-1606: remediate development dependency advisories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
