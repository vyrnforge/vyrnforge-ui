name: MFD-1204 repair finalizer escaping

on:
  push:
    branches:
      - mfd-1204-angular-full-catalog-bindings
    paths:
      - .github/workflows/mfd-1204-repair-finalizer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mfd-1204-angular-full-catalog-bindings
      - name: Preserve literal replacement escapes
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mfd-1204-finalize.yml')
          text = path.read_text()
          old = 'text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('finalizer sub helper target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair and remove helper
        run: |
          git rm .github/workflows/mfd-1204-repair-finalizer.yml
          git config user.name "vyrnforge-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/mfd-1204-finalize.yml
          git commit -m "chore(angular): preserve finalizer escapes"
          git push origin HEAD:mfd-1204-angular-full-catalog-bindings
