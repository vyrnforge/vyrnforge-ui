name: BC-1608 G16 exact-main dispatch

on:
  push:
    branches:
      - validation/bc-1608-g16-exact-main-dispatch

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: dispatch-exact-main-assurance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXACT_MAIN_SHA: ffedf46ee844c338ad5f23e1e1c4ab53f96270e2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify protected main is unchanged
        shell: bash
        run: |
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$actual" = "$EXACT_MAIN_SHA"
      - name: Dispatch canonical assurance workflow on main
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/assurance.yml/dispatches" -f ref=main
