name: Temporary MFD-1312 pack Vue

on:
  push:
    branches:
      - feat/MFD-1312-vue-public-fixture

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1312-vue-public-fixture
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Restore verifier and add staged Vue tarball narrowly
        run: |
          git checkout HEAD^ -- scripts/verify-consumer-foundations-runtime.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-consumer-foundations-runtime.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '  {\n    name: "@vyrnforge/ui-elements",\n    directory: "packages/ui-elements",\n    customElements: true,\n  },\n];',
              '  {\n    name: "@vyrnforge/ui-elements",\n    directory: "packages/ui-elements",\n    customElements: true,\n  },\n  { name: "@vyrnforge/ui-vue", directory: "packages/ui-vue", staged: true },\n];',
            ],
            [
              '    packageNames: [\n      "@vyrnforge/ui-core",\n      "@vyrnforge/ui-behaviors",\n      "@vyrnforge/ui-elements",\n    ],\n  },\n];',
              '    packageNames: [\n      "@vyrnforge/ui-core",\n      "@vyrnforge/ui-behaviors",\n      "@vyrnforge/ui-elements",\n      "@vyrnforge/ui-vue",\n    ],\n  },\n];',
            ],
            [
              '    runNpm(["run", "build", "--workspace", "@vyrnforge/ui-elements"], {\n      stdio: "inherit",\n    });\n\n    console.log(\n      "Packing ui-core, ui-behaviors, ui-components, and ui-elements...",\n    );',
              '    runNpm(["run", "build", "--workspace", "@vyrnforge/ui-elements"], {\n      stdio: "inherit",\n    });\n    if (fixtures.some((fixture) => fixture.id === "vue")) {\n      runNpm(["run", "build", "--workspace", "@vyrnforge/ui-vue"], {\n        stdio: "inherit",\n      });\n    }\n\n    console.log(\n      "Packing ui-core, ui-behaviors, ui-components, ui-elements, and staged ui-vue...",\n    );',
            ],
          ];
          for (const [before, after] of replacements) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`expected one replacement, found ${count}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
      - run: npx prettier --write scripts/verify-consumer-foundations-runtime.mjs
      - run: node scripts/verify-consumer-foundations-runtime.mjs --fixture vue --build-only
      - run: node scripts/verify-multi-framework-architecture.mjs
      - name: Commit narrow verifier patch
        run: |
          rm .github/workflows/_tmp-mfd1312-pack-vue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-consumer-foundations-runtime.mjs .github/workflows/_tmp-mfd1312-pack-vue.yml
          git commit -m "test(vue): pack staged facade in consumer matrix"
          git push origin HEAD:feat/MFD-1312-vue-public-fixture
