name: Temporary MFD-1312 pack Vue

on:
  push:
    branches:
      - feat/MFD-1312-vue-public-fixture

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1312-vue-public-fixture
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Restore verifier and add staged Vue tarball narrowly
        run: |
          git checkout f6eba018792dde12b2a9b431cd6aaa99777e57ea -- scripts/verify-consumer-foundations-runtime.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'scripts/verify-consumer-foundations-runtime.mjs';
          const lines = fs.readFileSync(file, 'utf8').split('\n');

          const elementFlag = lines.findIndex(
            (line, index) =>
              line.trim() === 'customElements: true,' &&
              lines.slice(Math.max(0, index - 4), index).some((entry) =>
                entry.includes('@vyrnforge/ui-elements'),
              ),
          );
          if (elementFlag < 0 || lines[elementFlag + 1]?.trim() !== '},') {
            throw new Error('ui-elements package definition anchor missing');
          }
          lines.splice(
            elementFlag + 2,
            0,
            '  { name: "@vyrnforge/ui-vue", directory: "packages/ui-vue", staged: true },',
          );

          const vueStart = lines.findIndex((line) => line.trim() === 'id: "vue",');
          if (vueStart < 0) throw new Error('Vue fixture anchor missing');
          const vuePackage = lines.findIndex(
            (line, index) =>
              index > vueStart &&
              index < vueStart + 30 &&
              line.includes('"@vyrnforge/ui-elements"'),
          );
          if (vuePackage < 0) throw new Error('Vue ui-elements package anchor missing');
          lines.splice(vuePackage + 1, 0, '      "@vyrnforge/ui-vue",');

          const packMap = lines.findIndex(
            (line) => line.trim() === 'return packageDefinitions.map((packageDefinition) => {',
          );
          if (packMap < 0) throw new Error('packPackages map anchor missing');
          lines.splice(
            packMap,
            1,
            '  const requestedPackageNames = new Set(',
            '    fixtures.flatMap((fixture) => fixture.packageNames),',
            '  );',
            '',
            '  return packageDefinitions',
            '    .filter((packageDefinition) => requestedPackageNames.has(packageDefinition.name))',
            '    .map((packageDefinition) => {',
          );
          const verifyFunction = lines.findIndex(
            (line) => line.startsWith('function verifyInstalledPackages'),
          );
          if (verifyFunction < 0) throw new Error('verifyInstalledPackages anchor missing');
          let packClose = verifyFunction - 1;
          while (packClose >= 0 && lines[packClose].trim() === '') packClose -= 1;
          if (lines[packClose]?.trim() !== '}') throw new Error('packPackages function close missing');
          let mapClose = packClose - 1;
          while (mapClose >= 0 && lines[mapClose].trim() === '') mapClose -= 1;
          if (lines[mapClose]?.trim() !== '});') throw new Error('packPackages map close missing');
          lines[mapClose] = '    });';

          const elementBuild = lines.findIndex((line) =>
            line.includes('"build", "--workspace", "@vyrnforge/ui-elements"'),
          );
          if (elementBuild < 0) throw new Error('ui-elements build anchor missing');
          let elementBuildClose = elementBuild;
          while (
            elementBuildClose < lines.length &&
            lines[elementBuildClose].trim() !== '});'
          ) {
            elementBuildClose += 1;
          }
          if (elementBuildClose >= lines.length) throw new Error('ui-elements build close missing');
          lines.splice(
            elementBuildClose + 1,
            0,
            '    if (fixtures.some((fixture) => fixture.id === "vue")) {',
            '      runNpm(["run", "build", "--workspace", "@vyrnforge/ui-vue"], {',
            '        stdio: "inherit",',
            '      });',
            '    }',
          );

          const logLine = lines.findIndex((line) =>
            line.includes('Packing ui-core, ui-behaviors, ui-components, and ui-elements...'),
          );
          if (logLine >= 0) {
            lines[logLine] =
              '      "Packing selected consumer packages, including staged ui-vue for Vue...",';
          }

          fs.writeFileSync(file, lines.join('\n'));
          NODE
      - run: npx prettier --write scripts/verify-consumer-foundations-runtime.mjs
      - run: node scripts/verify-consumer-foundations-runtime.mjs --fixture vue --build-only
      - run: node scripts/verify-multi-framework-architecture.mjs
      - name: Commit narrow verifier patch
        run: |
          rm .github/workflows/_tmp-mfd1312-pack-vue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-consumer-foundations-runtime.mjs .github/workflows/_tmp-mfd1312-pack-vue.yml
          git commit -m "test(vue): pack staged facade in consumer matrix"
          git push origin HEAD:feat/MFD-1312-vue-public-fixture
