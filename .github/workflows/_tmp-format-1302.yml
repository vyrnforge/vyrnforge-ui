name: tmp format 1302
on:
  push:
    branches: [mfd-1302-format]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx prettier --write scripts/verify-vue-peer-policy.mjs packages/ui-vue/package.json docs/packages/ui-vue.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-vue-peer-policy.mjs packages/ui-vue/package.json docs/packages/ui-vue.md
          git commit -m "chore: format [formatted]" || exit 0
          git push
