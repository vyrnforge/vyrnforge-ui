name: Temporary S16 Docs Cleanup Once

on:
  push:
    branches:
      - docs/s16-remove-stale-s4-evidence

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/s16-remove-stale-s4-evidence
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Remove stale S4 docs evidence and route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/docs/src/docsRegistry.ts')
          s = p.read_text()
          s = s.replace('import multiFrameworkArchitectureEvidence from "../../../docs/quality/s4-multi-framework-architecture.md?raw";\n', '')
          start = s.index('  {\n    id: "s4-multi-framework-architecture",')
          end = s.index('  {\n    id: "release-docs",', start)
          s = s[:start] + s[end:]
          p.write_text(s)
          Path('docs/quality/s4-multi-framework-architecture.md').unlink()
          PY
          npm run inventory:repository
          npx prettier --write apps/docs/src/docsRegistry.ts docs/governance/repository-inventory.md
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/docsRegistry.ts docs/quality/s4-multi-framework-architecture.md docs/governance/repository-inventory.md
          git commit -m "docs: remove stale S4 architecture evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
