name: S16 Format Documentation Verifier Helper

on:
  push:
    branches:
      - s16/bc-1602-docs-cleanup

permissions:
  contents: write

jobs:
  format-doc-verifier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1602-docs-cleanup
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format documentation verifier
        run: npx prettier --write scripts/verify-documentation-current.mjs
      - name: Commit formatted verifier
        run: |
          if git diff --quiet -- scripts/verify-documentation-current.mjs; then
            echo "Verifier already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-documentation-current.mjs
          git commit -m "chore: format documentation verifier"
          git push origin HEAD:s16/bc-1602-docs-cleanup
