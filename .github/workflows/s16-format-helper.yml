name: S16 Format Helper

on:
  push:
    branches:
      - s16/bc-1602-docs-cleanup

permissions:
  contents: write

jobs:
  format-docs-registry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1602-docs-cleanup
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format docs registry
        run: npx prettier --write apps/docs/src/docsRegistry.ts
      - name: Commit formatted registry
        run: |
          if git diff --quiet -- apps/docs/src/docsRegistry.ts; then
            echo "Registry already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/docsRegistry.ts
          git commit -m "chore: format docs registry for BC-1602"
          git push origin HEAD:s16/bc-1602-docs-cleanup
