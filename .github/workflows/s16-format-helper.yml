name: S16 Format Helper

on:
  push:
    branches:
      - s16/promote-bc-1603

permissions:
  contents: write

jobs:
  format-bc1603:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/promote-bc-1603
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format BC-1603 markdown
        run: npx prettier --write docs/architecture/adr-006-framework-package-strategy.md
      - name: Commit formatted file
        run: |
          if git diff --quiet -- docs/architecture/adr-006-framework-package-strategy.md; then
            echo "ADR already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/adr-006-framework-package-strategy.md
          git commit -m "chore: format BC-1603 architecture doc"
          git push origin HEAD:s16/promote-bc-1603
