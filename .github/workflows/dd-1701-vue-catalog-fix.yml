name: DD-1701 Vue catalog target fix

on:
  push:
    branches:
      - feat/dd-1701-description-list-contract
    paths:
      - .github/workflows/dd-1701-vue-catalog-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/dd-1701-description-list-contract
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: npm ci
      - name: Gate Vue facade generation on the canonical native renderer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/vue-catalog-generation.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '.filter((record) => ["current", "target"].includes(record.status))',
            `.filter(\n      (record) =>\n        ["current", "target"].includes(record.status) &&\n        nativeById.get(record.id)?.status === "current",\n    )`,
          );
          source = source.replace(
            `  assert(\n    components.length === 59,\n    \`expected 59 supported non-grid contracts, received \${components.length}\`,\n  );`,
            `  const currentNativeCount = generationModel.surfaces.native.components.filter(\n    (record) => record.status === "current",\n  ).length;\n  assert(\n    components.length === currentNativeCount,\n    \`expected \${currentNativeCount} current native-backed Vue contracts, received \${components.length}\`,\n  );`,
          );
          if (!source.includes('nativeById.get(record.id)?.status === "current"')) {
            throw new Error('Vue native-renderer readiness filter was not applied');
          }
          if (source.includes('expected 59 supported non-grid contracts')) {
            throw new Error('fixed Vue catalog size assertion remains');
          }
          fs.writeFileSync(path, source, 'utf8');
          NODE
      - name: Format and validate Vue catalog fix
        run: |
          npx prettier --write scripts/vue-catalog-generation.mjs
          node scripts/verify-vue-catalog-coverage.mjs
          node scripts/generate-framework-artifacts.mjs --check
      - name: Commit Vue catalog fix
        shell: bash
        run: |
          rm .github/workflows/dd-1701-vue-catalog-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vue-catalog-generation.mjs .github/workflows/dd-1701-vue-catalog-fix.yml
          git diff --cached --check
          git commit -m "fix: gate Vue catalog on native renderer readiness"
          git push origin HEAD:feat/dd-1701-description-list-contract
