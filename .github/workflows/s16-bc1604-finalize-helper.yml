name: S16 BC-1604 Aggregate Generator Cleanup

on:
  push:
    branches:
      - s16/bc-1604-tooling-cleanup

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1604-tooling-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Collapse framework slice wrappers into aggregate generator
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')

          generation = root / 'scripts/framework-generation.mjs'
          generation_text = generation.read_text()
          if 'export const FRAMEWORK_GENERATION_TASKS' not in generation_text:
              marker = 'export const FRAMEWORK_SURFACES = Object.freeze([\n  "native",\n  "react",\n  "angular",\n  "vue",\n]);\n'
              tasks = '\nexport const FRAMEWORK_GENERATION_TASKS = Object.freeze([\n' + ''.join(
                  f'  "MFD-{task}",\n' for task in range(1102, 1113)
              ) + ']);\n'
              if marker not in generation_text:
                  raise SystemExit('framework surfaces marker did not match')
              generation.write_text(generation_text.replace(marker, marker + tasks))

          generation_test = root / 'scripts/framework-generation.test.mjs'
          test_text = generation_test.read_text()
          if 'FRAMEWORK_GENERATION_TASKS,' not in test_text:
              test_text = test_text.replace(
                  'import {\n  FRAMEWORK_SURFACES,\n',
                  'import {\n  FRAMEWORK_SURFACES,\n  FRAMEWORK_GENERATION_TASKS,\n',
              )
          anchor = '  assert.equal(button.surfaces.vue.events[0].public, "action");\n'
          if 'FRAMEWORK_GENERATION_TASKS.includes("MFD-1111")' not in test_text:
              test_text = test_text.replace(
                  anchor,
                  anchor
                  + '  assert(FRAMEWORK_GENERATION_TASKS.includes("MFD-1111"));\n'
                  + '  assert(FRAMEWORK_GENERATION_TASKS.includes("MFD-1112"));\n',
              )
          generation_test.write_text(test_text)

          aggregate = root / 'scripts/generated-framework-artifacts.mjs'
          text = aggregate.read_text()
          text = text.replace('import { buildFrameworkDialogSliceArtifacts } from "./generate-framework-dialog-slice.mjs";\n', '')
          text = text.replace('import { buildFrameworkTabsSliceArtifacts } from "./generate-framework-tabs-slice.mjs";\n', '')
          text = text.replace('import { buildFrameworkTextInputSliceArtifacts } from "./generate-framework-text-input-slice.mjs";\n', '')
          text = text.replace(
              'import { createFrameworkGenerationModel } from "./framework-generation.mjs";\n',
              'import {\n'
              '  buildFrameworkDialogArtifacts,\n'
              '  createFrameworkDialogSliceModel,\n'
              '} from "./framework-dialog-generation.mjs";\n'
              'import { createFrameworkGenerationModel } from "./framework-generation.mjs";\n'
              'import {\n'
              '  buildFrameworkTabsArtifacts,\n'
              '  createFrameworkTabsSliceModel,\n'
              '} from "./framework-tabs-generation.mjs";\n'
              'import {\n'
              '  buildFrameworkTextInputArtifacts,\n'
              '  createFrameworkTextInputSliceModel,\n'
              '} from "./framework-text-input-generation.mjs";\n',
          )
          text = re.sub(
              r'\nfunction buildFrameworkButtonSliceArtifacts\(\{ root = repositoryRoot \} = \{\}\) \{.*?\n\}\n',
              '\n',
              text,
              flags=re.S,
          )
          old = (
              '  const native = buildNativeElementArtifacts({ root });\n'
              '  const apiReference = buildFrameworkApiReference({ root });\n'
              '  const button = buildFrameworkButtonSliceArtifacts({ root });\n'
              '  const textInput = buildFrameworkTextInputSliceArtifacts({ root });\n'
              '  const tabs = buildFrameworkTabsSliceArtifacts({ root });\n'
              '  const dialog = buildFrameworkDialogSliceArtifacts({ root });\n'
          )
          new = (
              '  const native = buildNativeElementArtifacts({ root });\n'
              '  const apiReference = buildFrameworkApiReference({ root });\n'
              '  const contracts = loadCanonicalComponentContracts({ root });\n'
              '  const generationModel = createFrameworkGenerationModel(contracts);\n'
              '  const buttonModel = createFrameworkButtonSliceModel(generationModel);\n'
              '  const textInputModel = createFrameworkTextInputSliceModel(generationModel);\n'
              '  const tabsModel = createFrameworkTabsSliceModel(generationModel);\n'
              '  const dialogModel = createFrameworkDialogSliceModel(generationModel);\n'
              '  const button = { model: buttonModel, artifacts: buildFrameworkButtonArtifacts(buttonModel) };\n'
              '  const textInput = { model: textInputModel, artifacts: buildFrameworkTextInputArtifacts(textInputModel) };\n'
              '  const tabs = { model: tabsModel, artifacts: buildFrameworkTabsArtifacts(tabsModel) };\n'
              '  const dialog = { model: dialogModel, artifacts: buildFrameworkDialogArtifacts(dialogModel) };\n'
          )
          if old not in text:
              raise SystemExit('aggregate construction block did not match')
          aggregate.write_text(text.replace(old, new))

          for filename, old_generator in (
              ('framework-button-generation.mjs', 'generate-framework-button-slice.mjs'),
              ('framework-text-input-generation.mjs', 'generate-framework-text-input-slice.mjs'),
              ('framework-tabs-generation.mjs', 'generate-framework-tabs-slice.mjs'),
              ('framework-dialog-generation.mjs', 'generate-framework-dialog-slice.mjs'),
          ):
              path = root / 'scripts' / filename
              source = path.read_text()
              source = re.sub(r'^const TASK_ID = "MFD-\d+";\n', '', source, flags=re.M)
              source = source.replace(
                  f' * @generated by scripts/{old_generator}\n',
                  ' * @generated by scripts/generate-framework-artifacts.mjs\n',
              )
              path.write_text(source)

          for relative in (
              'scripts/generate-framework-text-input-slice.mjs',
              'scripts/generate-framework-tabs-slice.mjs',
              'scripts/generate-framework-dialog-slice.mjs',
          ):
              path = root / relative
              if path.exists():
                  path.unlink()
      - name: Regenerate and format aggregate-owned artifacts
        run: |
          npx --yes npm@11.16.0 ci
          npx prettier --write scripts/framework-generation.mjs scripts/framework-generation.test.mjs scripts/generated-framework-artifacts.mjs scripts/framework-button-generation.mjs scripts/framework-text-input-generation.mjs scripts/framework-tabs-generation.mjs scripts/framework-dialog-generation.mjs
          npm run generate:framework-artifacts
          npm run verify:framework-artifacts
      - name: Remove helper and commit
        shell: bash
        run: |
          git rm .github/workflows/s16-bc1604-finalize-helper.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: centralize framework artifact generation"
          git push origin HEAD:s16/bc-1604-tooling-cleanup
