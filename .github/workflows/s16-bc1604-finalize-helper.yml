name: S16 BC-1604 Aggregate Generator Cleanup

on:
  push:
    branches:
      - s16/bc-1604-tooling-cleanup

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s16/bc-1604-tooling-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Collapse framework slice wrappers into aggregate generator
        shell: python
        run: |
          import re
          from pathlib import Path

          root = Path('.')
          aggregate = root / 'scripts/generated-framework-artifacts.mjs'
          text = aggregate.read_text()
          text = text.replace('import { buildFrameworkDialogSliceArtifacts } from "./generate-framework-dialog-slice.mjs";\n', '')
          text = text.replace('import { buildFrameworkTabsSliceArtifacts } from "./generate-framework-tabs-slice.mjs";\n', '')
          text = text.replace('import { buildFrameworkTextInputSliceArtifacts } from "./generate-framework-text-input-slice.mjs";\n', '')
          text = text.replace(
              'import { createFrameworkGenerationModel } from "./framework-generation.mjs";\n',
              'import {\n'
              '  buildFrameworkDialogArtifacts,\n'
              '  createFrameworkDialogSliceModel,\n'
              '} from "./framework-dialog-generation.mjs";\n'
              'import { createFrameworkGenerationModel } from "./framework-generation.mjs";\n'
              'import {\n'
              '  buildFrameworkTabsArtifacts,\n'
              '  createFrameworkTabsSliceModel,\n'
              '} from "./framework-tabs-generation.mjs";\n'
              'import {\n'
              '  buildFrameworkTextInputArtifacts,\n'
              '  createFrameworkTextInputSliceModel,\n'
              '} from "./framework-text-input-generation.mjs";\n',
          )
          text = re.sub(
              r'\nfunction buildFrameworkButtonSliceArtifacts\(\{ root = repositoryRoot \} = \{\}\) \{.*?\n\}\n',
              '\n',
              text,
              flags=re.S,
          )
          text = text.replace('export const GENERATED_FRAMEWORK_ARTIFACT_TASK = "MFD-1111";\n\n', '')
          old = '''  const native = buildNativeElementArtifacts({ root });
  const apiReference = buildFrameworkApiReference({ root });
  const button = buildFrameworkButtonSliceArtifacts({ root });
  const textInput = buildFrameworkTextInputSliceArtifacts({ root });
  const tabs = buildFrameworkTabsSliceArtifacts({ root });
  const dialog = buildFrameworkDialogSliceArtifacts({ root });
'''
          new = '''  const native = buildNativeElementArtifacts({ root });
  const apiReference = buildFrameworkApiReference({ root });
  const contracts = loadCanonicalComponentContracts({ root });
  const generationModel = createFrameworkGenerationModel(contracts);
  const buttonModel = createFrameworkButtonSliceModel(generationModel);
  const textInputModel = createFrameworkTextInputSliceModel(generationModel);
  const tabsModel = createFrameworkTabsSliceModel(generationModel);
  const dialogModel = createFrameworkDialogSliceModel(generationModel);
  const button = { model: buttonModel, artifacts: buildFrameworkButtonArtifacts(buttonModel) };
  const textInput = { model: textInputModel, artifacts: buildFrameworkTextInputArtifacts(textInputModel) };
  const tabs = { model: tabsModel, artifacts: buildFrameworkTabsArtifacts(tabsModel) };
  const dialog = { model: dialogModel, artifacts: buildFrameworkDialogArtifacts(dialogModel) };
'''
          if old not in text:
              raise SystemExit('aggregate construction block did not match')
          aggregate.write_text(text.replace(old, new))

          for filename, old_generator in (
              ('framework-button-generation.mjs', 'generate-framework-button-slice.mjs'),
              ('framework-text-input-generation.mjs', 'generate-framework-text-input-slice.mjs'),
              ('framework-tabs-generation.mjs', 'generate-framework-tabs-slice.mjs'),
              ('framework-dialog-generation.mjs', 'generate-framework-dialog-slice.mjs'),
          ):
              path = root / 'scripts' / filename
              source = path.read_text()
              source = re.sub(r'^const TASK_ID = "MFD-\d+";\n', '', source, flags=re.M)
              source = source.replace(
                  f' * @generated by scripts/{old_generator}\n',
                  ' * @generated by scripts/generate-framework-artifacts.mjs\n',
              )
              path.write_text(source)

          for relative in (
              'scripts/generate-framework-text-input-slice.mjs',
              'scripts/generate-framework-tabs-slice.mjs',
              'scripts/generate-framework-dialog-slice.mjs',
          ):
              path = root / relative
              if path.exists():
                  path.unlink()
      - name: Regenerate and format aggregate-owned artifacts
        run: |
          npx --yes npm@11.16.0 ci
          npx prettier --write scripts/generated-framework-artifacts.mjs scripts/framework-button-generation.mjs scripts/framework-text-input-generation.mjs scripts/framework-tabs-generation.mjs scripts/framework-dialog-generation.mjs
          npm run generate:framework-artifacts
      - name: Remove helper and commit
        shell: bash
        run: |
          git rm .github/workflows/s16-bc1604-finalize-helper.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: centralize framework artifact generation"
          git push origin HEAD:s16/bc-1604-tooling-cleanup
