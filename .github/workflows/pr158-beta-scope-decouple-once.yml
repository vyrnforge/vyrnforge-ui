name: PR158 beta scope decouple once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/repo-wide-rollout-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Remove legacy beta-scope coupling
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replace(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`Missing expected text in ${path}`);
            fs.writeFileSync(path, source.replace(from, to));
          }

          const generator = 'scripts/generate-beta-scope.mjs';
          replace(generator,
            '  const gmf4 = readJson(root, "docs/metadata/gmf4-closure.json");',
            '  const architecture = readJson(root, "docs/metadata/multi-framework.json");\n  const dataGridReleaseGroup = getReleaseGroup("data-grid-alpha", {\n    root,\n    manifest: releaseGroups,\n  });');
          replace(generator,
            '        "docs/metadata/gmf4-closure.json",',
            '        "docs/metadata/multi-framework.json",\n        "docs/metadata/release-groups.json",');
          replace(generator,
            '      includedPackages: gmf4.releaseGroup.includedPackages,\n      excludedPackages: gmf4.releaseGroup.deferredPackages,\n      packageMetadataReleaseGroups: packages.releaseGroups,\n      firstClassRenderers: gmf4.supportModel.firstClassRenderers,\n      verifiedConsumers: gmf4.supportModel.verifiedConsumers,\n      excludedPlatforms: gmf4.releaseGroup.excludedPlatforms,',
            '      includedPackages: betaReleaseGroup.packages.map((entry) => entry.name),\n      excludedPackages: dataGridReleaseGroup.packages.map((entry) => ({\n        name: entry.name,\n        status:\n          architecture.packages.find((candidate) => candidate.name === entry.name)\n            ?.status ?? "deferred",\n        reason:\n          "Data-grid multi-framework rendering remains outside the non-grid beta critical path.",\n      })),\n      packageMetadataReleaseGroups: packages.releaseGroups,\n      firstClassRenderers: Object.fromEntries(\n        architecture.frameworks\n          .filter((framework) => framework.supportLevel === "first-class")\n          .map((framework) => [\n            framework.id === "native-html" ? "nativeHtml" : framework.id,\n            framework.renderer,\n          ]),\n      ),\n      verifiedConsumers: Object.fromEntries(\n        architecture.frameworks\n          .filter((framework) => framework.supportLevel === "verified-consumer")\n          .map((framework) => [framework.id, framework.renderer]),\n      ),\n      excludedPlatforms: [\n        "react-native",\n        "flutter",\n        "native-android",\n        "native-ios",\n        "desktop-native",\n      ],');
          replace(generator,
            '      platforms: gmf4.releaseGroup.excludedPlatforms.map((platform) => ({',
            '      platforms: [\n        "react-native",\n        "flutter",\n        "native-android",\n        "native-ios",\n        "desktop-native",\n      ].map((platform) => ({');
          replace(generator,
            '    acceptedLimitations: gmf4.acceptedLimitations,',
            '    acceptedLimitations: [\n      "React and native HTML are first-class renderers; Angular and Vue are verified consumers of the native renderer.",\n      "Angular Forms and Vue v-model bridges are reference adapters and are not separate published component libraries.",\n      "The React data grid remains explicitly deferred from the non-grid beta release group.",\n      "Non-web native platforms remain outside this beta support claim.",\n    ],');
          replace(generator,
            '      "Public non-grid React export with a current native-renderer mapping and GMF4-verified Angular/Vue consumption.",',
            '      "Public non-grid React export with a current native-renderer mapping and verified Angular/Vue consumption.",');

          const verifier = 'scripts/verify-beta-scope.mjs';
          replace(verifier,
            '    for (const framework of ["angular", "vue"]) {\n      if (\n        component[framework]?.evidence !== "docs/metadata/gmf4-closure.json"\n      ) {\n        failures.push(\n          `${component.id}: ${framework} must reference GMF4 closure evidence`,\n        );\n      }\n    }',
            '    const frameworkEvidence = {\n      angular: "docs/metadata/angular-consumer.json",\n      vue: "docs/metadata/vue-consumer.json",\n    };\n    for (const framework of ["angular", "vue"]) {\n      if (component[framework]?.evidence !== frameworkEvidence[framework]) {\n        failures.push(\n          `${component.id}: ${framework} must reference current consumer evidence`,\n        );\n      }\n    }');

          const test = 'scripts/verify-beta-scope.test.mjs';
          replace(test,
            '      mutateJson(root, "docs/metadata/gmf4-closure.json", (value) => {\n        value.releaseGroup.includedPackages.push("@vyrnforge/ui-data-grid");\n      });\n',
            '      mutateJson(root, "docs/metadata/release-groups.json", (value) => {\n        const beta = value.releaseLines["non-grid-beta"];\n        beta.packages.push(\n          value.releaseLines["data-grid-alpha"].packages[0],\n        );\n      });\n');

          const componentsPath = 'docs/metadata/components.json';
          const components = JSON.parse(fs.readFileSync(componentsPath, 'utf8'));
          for (const component of components.components ?? []) {
            if (component.frameworkParity?.angular?.evidence === 'docs/metadata/gmf4-closure.json') {
              component.frameworkParity.angular.evidence = 'docs/metadata/angular-consumer.json';
            }
            if (component.frameworkParity?.vue?.evidence === 'docs/metadata/gmf4-closure.json') {
              component.frameworkParity.vue.evidence = 'docs/metadata/vue-consumer.json';
            }
          }
          fs.writeFileSync(componentsPath, `${JSON.stringify(components, null, 2)}\n`);
          NODE
      - run: node scripts/generate-beta-scope.mjs
      - run: npx prettier --write scripts/generate-beta-scope.mjs scripts/verify-beta-scope.mjs scripts/verify-beta-scope.test.mjs docs/metadata/components.json docs/metadata/non-grid-beta-scope.json
      - name: Remove one-shot workflow
        run: rm .github/workflows/pr158-beta-scope-decouple-once.yml
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: decouple beta scope from legacy GMF4 closure"
          git push
