name: Baseline cleanup once

on:
  push:
    branches:
      - docs/align-public-target-and-ai-rules
    paths:
      - .github/workflows/baseline-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/align-public-target-and-ai-rules
          fetch-depth: 0

      - name: Remove stale formatting baseline entry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.prettier-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stalePath = 'docs/roadmap/00-master-roadmap.md';
          if (!(stalePath in baseline.entries)) {
            throw new Error(`Expected stale baseline entry is missing: ${stalePath}`);
          }
          delete baseline.entries[stalePath];
          fs.writeFileSync(path, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE
          rm .github/workflows/baseline-cleanup-once.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove stale roadmap formatting baseline"
          git push origin HEAD:docs/align-public-target-and-ai-rules
