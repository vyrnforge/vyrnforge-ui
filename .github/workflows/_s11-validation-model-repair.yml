name: S11 validation-model repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 's11-framework-generation-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout S11 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: s11-framework-generation-foundation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Align validation model with S11 contract tests
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          npm ci
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'scripts/validation-model.mjs';
          let text = readFileSync(file, 'utf8');
          const first = '  "test:canonical-contracts",\n  "test:ci-scope",';
          const firstReplacement = '  "test:canonical-contracts",\n  "test:framework-generation",\n  "test:ci-scope",';
          const last = '  "test:documentation-current",\n  "test:validation-model",\n];';
          const lastReplacement = '  "test:documentation-current",\n  "test:validation-model",\n  "test:generated-framework-artifacts",\n];';
          if (!text.includes(first) || !text.includes(last)) {
            throw new Error('validation-model anchors changed; refusing broad rewrite');
          }
          text = text.replace(first, firstReplacement).replace(last, lastReplacement);
          writeFileSync(file, text);
          NODE
          npm run test:validation-model
          npm run verify:validation-model
          npm run format -- scripts/validation-model.mjs
          npm run format:check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/_s11-validation-model-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/validation-model.mjs .github/workflows/_s11-validation-model-repair.yml
          git commit -m "fix: align validation model with S11 contracts"
          git push origin HEAD:s11-framework-generation-foundation
