name: Format probe

on:
  push:
    branches:
      - feat/810-component-doc-specimens

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Format changed files and print payloads
        shell: bash
        run: |
          npx prettier --write apps/docs/src/ComponentReferencePage.tsx apps/docs/src/referenceData.ts tests/reference-ui/reference-product.spec.ts
          for file in apps/docs/src/ComponentReferencePage.tsx apps/docs/src/referenceData.ts tests/reference-ui/reference-product.spec.ts; do
            echo "FORMAT_PAYLOAD_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_PAYLOAD_END:$file"
          done
