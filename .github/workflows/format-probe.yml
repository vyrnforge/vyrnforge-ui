name: Format probe

on:
  push:
    branches:
      - feat/810-component-doc-specimens

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/810-component-doc-specimens
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository formatting
        shell: bash
        run: |
          npx prettier --write apps/docs/src/ComponentReferencePage.tsx apps/docs/src/referenceData.ts tests/reference-ui/reference-product.spec.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src/ComponentReferencePage.tsx apps/docs/src/referenceData.ts tests/reference-ui/reference-product.spec.ts
          git commit -m "style(docs): apply repository formatting (#810)"
          git push origin HEAD:feat/810-component-doc-specimens
