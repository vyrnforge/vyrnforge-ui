name: S11 Dialog Foundation Alignment

on:
  push:
    branches:
      - s11-dialog-generation-slice

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: s11-dialog-generation-slice
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Align canonical Dialog scaffold and dismissal event
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          overlay_path = Path("packages/ui-elements/src/components/overlays.ts")
          source = overlay_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one overlay replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              '''  #surface: HTMLDivElement | null = null;\n  #previousFocus: HTMLElement | null = null;''',
              '''  #surface: HTMLDivElement | null = null;\n  #trigger: HTMLElement | null = null;\n  #previousFocus: HTMLElement | null = null;''',
          )

          replace_once(
              '''    else scaffold.surface.removeAttribute("aria-describedby");\n    this.setAttribute("data-vf-element", "");''',
              '''    else scaffold.surface.removeAttribute("aria-describedby");\n    scaffold.backdrop.setAttribute("aria-hidden", String(!this.open));\n    this.#trigger?.setAttribute("aria-controls", this.#contentId);\n    this.#trigger?.setAttribute("aria-expanded", String(this.open));\n    this.#trigger?.setAttribute("aria-haspopup", "dialog");\n    this.setAttribute("data-vf-element", "");''',
          )

          replace_once(
              '''    const externalNodes = [...this.childNodes].filter(\n      (node) =>\n        !(\n          node instanceof Element &&\n          node.hasAttribute("data-vf-overlay-internal")\n        ),\n    );\n    const backdrop = document.createElement("div");''',
              '''    const externalNodes = [...this.childNodes].filter(\n      (node) =>\n        !(\n          node instanceof Element &&\n          node.hasAttribute("data-vf-overlay-internal")\n        ),\n    );\n    const trigger = externalNodes.find(\n      (node): node is HTMLElement =>\n        node instanceof HTMLElement && node.getAttribute("slot") === "trigger",\n    );\n    const headerNodes: Node[] = [];\n    const contentNodes: Node[] = [];\n    const actionNodes: Node[] = [];\n    const footerNodes: Node[] = [];\n    for (const node of externalNodes) {\n      if (node === trigger) continue;\n      const slot =\n        node instanceof Element ? node.getAttribute("slot") : undefined;\n      if (slot === "header") headerNodes.push(node);\n      else if (slot === "actions") actionNodes.push(node);\n      else if (slot === "footer") footerNodes.push(node);\n      else contentNodes.push(node);\n    }\n    const clearSlot = (node: Node) => {\n      if (node instanceof Element) node.removeAttribute("slot");\n      return node;\n    };\n    const triggerContainer = document.createElement("span");\n    triggerContainer.className = `${this.overlayConfig.baseClass}__trigger`;\n    triggerContainer.dataset.vfOverlayInternal = "";\n    if (trigger) {\n      trigger.removeAttribute("slot");\n      trigger.addEventListener("click", this.handleTriggerClick);\n      triggerContainer.append(trigger);\n    }\n    const backdrop = document.createElement("div");''',
          )

          replace_once(
              '''    close.addEventListener("click", () => this.close("close-button"));\n    header.append(title, close);''',
              '''    close.addEventListener("click", () => this.close("close-button"));\n    header.append(title);\n    for (const node of headerNodes) header.append(clearSlot(node));\n    header.append(close);''',
          )

          replace_once(
              '''    body.className = `${this.overlayConfig.baseClass}__body`;\n    body.dataset.vfOverlayBody = "";\n    for (const node of externalNodes) body.append(node);\n    surface.append(header, description, body);\n    backdrop.append(surface);\n    this.replaceChildren(backdrop);\n    this.#backdrop = backdrop;\n    this.#surface = surface;\n    this.#body = body;\n    return { backdrop, body, description, surface, title };''',
              '''    body.className = `${this.overlayConfig.baseClass}__body`;\n    body.dataset.vfOverlayBody = "";\n    for (const node of contentNodes) body.append(clearSlot(node));\n    const actions = document.createElement("div");\n    actions.className = `${this.overlayConfig.baseClass}__actions`;\n    actions.dataset.vfOverlayInternal = "";\n    for (const node of actionNodes) actions.append(clearSlot(node));\n    actions.hidden = actionNodes.length === 0;\n    const footer = document.createElement("footer");\n    footer.className = `${this.overlayConfig.baseClass}__footer`;\n    footer.dataset.vfOverlayInternal = "";\n    for (const node of footerNodes) footer.append(clearSlot(node));\n    footer.hidden = footerNodes.length === 0;\n    surface.append(header, description, body, actions, footer);\n    backdrop.append(surface);\n    this.replaceChildren(triggerContainer, backdrop);\n    this.#backdrop = backdrop;\n    this.#surface = surface;\n    this.#body = body;\n    this.#trigger = trigger ?? null;\n    return { backdrop, body, description, surface, title };''',
          )

          replace_once(
              '''  private requestOpen(nextOpen: boolean, reason: string): void {\n    const previousOpen = this.open;\n    const changed = nextOpen\n      ? this.#controller.setOpen(true, reason as "programmatic")\n      : this.#controller.dismiss(reason as OverlayDismissReason);''',
              '''  private requestOpen(nextOpen: boolean, reason: string): void {\n    const previousOpen = this.open;\n    if (\n      !nextOpen &&\n      previousOpen &&\n      reason !== "programmatic" &&\n      !this.dispatchTypedEvent(\n        "vf-dismiss",\n        {\n          id: this.id || undefined,\n          reason: reason as OverlayDismissReason,\n        },\n        { cancelable: true },\n      )\n    ) {\n      return;\n    }\n    const changed = nextOpen\n      ? this.#controller.setOpen(true, reason as "programmatic")\n      : this.#controller.dismiss(reason as OverlayDismissReason);''',
          )

          replace_once(
              '''  private readonly handleBackdropPointer = (event: PointerEvent) => {''',
              '''  private readonly handleTriggerClick = () => {\n    if (!this.disabled) this.show();\n  };\n\n  private readonly handleBackdropPointer = (event: PointerEvent) => {''',
          )

          overlay_path.write_text(source)

          css_path = Path("packages/ui-elements/src/styles/overlays/dialog.css")
          css = css_path.read_text()
          old = '''vf-dialog.vf-dialog-root,\nvf-drawer.vf-drawer-root {\n  position: fixed;\n  inset: 0;\n  z-index: var(--vf-layer-modal);\n  pointer-events: none;\n}\nvf-dialog.vf-dialog-root--open,\nvf-drawer.vf-drawer-root--open {\n  pointer-events: auto;\n}\nvf-dialog .vf-dialog__backdrop,\nvf-drawer .vf-drawer__backdrop {\n  position: fixed;\n  inset: 0;\n  display: grid;\n  place-items: center;\n  padding: var(--vf-space-4);\n  background: var(--vf-surface-scrim);\n}\n'''
          new = '''vf-dialog.vf-dialog-root {\n  position: relative;\n}\nvf-dialog .vf-dialog__trigger {\n  display: contents;\n}\nvf-drawer.vf-drawer-root {\n  position: fixed;\n  inset: 0;\n  z-index: var(--vf-layer-modal);\n  pointer-events: none;\n}\nvf-drawer.vf-drawer-root--open {\n  pointer-events: auto;\n}\nvf-dialog .vf-dialog__backdrop,\nvf-drawer .vf-drawer__backdrop {\n  position: fixed;\n  inset: 0;\n  z-index: var(--vf-layer-modal);\n  display: grid;\n  place-items: center;\n  padding: var(--vf-space-4);\n  background: var(--vf-surface-scrim);\n}\n'''
          if css.count(old) != 1:
              raise SystemExit("expected one Dialog/Drawer root CSS block")
          css = css.replace(old, new, 1)
          marker = '''vf-dialog .vf-dialog__body,\nvf-drawer .vf-drawer__body {\n  min-height: 0;\n  overflow: auto;\n  padding: var(--vf-space-4);\n}\n'''
          addition = marker + '''vf-dialog .vf-dialog__actions,\nvf-dialog .vf-dialog__footer {\n  display: flex;\n  justify-content: flex-end;\n  gap: var(--vf-space-2);\n  padding: var(--vf-space-3) var(--vf-space-4);\n  border-top: 1px solid var(--vf-divider);\n}\n'''
          if css.count(marker) != 1:
              raise SystemExit("expected one Dialog body CSS block")
          css = css.replace(marker, addition, 1)
          css_path.write_text(css)
          PY

      - name: Format aligned source
        run: >-
          npx prettier --write
          packages/ui-elements/src/components/overlays.ts
          packages/ui-elements/src/styles/overlays/dialog.css

      - name: Commit foundation alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui-elements/src/components/overlays.ts \
            packages/ui-elements/src/styles/overlays/dialog.css
          git commit -m "fix: align Dialog trigger and dismissal contracts"
          git push origin HEAD:s11-dialog-generation-slice
