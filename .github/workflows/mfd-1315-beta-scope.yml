name: MFD-1315 Beta Scope Regeneration

on:
  push:
    branches:
      - feat/MFD-1315-vue-release-integration

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[mfd-1315-beta-scope]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1315-vue-release-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run generate:beta-scope
      - run: npx prettier --write docs/metadata/beta-scope.json
      - name: Commit generated beta scope
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/metadata/beta-scope.json
          git commit -m 'chore(release): regenerate beta scope [mfd-1315-beta-scope]' || exit 0
          git push
