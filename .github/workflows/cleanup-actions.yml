name: Cleanup old workflow runs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview cleanup without deleting runs"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: vyrnforge-actions-run-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup-old-runs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Cleanup historical workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # 2026-06-05
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_workflow_by_state_pattern: ALL
          delete_run_by_conclusion_pattern: ALL
          dry_run: ${{ inputs.dry_run }}
