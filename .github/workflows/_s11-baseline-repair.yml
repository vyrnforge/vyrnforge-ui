name: S11 baseline repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 's11-framework-generation-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout S11 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: s11-framework-generation-foundation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Repair formatting baseline
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          npm ci
          npm run format:baseline
          npm run format:check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/_s11-baseline-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .prettier-baseline.json .github/workflows/_s11-baseline-repair.yml
          git commit -m "chore: refresh formatting baseline after main reconciliation"
          git push origin HEAD:s11-framework-generation-foundation
