name: Angular APF Spike

on:
  push:
    branches: [refactor/1051-standard-tooling]
    paths:
      - .github/workflows/angular-apf-spike.yml

permissions:
  contents: read

jobs:
  apf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare APF prerequisites
        run: |
          pnpm add --filter @vyrnforge/angular tslib@^2.8.1 --ignore-scripts
          pnpm exec nx run @vyrnforge/web:build
      - name: Simulate APF-native entrypoint layout in the runner
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, renameSync, rmSync, writeFileSync } from 'node:fs';
          const root = 'packages/angular';
          const manifest = JSON.parse(readFileSync(`${root}/package.json`, 'utf8'));
          writeFileSync(`${root}/ng-package.json`, `${JSON.stringify({ $schema: '../../node_modules/ng-packagr/ng-package.schema.json', dest: '../../dist/angular-apf', allowedNonPeerDependencies: ['@vyrnforge/core', '@vyrnforge/web', 'tslib'], lib: { entryFile: 'src/index.ts' } }, null, 2)}\n`);
          writeFileSync(`${root}/tsconfig.lib.json`, `${JSON.stringify({ extends: '../../node_modules/ng-packagr/src/lib/ts/conf/tsconfig.ngc.json', compilerOptions: { target: 'ES2022', lib: ['ES2022', 'DOM', 'DOM.Iterable'], strict: true, declarationMap: true, sourceMap: true, exactOptionalPropertyTypes: true, noUncheckedIndexedAccess: true, useUnknownInCatchVariables: true, forceConsistentCasingInFileNames: true, skipLibCheck: true }, angularCompilerOptions: { compilationMode: 'partial', strictTemplates: true } }, null, 2)}\n`);
          let primary = readFileSync(`${root}/src/index.ts`, 'utf8');
          for (const key of Object.keys(manifest.exports ?? {})) {
            if (key === '.' || !key.startsWith('./') || key.includes('*')) continue;
            const name = key.slice(2);
            const source = `${root}/src/components/${name}/index.ts`;
            try { readFileSync(source); } catch { continue; }
            const entry = `${root}/${name}`;
            mkdirSync(`${entry}/src`, { recursive: true });
            renameSync(source, `${entry}/src/index.ts`);
            writeFileSync(`${entry}/ng-package.json`, `${JSON.stringify({ $schema: '../../../node_modules/ng-packagr/ng-entrypoint.schema.json', lib: { entryFile: 'src/index.ts' } }, null, 2)}\n`);
            primary = primary.replaceAll(`./components/${name}/index.js`, `../${name}/src/index.js`);
          }
          writeFileSync(`${root}/src/index.ts`, primary);
          rmSync(`${root}/src/components`, { recursive: true, force: true });
          NODE
      - name: Build APF
        run: |
          set -o pipefail
          pnpm exec ng-packagr -p packages/angular/ng-package.json --config packages/angular/tsconfig.lib.json 2>&1 | tee apf.log
      - name: Capture APF output shape
        if: success()
        run: find dist/angular-apf -maxdepth 3 -type f | sort | tee -a apf.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: angular-apf-spike
          path: apf.log
          retention-days: 1
