name: Standard Tooling Validation

on:
  push:
    branches: [refactor/1051-standard-tooling]

permissions:
  contents: read

concurrency:
  group: standard-tooling-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Nx project graph
        run: pnpm exec nx show projects
      - name: Workspace structure
        run: pnpm verify:structure
      - name: Tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 1
      - name: Build
        run: pnpm build
