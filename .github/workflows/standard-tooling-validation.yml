name: Standard Tooling Validation

on:
  push:
    branches: [refactor/1051-standard-tooling]

permissions:
  contents: read

concurrency:
  group: standard-tooling-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Standard repository validation
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check.log
      - name: Packed package validation
        run: |
          set -o pipefail
          pnpm verify:packages 2>&1 | tee package-validation.log
      - name: Reject superseded tooling and axe injection
        run: |
          test ! -e tooling/impact/execute.mjs
          test ! -e tooling/testing/run-owned-unit.mjs
          test ! -e tooling/verify/consumer-packages.mjs
          test ! -e tooling/verify/migrate-axe-playwright.mjs
          test ! -e tooling/verify/standard-tooling-migration.mjs
          test ! -e .github/workflows/angular-apf-spike.yml
          test ! -e .github/workflows/axe-migration.yml
          test ! -e .github/workflows/standard-tooling-migration.yml
          test ! -e package-lock.json
          if grep -R --line-number --exclude-dir=node_modules --exclude-dir=dist 'axeCore\.source' product; then
            echo 'Legacy axe-core script injection remains' >&2
            exit 1
          fi
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: standard-tooling-diagnostics-${{ github.run_id }}
          path: |
            check.log
            package-validation.log
          if-no-files-found: ignore
          retention-days: 1

# Temporary acceptance gate for #1051; remove after the clean branch passes.
