name: L5 Final Assurance Evidence
on:
  push:
    branches: [evidence/l5-final-main-20261115]
permissions:
  contents: read
jobs:
  browser:
    uses: ./.github/workflows/_browser-validation.yml
    with:
      scopes_json: '[{"port":"web","components":"accordion,alert-dialog,carousel,color-picker,combobox,context-menu,dialog,disclosure,drawer,file-uploader,listbox,menu,menubar,multi-select,number-field,otp-field,pagination,password-field,popover,preview-card,range-slider,rating,search-field,segmented-control,select,split-button,split-panel,tabs,tag-group,toast,toggle-group,toolbar,tooltip"},{"port":"react","components":"accordion,alert-dialog,carousel,color-picker,combobox,context-menu,dialog,disclosure,drawer,file-uploader,listbox,menu,menubar,multi-select,number-field,otp-field,pagination,password-field,popover,preview-card,range-slider,rating,search-field,segmented-control,select,split-button,split-panel,tabs,tag-group,toast,toggle-group,toolbar,tooltip"},{"port":"vue","components":"accordion,alert-dialog,carousel,color-picker,combobox,context-menu,dialog,disclosure,drawer,file-uploader,listbox,menu,menubar,multi-select,number-field,otp-field,pagination,password-field,popover,preview-card,range-slider,rating,search-field,segmented-control,select,split-button,split-panel,tabs,tag-group,toast,toggle-group,toolbar,tooltip"},{"port":"angular","components":"accordion,alert-dialog,carousel,color-picker,combobox,context-menu,dialog,disclosure,drawer,file-uploader,listbox,menu,menubar,multi-select,number-field,otp-field,pagination,password-field,popover,preview-card,range-slider,rating,search-field,segmented-control,select,split-button,split-panel,tabs,tag-group,toast,toggle-group,toolbar,tooltip"},{"port":"elements","components":"accordion,alert-dialog,carousel,color-picker,combobox,context-menu,dialog,disclosure,drawer,file-uploader,listbox,menu,menubar,multi-select,number-field,otp-field,pagination,password-field,popover,preview-card,range-slider,rating,search-field,segmented-control,select,split-button,split-panel,tabs,tag-group,toast,toggle-group,toolbar,tooltip"}]'
      revision: ${{ github.sha }}
      browser_profile: cross
      browsers: chromium firefox webkit
      artifact_suffix: l5-final-cross
      retention_days: 30
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm verify:release
      - run: pnpm verify:packages
      - run: pnpm build:docs
