name: Temporary MFD-1309 slots

on:
  push:
    branches:
      - feat/MFD-1309-vue-slots

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/MFD-1309-vue-slots
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run generate:framework-artifacts
      - run: npx prettier --write scripts/vue-catalog-generation.mjs packages/ui-vue/src/slots.ts packages/ui-vue/src/slots.test.ts packages/ui-vue/src/generated/catalog.generated.ts
      - run: npm run typecheck --workspace @vyrnforge/ui-vue
      - run: npm run test --workspace @vyrnforge/ui-vue
      - run: node scripts/generated-framework-artifacts.test.mjs
      - name: Commit generated output
        run: |
          rm .github/workflows/_tmp-mfd1309-slots.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/vue-catalog-generation.mjs packages/ui-vue/src/slots.ts packages/ui-vue/src/slots.test.ts packages/ui-vue/src/generated/catalog.generated.ts .github/workflows/_tmp-mfd1309-slots.yml
          git commit -m "chore(vue): generate MFD-1309 slot bridge"
          git push origin HEAD:feat/MFD-1309-vue-slots
