name: Icon reference implementation helper

on:
  push:
    branches:
      - feat/icon-reference-catalog

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/icon-reference-catalog
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Register icon Reference source and renderer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const read = (file) => fs.readFileSync(file, "utf8");
          const write = (file, content) => fs.writeFileSync(file, content);
          const replaceOnce = (file, from, to) => {
            const source = read(file);
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`Missing patch marker in ${file}: ${from}`);
            write(file, source.replace(from, to));
          };

          const metadataFile = "docs/metadata/documentation-pages.json";
          const metadata = JSON.parse(read(metadataFile));
          if (!metadata.pages.some((page) => page.id === "icons")) {
            for (const page of metadata.pages) {
              if (page.section === "foundations" && page.order >= 2) page.order += 1;
            }
            const tokenIndex = metadata.pages.findIndex((page) => page.id === "token-reference");
            if (tokenIndex < 0) throw new Error("token-reference page is missing");
            metadata.pages.splice(tokenIndex + 1, 0, {
              id: "icons",
              title: "Icons",
              section: "foundations",
              group: "Foundations",
              order: 2,
              type: "foundation",
              renderer: "icon-reference",
              description: "Browse, search, preview, and copy usage for the shared VyrnForge SVG icon catalog.",
              releaseLine: "non-grid-beta",
              sourcePath: "packages/ui-core/src/icons.ts",
              tags: ["icons", "svg", "design-system", "accessibility"],
            });
            write(metadataFile, `${JSON.stringify(metadata, null, 2)}\n`);
          }

          replaceOnce(
            "scripts/generate-documentation-registry.mjs",
            '  "discovery-reference",\n  "example",',
            '  "discovery-reference",\n  "icon-reference",\n  "example",',
          );
          replaceOnce(
            "apps/docs/src/referenceRoutes.ts",
            '  | "discovery-reference"\n  | "example"',
            '  | "discovery-reference"\n  | "icon-reference"\n  | "example"',
          );

          const registryTest = "scripts/documentation-registry.test.mjs";
          const registrySource = read(registryTest);
          if (!registrySource.includes('page.id === "icons"')) {
            const marker = '  assert(registry.pages.some((page) => page.id === "component-reference"));\n  assert(registry.pages.some((page) => page.id === "releases"));';
            const replacement = '  assert(registry.pages.some((page) => page.id === "component-reference"));\n' +
              '  const iconsPage = registry.pages.find((page) => page.id === "icons");\n' +
              '  assert(iconsPage);\n' +
              '  assert.equal(iconsPage.renderer, "icon-reference");\n' +
              '  assert.equal(iconsPage.sourcePath, "packages/ui-core/src/icons.ts");\n' +
              '  assert.equal(iconsPage.section, "foundations");\n' +
              '  assert(registry.pages.some((page) => page.id === "releases"));';
            if (!registrySource.includes(marker)) throw new Error("Documentation Registry test patch marker is missing");
            write(registryTest, registrySource.replace(marker, replacement));
          }
          NODE
      - name: Regenerate Reference registry
        run: npm run generate:reference
      - name: Format implementation
        run: npx prettier --write docs/metadata/documentation-pages.json docs/generated/documentation-registry.json scripts/generate-documentation-registry.mjs scripts/documentation-registry.test.mjs apps/docs/src/referenceRoutes.ts apps/docs/src/DocsPage.tsx apps/docs/src/IconReferencePage.tsx apps/docs/src/main.tsx apps/docs/src/styles/icon-reference.css tests/reference-ui/icon-reference.spec.ts
      - name: Verify generation contracts
        run: |
          npm run verify:reference
          node --test scripts/documentation-registry.test.mjs
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No generated integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata/documentation-pages.json docs/generated scripts/generate-documentation-registry.mjs scripts/documentation-registry.test.mjs apps/docs/src/referenceRoutes.ts apps/docs/src/DocsPage.tsx apps/docs/src/IconReferencePage.tsx apps/docs/src/main.tsx apps/docs/src/styles/icon-reference.css tests/reference-ui/icon-reference.spec.ts
          git diff --cached --check
          git commit -m "docs: register canonical icon Reference catalog"
          git push origin HEAD:feat/icon-reference-catalog
