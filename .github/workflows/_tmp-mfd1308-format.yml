name: Temporary MFD-1308 format
on:
  push:
    branches: [tmp/MFD-1308-format]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx prettier scripts/verify-vue-zero-config.mjs packages/ui-vue/src/zero-config.test.ts --write
      - run: |
          rm .github/workflows/_tmp-mfd1308-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(vue): format zero-config verification"
          git push
