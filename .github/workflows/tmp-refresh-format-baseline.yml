name: Temporary consumer formatting baseline refresh

on:
  push:
    branches:
      - feat/consumer-knowledge-playground

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consumer-knowledge-playground
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Refresh reviewed legacy formatting baseline
        run: |
          node scripts/verify-format.mjs --write-baseline
          npm run inventory:repository
          rm .github/workflows/tmp-refresh-format-baseline.yml
      - name: Commit baseline refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: refresh consumer formatting baseline"
          git push origin HEAD:feat/consumer-knowledge-playground
