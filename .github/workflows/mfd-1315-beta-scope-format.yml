name: MFD-1315 Beta Scope Format

on:
  push:
    branches:
      - feat/MFD-1315-vue-release-integration

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[mfd-1315-beta-scope-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/MFD-1315-vue-release-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/metadata/non-grid-beta-scope.json
      - name: Commit formatted beta scope
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/metadata/non-grid-beta-scope.json
          git commit -m 'style(release): format beta scope [mfd-1315-beta-scope-format]' || exit 0
          git push
