name: Docs owned examples projection

on:
  push:
    branches:
      - codex/docs-owned-examples-projection

permissions:
  contents: write

jobs:
  project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/docs-owned-examples-projection
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require(\"./package.json\").packageManager.split(\"@\").pop()')"

      - name: Install dependencies
        run: npm ci

      - name: Apply owned documentation projection slice
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          generator = "scripts/generate-component-reference.mjs"
          replace_once(
              generator,
              '''    styling: {\n      classes: documentation?.theming?.classes ?? component.cssClasses ?? [],\n      variables:\n        documentation?.theming?.variables ?? component.cssVariables ?? [],\n    },\n    docsPath: cleanText(component.docsPath),''',
              '''    styling: {\n      classes: documentation?.theming?.classes ?? component.cssClasses ?? [],\n      variables:\n        documentation?.theming?.variables ?? component.cssVariables ?? [],\n    },\n    examples: documentation?.examples ?? [],\n    releaseNotes: documentation?.releaseNotes ?? [],\n    docsPath: cleanText(component.docsPath),''',
          )
          replace_once(
              generator,
              '''      contractMetadata: contract\n        ? "docs/metadata/component-contracts.json"\n        : null,\n      customElementsManifest:''',
              '''      contractMetadata: contract\n        ? "docs/metadata/component-contracts.json"\n        : null,\n      componentDocumentation: documentation?.sourcePath ?? null,\n      customElementsManifest:''',
          )
          replace_once(
              generator,
              '''      "packages/ui-elements/custom-elements.json",\n    ],''',
              '''      "packages/ui-elements/custom-elements.json",\n      ...context.componentDocumentation.sourcePaths,\n    ],''',
          )
          replace_once(
              generator,
              '''    knownLimitations: component.knownLimitations,\n    styling: component.styling,''',
              '''    knownLimitations: component.knownLimitations,\n    examples: component.examples,\n    releaseNotes: component.releaseNotes,\n    styling: component.styling,''',
          )

          reference_data = "apps/docs/src/referenceData.ts"
          replace_once(
              reference_data,
              '''export type ReferenceFrameworkUsage = {\n  label: string;\n  status: string;\n  package: string | null;\n  setup: string;\n  example: string;\n  note: string;\n};\n\nexport type ComponentReferenceRecord = {''',
              '''export type ReferenceFrameworkUsage = {\n  label: string;\n  status: string;\n  package: string | null;\n  setup: string;\n  example: string;\n  note: string;\n};\n\nexport type ReferenceComponentExample = {\n  id: string;\n  title: string;\n  intent: string;\n  frameworks: ReferenceFrameworkId[];\n};\n\nexport type ReferenceReleaseNote = {\n  version: string;\n  summary: string;\n  migration?: string;\n};\n\nexport type ComponentReferenceRecord = {''',
          )
          replace_once(
              reference_data,
              '''  accessibilityNotes: string;\n  knownLimitations: string[];\n  styling:''',
              '''  accessibilityNotes: string;\n  knownLimitations: string[];\n  examples: ReferenceComponentExample[];\n  releaseNotes: ReferenceReleaseNote[];\n  styling:''',
          )

          specimen = Path("apps/docs/src/ReferenceComponentSpecimen.tsx")
          text = specimen.read_text()
          import_marker = '''} from "@vyrnforge/ui-components";\n'''
          if text.count(import_marker) != 1:
              raise SystemExit("Unexpected VyrnForge import shape")
          text = text.replace(
              import_marker,
              import_marker + '''\nimport type {\n  ReferenceComponentExample,\n  ReferenceFrameworkId,\n} from "./referenceData";\n''',
              1,
          )
          text = text.replace(
              '''type SpecimenRenderer = (state: SpecimenState) => ReactNode;''',
              '''type SpecimenContext = SpecimenState & {\n  examples: ReferenceComponentExample[];\n  frameworkId: ReferenceFrameworkId;\n};\n\ntype SpecimenRenderer = (context: SpecimenContext) => ReactNode;''',
              1,
          )
          start = text.index("const renderButton: SpecimenRenderer = () => (")
          end = text.index("\n\nconst renderBadge:", start)
          button_block = '''const buttonExampleContent: Record<string, ReactNode> = {\n  variants: (\n    <Inline gap="sm" wrap>\n      <Button variant="primary">Primary</Button>\n      <Button>Default</Button>\n      <Button variant="subtle">Subtle</Button>\n      <Button variant="ghost">Ghost</Button>\n      <Button variant="danger">Danger</Button>\n    </Inline>\n  ),\n  sizes: (\n    <Inline align="center" gap="sm" wrap>\n      <Button size="sm">Small</Button>\n      <Button size="md">Medium</Button>\n      <Button size="lg">Large</Button>\n    </Inline>\n  ),\n  states: (\n    <Inline gap="sm" wrap>\n      <Button disabled>Disabled</Button>\n      <Button loading variant="primary">\n        Saving\n      </Button>\n    </Inline>\n  ),\n  width: (\n    <Button fullWidth variant="primary">\n      Continue\n    </Button>\n  ),\n  content: (\n    <Inline gap="sm" wrap>\n      <Button leadingIcon={<Icon name="Settings" />}>Settings</Button>\n      <Button trailingIcon={<Icon name="Refresh" />} variant="subtle">\n        Refresh\n      </Button>\n    </Inline>\n  ),\n  "form-actions": (\n    <Inline gap="sm" wrap>\n      <Button type="submit" value="save" variant="primary">\n        Save changes\n      </Button>\n      <Button type="reset">Reset</Button>\n    </Inline>\n  ),\n};\n\nconst renderButton: SpecimenRenderer = ({ examples, frameworkId }) => {\n  const visibleExamples = examples.filter(\n    (example) =>\n      example.frameworks.includes(frameworkId) &&\n      Boolean(buttonExampleContent[example.id]),\n  );\n\n  if (visibleExamples.length === 0) {\n    return (\n      <Text size="sm" tone="muted">\n        No owned example is declared for this framework surface.\n      </Text>\n    );\n  }\n\n  return (\n    <Stack gap="lg">\n      {visibleExamples.map((example) => (\n        <ButtonExampleGroup\n          description={example.intent}\n          key={example.id}\n          title={example.title}\n        >\n          {buttonExampleContent[example.id]}\n        </ButtonExampleGroup>\n      ))}\n    </Stack>\n  );\n};'''
          text = text[:start] + button_block + text[end:]
          old_signature = '''export function ReferenceComponentSpecimen({\n  componentId,\n  relatedPatterns,\n}: {\n  componentId: string;\n  relatedPatterns: string[];\n}) {'''
          new_signature = '''export function ReferenceComponentSpecimen({\n  componentId,\n  examples,\n  frameworkId,\n  relatedPatterns,\n}: {\n  componentId: string;\n  examples: ReferenceComponentExample[];\n  frameworkId: ReferenceFrameworkId;\n  relatedPatterns: string[];\n}) {'''
          if text.count(old_signature) != 1:
              raise SystemExit("Unexpected specimen signature shape")
          text = text.replace(old_signature, new_signature, 1)
          old_context = '''    renderer({\n      checked,\n      dialogOpen,\n      setChecked,'''
          new_context = '''    renderer({\n      checked,\n      dialogOpen,\n      examples,\n      frameworkId,\n      setChecked,'''
          if text.count(old_context) != 1:
              raise SystemExit("Unexpected specimen renderer context shape")
          text = text.replace(old_context, new_context, 1)
          specimen.write_text(text)

          page = "apps/docs/src/ComponentReferencePage.tsx"
          replace_once(
              page,
              '''  showInteraction,\n  showTheming,\n  showRelated,\n}: {''',
              '''  showInteraction,\n  showTheming,\n  showRelated,\n  showReleaseNotes,\n}: {''',
          )
          replace_once(
              page,
              '''  showInteraction: boolean;\n  showTheming: boolean;\n  showRelated: boolean;\n}) {''',
              '''  showInteraction: boolean;\n  showTheming: boolean;\n  showRelated: boolean;\n  showReleaseNotes: boolean;\n}) {''',
          )
          replace_once(
              page,
              '''    ...(showRelated ? [["component-related-maturity", "Related"]] : []),\n    ["component-generated-api", "API"],''',
              '''    ...(showRelated ? [["component-related-maturity", "Related"]] : []),\n    ...(showReleaseNotes ? [["component-release-notes", "Release notes"]] : []),\n    ["component-generated-api", "API"],''',
          )
          replace_once(
              page,
              '''  const showRelated =\n    component.guidance.relatedComponents.length > 0 ||\n    component.knownLimitations.length > 0 ||\n    relatedPatterns.length > 0;\n  const framework =''',
              '''  const showRelated =\n    component.guidance.relatedComponents.length > 0 ||\n    component.knownLimitations.length > 0 ||\n    relatedPatterns.length > 0;\n  const showReleaseNotes = component.releaseNotes.length > 0;\n  const framework =''',
          )
          replace_once(
              page,
              '''          <ReferenceComponentSpecimen\n            componentId={component.id}\n            relatedPatterns={relatedPatterns.map((pattern) => pattern.id)}\n          />''',
              '''          <ReferenceComponentSpecimen\n            componentId={component.id}\n            examples={component.examples}\n            frameworkId={frameworkId}\n            relatedPatterns={relatedPatterns.map((pattern) => pattern.id)}\n          />''',
          )
          replace_once(
              page,
              '''        <section\n          className="vf-docs-reference__section"\n          id="component-generated-api"\n        >''',
              '''        {showReleaseNotes ? (\n          <section\n            className="vf-docs-reference__section"\n            id="component-release-notes"\n          >\n            <Heading level={3} size="md">\n              Release notes\n            </Heading>\n            <div className="vf-docs-release-notes">\n              {component.releaseNotes.map((note) => (\n                <article key={`${note.version}-${note.summary}`}>\n                  <Heading level={4} size="sm">\n                    {note.version}\n                  </Heading>\n                  <Text>{note.summary}</Text>\n                  {note.migration ? (\n                    <Text size="sm" tone="muted">\n                      Migration: {note.migration}\n                    </Text>\n                  ) : null}\n                </article>\n              ))}\n            </div>\n          </section>\n        ) : null}\n\n        <section\n          className="vf-docs-reference__section"\n          id="component-generated-api"\n        >''',
          )
          replace_once(
              page,
              '''        showInteraction={showInteraction}\n        showRelated={showRelated}\n        showTheming={showTheming}\n      />''',
              '''        showInteraction={showInteraction}\n        showRelated={showRelated}\n        showReleaseNotes={showReleaseNotes}\n        showTheming={showTheming}\n      />''',
          )

          architecture = "docs/architecture/15-component-documentation-ownership.md"
          replace_once(
              architecture,
              '''The current Reference projection consumes owned Button guidance but does not yet\nproject the owned `examples` and `releaseNotes` collections into the normalized\ncomponent record. `apps/docs/src/ReferenceComponentSpecimen.tsx` therefore still\ncontains component-specific specimen rendering and some scenario prose. The\nrendering adapter may remain host-specific, but scenario meaning must come from\ngenerated owned documentation rather than a Docs-local registry.\n''',
              '''The Reference projection includes owned `examples` and `releaseNotes` in the\nnormalized component record and AI component slice. Docs consumes scenario\ntitles, intent, framework applicability, and release notes from that generated\nprojection. `apps/docs/src/ReferenceComponentSpecimen.tsx` retains only the\nexecutable React-host rendering adapter required to draw live specimens.\n''',
          )

          contract = Path("scripts/component-documentation-ownership-contract.test.mjs")
          text = contract.read_text()
          text = text.replace(
              '''function read(relativePath) {\n  return readFileSync(path.join(root, relativePath), "utf8");\n}\n''',
              '''function read(relativePath) {\n  return readFileSync(path.join(root, relativePath), "utf8");\n}\n\nfunction json(relativePath) {\n  return JSON.parse(read(relativePath));\n}\n''',
              1,
          )
          text = text.replace(
              '''  const specimenHost = read("apps/docs/src/ReferenceComponentSpecimen.tsx");\n''',
              '''  const specimenHost = read("apps/docs/src/ReferenceComponentSpecimen.tsx");\n  const knowledge = json("docs/generated/consumer-knowledge.json");\n  const generatedButton = knowledge.components.find(\n    (component) => component.id === "button",\n  );\n''',
              1,
          )
          text = text.replace(
              '''  assert.match(\n    generator,\n    /loadOwnedComponentDocumentation/u,\n    "the existing component-reference generator must ingest package-owned documentation",\n  );\n''',
              '''  assert.match(\n    generator,\n    /loadOwnedComponentDocumentation/u,\n    "the existing component-reference generator must ingest package-owned documentation",\n  );\n  assert.deepEqual(generatedButton.examples, button.examples);\n  assert.deepEqual(generatedButton.releaseNotes, button.releaseNotes);\n  assert.equal(generatedButton.source.componentDocumentation, button.sourcePath);\n''',
              1,
          )
          text = text.replace(
              '''  assert.match(architecture, /owned `examples` and `releaseNotes`/u);\n  assert.match(architecture, /rendering adapters/u);''',
              '''  assert.match(architecture, /includes owned `examples` and `releaseNotes`/u);\n  assert.match(architecture, /rendering adapter/u);''',
              1,
          )
          contract.write_text(text)
          PY

      - name: Format projection sources
        run: npx prettier --write scripts/generate-component-reference.mjs apps/docs/src/referenceData.ts apps/docs/src/ReferenceComponentSpecimen.tsx apps/docs/src/ComponentReferencePage.tsx docs/architecture/15-component-documentation-ownership.md scripts/component-documentation-ownership-contract.test.mjs

      - name: Regenerate Reference projection
        run: npm run generate:reference

      - name: Verify focused ownership contract
        run: node --test scripts/component-documentation-ownership-contract.test.mjs

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit generated projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/src docs/architecture/15-component-documentation-ownership.md scripts/generate-component-reference.mjs scripts/component-documentation-ownership-contract.test.mjs docs/generated
          git commit -m "refactor(docs): project owned component examples"
          git push origin HEAD:codex/docs-owned-examples-projection
