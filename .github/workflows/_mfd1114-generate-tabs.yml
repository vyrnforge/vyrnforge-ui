name: MFD-1114 Tabs artifact generation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'mfd-1114-tabs-generation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Tabs branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mfd-1114-tabs-generation

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Generate and validate Tabs artifacts
        shell: bash
        run: |
          npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
          npm ci
          npx prettier --write scripts/framework-tabs-generation.mjs scripts/generate-framework-tabs-slice.mjs scripts/generated-framework-artifacts.mjs scripts/generated-framework-artifacts.test.mjs
          rm -f .github/workflows/_mfd1114-generate-tabs.yml
          npm run generate:framework-artifacts
          npm run inventory:repository
          npm run verify:generated-framework-artifacts
          node --test scripts/generated-framework-artifacts.test.mjs

      - name: Commit generated Tabs slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/framework-tabs-generation.mjs \
            scripts/generate-framework-tabs-slice.mjs \
            scripts/generated-framework-artifacts.mjs \
            scripts/generated-framework-artifacts.test.mjs \
            tests/consumers/native-html/src/generated/vf-tabs.generated.ts \
            tests/consumers/react/src/generated/Tabs.generated.tsx \
            tests/consumers/angular/src/app/generated/vf-tabs.generated.ts \
            tests/consumers/vue/src/generated/VfTabs.generated.ts \
            docs/governance/repository-inventory.md \
            .github/workflows/_mfd1114-generate-tabs.yml
          git commit -m "feat: generate Tabs across four framework surfaces"
          git push origin HEAD:mfd-1114-tabs-generation
