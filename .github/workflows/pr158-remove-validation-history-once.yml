name: PR158 remove validation history once

on:
  push:
    branches:
      - chore/repo-wide-rollout-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/repo-wide-rollout-cleanup
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Remove obsolete historical validation model
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_path = Path('docs/metadata/validation-layers.json')
          metadata = json.loads(metadata_path.read_text())
          groups = metadata.get('internalCommandGroups', {})
          groups.pop('historicalEvidenceTests', None)
          groups.pop('historicalEvidenceVerification', None)
          metadata.pop('historicalEvidence', None)
          metadata['checks'] = [check for check in metadata.get('checks', []) if check.get('id') != 'historical-evidence']
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n')

          verifier_path = Path('scripts/validation-model.mjs')
          source = verifier_path.read_text()
          blocks = [
          '''  assert(
            metadata.historicalEvidence?.normalValidation === false,
            "historical evidence must be excluded from normal validation",
          );
          assert(
            metadata.historicalEvidence?.scopeVariable ===
              "CI_SCOPE_HISTORICAL_EVIDENCE",
            "historical evidence must use its dedicated scope variable",
          );

          ''',
          '''  assert(
            scopedRunner.includes("CI_SCOPE_HISTORICAL_EVIDENCE"),
            "scoped runner must expose the historical-evidence scope",
          );
          assert(
            scopedRunner.includes('"test:historical-evidence"') &&
              scopedRunner.includes('"verify:historical-evidence"'),
            "scoped runner must execute both historical evidence groups when selected",
          );
          ''',
          ]
          for block in blocks:
              if block not in source:
                  raise SystemExit('validation history assertion block not found')
              source = source.replace(block, '')
          verifier_path.write_text(source)
          PY
      - run: npx prettier --write docs/metadata/validation-layers.json scripts/validation-model.mjs
      - run: node scripts/verify-validation-model.mjs
      - run: rm .github/workflows/pr158-remove-validation-history-once.yml
      - name: Commit validation model cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove historical evidence validation model"
          git push
