name: Temporary BC-1607 exception migration

on:
  push:
    branches:
      - tmp/bc-1607-exception-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use repository package manager
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.split("@").pop()')"
      - name: Install dependencies
        run: npm ci
      - name: Migrate and verify current exception evidence
        shell: bash
        run: |
          node .tmp/bc1607-migrate.mjs
          npx prettier --write package.json docs/metadata/framework-exceptions.json scripts/verify-framework-exceptions.mjs scripts/verify-framework-exceptions.test.mjs
          npm run inventory:repository
          npx prettier --write docs/governance/repository-inventory.md
          npm run test:framework-exceptions
          npm run verify:framework-exceptions
          npm run verify:repository-inventory
      - name: Commit migrated evidence and remove helpers
        shell: bash
        run: |
          rm .github/workflows/tmp-bc1607-exception-migration.yml
          rm .tmp/bc1607-migrate.mjs
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: consolidate current framework exception evidence"
          git push
