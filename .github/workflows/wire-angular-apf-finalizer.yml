name: Wire Angular APF Finalizer

on:
  push:
    branches: [refactor/1051-standard-tooling]
    paths:
      - tooling/verify/wire-angular-apf-finalizer.mjs
      - .github/workflows/wire-angular-apf-finalizer.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/1051-standard-tooling
          fetch-depth: 0
      - run: node tooling/verify/wire-angular-apf-finalizer.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(angular): finalize APF output for root package publishing"
          git pull --rebase origin refactor/1051-standard-tooling
          git push origin HEAD:refactor/1051-standard-tooling
