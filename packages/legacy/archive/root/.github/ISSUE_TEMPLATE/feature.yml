name: Feature proposal
description: Propose a reusable VyrnForge UI capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reusable VyrnForge capabilities. Check existing components, primitives, behaviors, tokens, contracts, generators, utilities, and patterns before proposing new surface area. Do not choose a framework package as the semantic owner when the capability belongs in a shared foundation.
  - type: textarea
    id: user-problem
    attributes:
      label: User problem
      description: What user or application problem should this solve?
    validations:
      required: true
  - type: textarea
    id: reusable-use-case
    attributes:
      label: Reusable use case
      description: Describe the applications, workflows, data experiences, administration, reporting, or other reusable UI scenarios this should support.
    validations:
      required: true
  - type: textarea
    id: existing-foundation
    attributes:
      label: Existing VyrnForge foundation considered
      description: List existing components, primitives, behaviors, tokens, contracts, generators, utilities, or patterns that were considered for reuse or extension.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Expected reuse across applications
      description: Explain why this belongs in VyrnForge rather than one consuming application.
    validations:
      required: true
  - type: dropdown
    id: architecture-layer
    attributes:
      label: Likely architectural layer
      description: Choose the conceptual layer, not a package merely because it currently contains a related implementation.
      options:
        - Shared design tokens / styling foundation
        - Shared behavior / state / interaction contract
        - Common UI component capability
        - Native HTML / Custom Elements integration
        - React integration
        - Angular integration
        - Vue integration
        - Optional advanced UI module
        - Tooling / generator / metadata / documentation
        - Not sure — architecture review required
    validations:
      required: true
  - type: checkboxes
    id: framework-surfaces
    attributes:
      label: Expected framework surfaces
      description: Select all surfaces that should ultimately expose the capability. Initial release scope may be narrower only when explicit.
      options:
        - label: Native HTML / Custom Elements
        - label: React
        - label: Angular
        - label: Vue
  - type: textarea
    id: contract-concept
    attributes:
      label: Shared contract concept
      description: Sketch framework-neutral behavior, state, events, accessibility semantics, slots/templates, tokens, or extension points if known. Framework syntax may be described separately where it genuinely differs.
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility behavior
      description: Describe keyboard, focus, labeling, ARIA/semantics, contrast, motion, and assistive-technology expectations.
    validations:
      required: true
  - type: textarea
    id: dependency-impact
    attributes:
      label: Dependency impact
      description: State whether this requires new dependencies. Large UI, styling, query/table, or state-management ecosystems require explicit approval.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe reuse, extension, composition, or application-level alternatives that were considered.
