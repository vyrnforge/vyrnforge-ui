<section aria-label="Account summary" aria-busy="true" style="position:relative;min-block-size:8rem;border:1px solid var(--vf-color-border-required);border-radius:var(--vf-radius-surface);padding:var(--vf-space-md)">
  <div inert><p>Account details</p><button data-vf-button>Refresh</button></div>
  <div data-vf-backdrop aria-hidden="true"></div>
  <div data-vf-loading style="position:absolute;inset:0;display:grid;place-items:center">
    <span data-vf-loading-indicator data-vf-loading-variant="spinner" aria-hidden="true"></span>
  </div>
</section>
<p role="status">Refreshing account summary</p>
