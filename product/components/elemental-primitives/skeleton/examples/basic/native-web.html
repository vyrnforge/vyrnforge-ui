<section
  aria-label="Latest activity"
  aria-busy="true"
  data-vf-grid
  data-vf-grid-gap="md"
  style="--vf-grid-min-item-size: 16rem"
>
  <article data-vf-surface style="padding: var(--vf-space-md)">
    <div data-vf-stack data-vf-stack-gap="sm">
      <div
        data-vf-skeleton
        data-vf-aspect-ratio
        data-vf-aspect-ratio-value="video"
        aria-hidden="true"
      ></div>

      <div data-vf-inline data-vf-inline-gap="sm">
        <div
          data-vf-skeleton
          data-vf-skeleton-shape="circle"
          data-vf-aspect-ratio
          data-vf-aspect-ratio-value="square"
          aria-hidden="true"
          style="inline-size: 2.5rem"
        ></div>

        <div data-vf-stack data-vf-stack-gap="xs" style="flex: 1 1 auto">
          <div
            data-vf-skeleton
            data-vf-skeleton-shape="line"
            aria-hidden="true"
            style="inline-size: 70%"
          ></div>
          <div
            data-vf-skeleton
            data-vf-skeleton-shape="line"
            aria-hidden="true"
            style="inline-size: 45%"
          ></div>
        </div>
      </div>
    </div>
  </article>
</section>

<p role="status">Loading latest activity</p>
