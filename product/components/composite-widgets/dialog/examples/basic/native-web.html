<button type="button" id="dialog-trigger">Open dialog</button>
<dialog
  id="example-dialog"
  data-vf-dialog-root
  data-vf-backdrop-dismiss
  aria-labelledby="example-dialog-title"
  aria-describedby="example-dialog-description"
>
  <h2 id="example-dialog-title" data-vf-dialog-title>Edit profile</h2>
  <p id="example-dialog-description" data-vf-dialog-description>Update the fields you want to change.</p>
  <div data-vf-dialog-body>Profile form content</div>
  <button type="button" data-vf-dialog-close>Close</button>
</dialog>
<script>
  const trigger = document.querySelector('#dialog-trigger');
  const dialog = document.querySelector('#example-dialog');
  const close = dialog.querySelector('[data-vf-dialog-close]');

  const restoreAndClose = () => {
    dialog.close();
    trigger.focus();
  };

  trigger.addEventListener('click', () => dialog.showModal());
  close.addEventListener('click', restoreAndClose);
  dialog.addEventListener('cancel', (event) => {
    event.preventDefault();
    restoreAndClose();
  });
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) restoreAndClose();
  });
</script>
