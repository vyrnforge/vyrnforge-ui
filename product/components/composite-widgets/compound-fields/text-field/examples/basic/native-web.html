<link rel="stylesheet" href="@vyrnforge/web/styles/text-field.css">
<div data-vf-text-field data-vf-text-field-full-width data-vf-text-field-variant="outlined">
  <label data-vf-text-field-label for="email">Email address</label>
  <div data-vf-text-field-control>
    <input data-vf-input data-vf-text-field-value id="email" name="email" type="email" autocomplete="email" aria-describedby="email-help">
  </div>
  <div data-vf-text-field-description id="email-help">Use an address you can access.</div>
</div>
